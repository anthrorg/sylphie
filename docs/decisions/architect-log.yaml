  - id: AD-0007
    date: 2026-06-16
    title: EfficientNet retirement grep gate targets first-party SYMBOLS, not a blanket -ri
    status: accepted
    context: >
      HIGH-3. TK-25 AC#1 "grep -ri efficientnet => ZERO" is unsatisfiable:
      torchvision in the .venv defines efficientnet, and first-party docstrings
      reference EfficientNet at main.py:253/256/887, types/observation.py:182, plus
      a real const _DEFAULT_MODEL_FILENAME = "efficientnet_b0.onnx"
      (feature_extraction.py:342). Also the face-path comment main.py:188 says face
      "keeps OnnxEmbeddingExtractor" — TK-24 AC#2 already flags it stale (ArcFace is
      its own extractor).
    decision: >
      Scope the retirement gate to first-party CODE SYMBOLS, excluding .venv: the
      gate must show ZERO of (class OnnxEmbeddingExtractor definition,
      _DEFAULT_MODEL_FILENAME / the efficientnet_b0.onnx filename literal, any live
      OnnxEmbeddingExtractor instantiation/import) under packages/perception-service,
      excluding site-packages/.venv. Explanatory comments/docstrings that merely
      mention EfficientNet historically may remain (or be cleaned opportunistically)
      and must NOT fail the gate. Fold the stale main.py:188 face comment fix into
      TK-25 (it becomes false once the symbol is deleted).
    rationale: >
      A literal repo-wide case-insensitive grep can never reach zero with
      torchvision vendored and history documented in prose. The retirement invariant
      that matters is "no live EfficientNet code symbol / model artifact remains,"
      which is symbol-scoped and .venv-excluded.
    alternatives:
      - option: Require zero matches including comments
        rejected_because: >
          Forces churny doc deletion and still cannot exclude .venv without the same
          scoping; no added safety.
    consequences: >
      TK-25 AC#1 + AC#2 reworded to symbol+path scoping. The acceptance grep is
      deterministic and reachable. TK-24's "stale comment" finding is the same
      main.py:188 line.
    canon: none
    evidence:
      - packages/perception-service/cobeing/layer2_perception/feature_extraction.py:342
      - packages/perception-service/main.py:188
    supersedes: null

  - id: AD-0008
    date: 2026-06-16
    title: Docker HEALTHCHECK AC = hang/timeout, not crash; DB-bound probe needs start-period
    status: accepted
    context: >
      HIGH-6. TK-43 AC#2 says the container "becomes unhealthy if the app crashes."
      A crashed Node process exits the container (Docker state 'exited'), it does not
      flip Health.Status to unhealthy — HEALTHCHECK detects a HUNG/unresponsive app.
      Also GET /metrics/health (metrics.controller.ts:144) computes 7 CANON metrics,
      each running TimescaleDB queries in parallel (Promise.all) — not free.
    decision: >
      Reword TK-43 AC#2 to a hang/timeout scenario: after startup Health.Status
      becomes healthy; if the app is made unresponsive (e.g. event-loop blocked /
      endpoint hangs past the probe timeout), Health.Status becomes unhealthy after
      the configured retries. The HEALTHCHECK must set --start-period generous enough
      for boot + first DB-backed probe and --timeout above the measured p95 of
      /metrics/health, with --interval at 30s. Keep budget tiny (Dockerfile-only) but
      allow the start-period/timeout/retries flags.
    rationale: >
      The AC must assert what HEALTHCHECK can actually observe. /metrics/health is an
      acceptable probe target (it already exists, no new endpoint per the non-goal)
      but it is DB-bound, so the probe timing must accommodate it rather than assume
      a cheap ping.
    alternatives:
      - option: Add a new lightweight /healthz that does no DB work
        rejected_because: >
          TK-43 non_goals forbid a new endpoint; and a liveness probe that ignores DB
          readiness is less useful for Railway. Revisit only if /metrics/health p95
          proves too slow for a 30s interval.
    consequences: >
      TK-43 becomes runnable (docker inspect Health.Status transitions are
      observable). Probe timing is explicit. No new endpoint.
    canon: none
    evidence:
      - apps/sylphie/src/controllers/metrics.controller.ts:144
    supersedes: null

