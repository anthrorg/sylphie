  - id: AD-0017
    date: 2026-06-16
    title: RISK-1 Fork C carrier — convert to a tracked RISK, fully mitigated by the TK-19 POC gating EP-4
    status: accepted
    context: >
      RISK-1 is currently typed as an "issue" (status open), which blocks the
      analyze gate, but its content is a RISK: the sceneNudge bit must reach
      categorizeFrame via frame.raw['system_trigger'] (the carrier decided in
      AD-0003). The mechanism is already designed (AD-0003) and explicitly
      de-risked by the TK-19 POC, which gates TK-21/TK-22 and therefore all of
      EP-4 — nothing in Fork C builds until TK-19 proves the stamped flag
      survives sample() and reaches categorizeFrame.
    decision: >
      Reclassify RISK-1 from issue to risk (probability: low, impact: high,
      with the AD-0003 carrier + TK-19 POC as the mitigation), status managed.
      It is not an open issue — it is a known, mitigated risk whose mitigation
      (TK-19 POC as a hard gate ahead of any EP-4 build) is already in the plan.
      This clears the analyze gate's open-issue check while keeping the risk
      visibly tracked rather than silently closed.
    rationale: >
      The gate blocks on open ISSUES, not on risks — and the substance here is a
      tracked, mitigated risk, not an unresolved defect. AD-0003 already decided
      the carrier; TK-19 already gates the build on proving it. The correct
      governance shape is a risk with probability/impact/mitigation, not a
      perpetually-open issue. Probability low (the frame.raw side-channel already
      carries turn_id/undiscovered_count through sample(), so the pattern is
      proven); impact high (if it failed, Fork C triggering would not fire) —
      hence worth tracking, fully covered by the POC gate.
    alternatives:
      - option: Close RISK-1 outright as resolved
        rejected_because: >
          The POC has not yet RUN (TK-19 is routed-ahead, not executed); closing
          it would overstate certainty. A managed risk gated by TK-19 is honest.
      - option: Leave it as an open issue
        rejected_because: >
          Mis-typed (it is a risk, not a defect) and would block the gate on
          something already mitigated by TK-19.
    consequences: >
      RISK-1 type issue->risk, status open->managed, with probability/impact/
      mitigation fields. TK-19's POC result is its closure trigger. Analyze gate's
      open-issue check passes (no open issues remain).
    canon: none
    evidence:
      - docs/decisions/architect-log.yaml:78
      - planning/contract.yaml:1301
