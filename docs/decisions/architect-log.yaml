      (tts.service.ts:17, 24, 59 — one ElevenLabs voice id for all output). The
      question asks whether to build a per-person voice cache. No ticket, epic,
      or vision goal asks for per-person voices; it is net-new product scope.
    decision: >
      Non-goal for this plan. Sylphie speaks with one voice (hers); there is no
      product requirement for her to render different voices per interlocutor.
      Keep the global voiceId. Do not build a per-person voice cache.
    rationale: >
      A per-person voice cache is speculative scope no ticket motivated
      (CON-1 / scope discipline). Sylphie having a single stable voice is the
      correct identity model — varying her output voice by listener is neither
      requested nor coherent with a single-agent identity. The global cache
      already serves the only need (one voice, cached).
    alternatives:
      - option: Build a per-person voice cache now
        rejected_because: >
          Unrequested feature; revisit only if a concrete product need for
          per-listener voice rendering is raised by Jim — then it gets its own
          plan node.
    consequences: >
      Q-2 resolves to NG-2. tts.service.ts stays single-voice. No ticket added.
