  - id: AD-0045
    date: 2026-07-02
    title: EWC consolidation seam — shared main.py helper called from the train handler when advance_mode() returns True; BootstrapTracker stays pure; endpoint kept as manual override
    status: accepted
    context: >
      Item 20260702-002 CRITICAL-1. The plan's Fix #2 says "fold consolidation
      into advance_mode()", but BootstrapTracker.advance_mode()
      (inference/bootstrap.py:249-270) is a pure agreement state machine with
      no access to trainer/buffer, and its class contract is main-thread-only,
      no locks (bootstrap.py:39-41). The consolidation code (EWC anchor +
      Fisher pass) lives in main.py's phase_transition handler (:569-608),
      which has zero runtime callers (repo-wide grep: only docs/tests/POC).
      The REAL production mode transition happens in the train handler:
      tracker.advance_mode() at main.py:421, inside submit_training_sample,
      where _state.trainer and _state.buffer are already in scope.
    decision: >
      The consolidation seam is main.py, NOT the tracker. Extract the anchor +
      Fisher block (main.py:569-608) into a module-level helper
      _consolidate_phase_boundary(trainer, buffer) in main.py. Call sites:
      (1) the train handler — when tracker.advance_mode() returns True at
      main.py:421, invoke the helper immediately after (this is the production
      trigger and covers every transition incl. partial->full, since the
      periodic advance check at :417-421 is outside the mode!="full" recording
      guard at :398); (2) the existing POST /cognition/phase-transition
      endpoint, kept as the manual/supervisor override, delegating to the same
      helper (it additionally sets tracker.mode explicitly). Data flow inside
      the helper, per the ordering fix: weights = trainer.get_weights();
      calibration = buffer.snapshot_calibration(1000, stratified=True);
      compute_fisher(trainer, calibration) in a guarded try (ValueError on
      empty buffer -> warn); then set_reference(weights) UNCONDITIONALLY
      (anchor must survive a failed Fisher pass — build-notes.md:103 guard).
      Do NOT inject trainer into BootstrapTracker.
    rationale: >
      advance_mode() is deliberately a pure, lock-free decision function;
      consolidation is an application-layer side effect owned by the layer
      that owns trainer/buffer (main.py module state). Calling the helper
      where advance_mode() returns True is the smallest wiring that makes the
      production transition and the manual endpoint share one code path — no
      layer violation, no new coupling, endpoint behavior preserved.
      Thread-safety envelope is unchanged: the endpoint already runs
      get_weights/compute_fisher from the FastAPI thread while the training
      thread (trainer.py:484-518, _weight_lock) steps; the new call site is
      the same thread. The ticket should still verify the EWC calls take
      _weight_lock (existing exposure, now exercised for real).
    alternatives:
      - option: Inject trainer/ewc into BootstrapTracker and consolidate inside advance_mode()
        rejected_because: >
          Layer violation — turns a pure agreement tracker into a training
          orchestrator and breaks its documented no-locks main-thread contract.
      - option: Only wire a supervisor-side caller for the HTTP endpoint (SidecarControlService.phaseTransition())
        rejected_because: >
          The live mode state machine advances via advance_mode() in the train
          handler, not via the supervisor; an HTTP-only trigger leaves the
          production transition unconsolidated unless the supervisor perfectly
          mirrors internal state — fragile duplication. Revisit if mode
          authority ever moves to the supervisor.
    consequences: >
      Consolidation fires exactly once per real mode transition; the
      penalty_gradients zeros path (replay.py:392-393) closes after the first
      transition with a non-empty buffer. The re-planned TK-C carries: helper
      extraction, both call sites, transition-invokes-consolidation
      integration test (incl. the ->full boundary), and a weight-lock
      verification item.
    canon: "resolves the Std-4 exposure recorded in AD-0047 (EWC documented active while dead); no new tension"
    evidence:
      - packages/cognition-service/inference/bootstrap.py:249
      - packages/cognition-service/inference/bootstrap.py:39
      - packages/cognition-service/main.py:421
      - packages/cognition-service/main.py:569
      - packages/cognition-service/main.py:398
      - packages/cognition-service/training/replay.py:392
      - packages/cognition-service/training/trainer.py:484
      - planning/build-notes.md:103
