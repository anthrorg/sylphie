  - id: AD-0028
    date: 2026-06-17
    title: Q-17 legacy to guardian migration — tighten filter, hard-stop on backup failure, dry-run reports its own N
    status: accepted
    context: >
      TK-78 is a destructive prod migration. (a) The filter (grounding_person_id
      IS NULL AND knowledge_grounding=GROUNDED) could match NEW world-scoped rows;
      (b) the pg_dump backup continues-with-WARN on failure; (c) the 293 count
      cannot be verified statically and may have been zeroed by a DB reset.
    decision: >
      (a) Tighten with AND created_at < 2026-06-13 (the Wave-3 isolation merge
      date) so post-isolation world rows cannot match. (b) Hard-stop on backup
      failure (process.exit(1)); never continue-with-WARN on a destructive prod
      migration. (c) Remove the hard-coded 293 — the counted dry-run reports its
      OWN matched N and the apply count must equal the dry-run N.
    rationale: >
      A destructive prod migration must be conservative on all three axes: an
      over-broad filter risks corrupting new world rows; continue-on-backup-failure
      risks an irreversible write with no restore point; a hard-coded count that
      no longer matches reality silently mis-migrates or fails confusingly.
    alternatives:
      - option: Keep the loose filter / continue-with-WARN / hard-coded 293
        rejected_because: >
          Each is an irreversibility or correctness hazard unacceptable at
          engineering_level production.
    consequences: >
      TK-78 ACs updated. Q-17 resolves to DEC-17.
    canon: "supports provenance-required; the tightened filter avoids touching Std-3 world rows"
    evidence:
      - planning/contract.yaml:1373
      - "git commit 1f53de2 (Wave-3 three-graph isolation, 2026-06-13)"
    supersedes: null

