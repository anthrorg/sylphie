  - id: AD-0038
    date: 2026-06-21
    title: M2 prediction-MAE replay FAIL (0.1105) is a cold-window warmth artifact, NOT a regression — re-anchor is OPTIONAL; the metric is structurally non-comparable across phases. Does NOT block close.
    status: accepted
    context: >
      Final contract-close verification. The replay gate's M2 (assertMAE,
      test/gate/assertions.ts:92) failed: mae 0.1105 vs ceiling 0.0765
      (baseline 0.0465 + 0.03), n=50, flagged REGRESSED (gate-replay.log:176).
      The coordinator asked whether this is (a) a real predict-act-evaluate
      regression that blocks the close, (b) a TK-68 measurement-semantics change
      warranting a re-anchor like AD-0036, or (c) replay non-determinism /
      cold-predictor artifact. Suspect commit 05491ec (TK-68, MaeHistoryStore
      unification) landed AFTER the 2026-06-14 baseline.
    decision: >
      Rule (c)-with-(b)-flavor: M2=0.1105 is a COLD-WINDOW / PHASE-POSITION
      artifact of how the gate metric is captured, NOT a world-model regression.
      The metric is a 50-entry in-process FIFO rolling window
      (AttractorMonitorService.predictionWindow, attractor-monitor.service.ts:143,
      PREDICTION_WINDOW_SIZE) that is NEVER reset between gate phases or between
      the replay-gate and lesion-gate invocations against the same long-lived
      backend. The replay gate captures M2 at PHASE 2 over the FIRST ~50
      predictions of the session (cold start, world model not yet adapted) →
      0.1105; the lesion gate, a LATER invocation against the SAME warmed backend,
      captures M2 over the LATEST 50 predictions (window rolled forward, model
      warmed) → 0.0363, which is BETTER than the 0.0465 baseline and PASSES.
      Same backend, same MaeHistoryStore, same code — only the window contents
      differ by phase position. REMEDY: no fix required and no block. OPTIONALLY
      re-anchor baseline.json's mae block (and add a warmth/phase-position note
      mirroring the provenance note from AD-0036) so a fresh-backend replay-phase
      capture has a comparable anchor; OR leave the baseline and treat M2-under-
      replay as a known cold-window soft signal whose authoritative reading is the
      warmed lesion-phase capture (0.0363, green). Either is acceptable; the
      preferred durable hardening is to capture M2 over a windowed/warmed steady
      state rather than the cold first-50, recorded for a future gate ticket.
    rationale: >
      Four grounded observations rule OUT a regression and rule IN the cold-window
      mechanism. (1) The SAME backend session yields mae=0.1105 (replay phase,
      early) and mae=0.0363 (lesion phase, later) — a 3x swing with NO code change
      between them, which is only possible if the metric is window-position
      dependent, not accuracy-dependent. (2) The gate metric is fed by
      attractorMonitor.recordPrediction(predictionEvaluation.mae, ...)
      (decision-making.service.ts:2137) into a capped 50-FIFO with no reset path
      (grep for resetWindow/predictionWindow= found none) — structurally a
      warmth-sensitive rolling mean, exactly like the provenance census in AD-0036.
      (3) The suspect commit TK-68 (05491ec) unified a DIFFERENT window — the
      per-action MaeHistoryStore (MAX=10, mae-history.store.ts:29) used by
      graduation/confidence — and its only behavioral change was REMOVING a
      double-append (decision-making.service.ts:2158-2160); it does not touch the
      AttractorMonitor window the gate reads, so it cannot be the cause of the gate
      number. (4) The graph grew between the two captures (replay provExp 2843
      nodes → lesion 2883 nodes), independently confirming the backend accumulated
      state and the prediction window rolled forward between phases. The lesion-
      phase 0.0363 (below baseline) is the warmed, representative reading; the
      replay-phase 0.1105 is the cold first-50. This is the same shape as AD-0036
      (cumulative/warmth-dependent metric vs a point-in-time anchor) — re-anchoring
      is therefore legitimate but, because the warmed reading already passes, it is
      OPTIONAL rather than required.
    alternatives:
      - option: Treat M2=0.1105 as a real prediction-accuracy regression and route hopper for root-cause
        rejected_because: >
          A real predict-act-evaluate regression would be reproducible and would
          NOT self-heal to 0.0363 on the same backend minutes later with zero code
          change. The swing is fully explained by window phase-position. Revisit
          ONLY if, at a WARMED steady state (not the cold first-50), M2 exceeds the
          baseline+0.03 ceiling — that would be a genuine world-model regression
          and hopper would be the right call.
      - option: Re-anchor the mae baseline to the cold-replay-phase value (raise the ceiling)
        rejected_because: >
          Would mask a future genuine regression by anchoring to a cold-start
          number; if re-anchoring at all, anchor to a documented warmed/windowed
          steady-state capture, not the cold first-50. Preferred future hardening:
          capture M2 over a warmed window. Kept optional, not done here.
    consequences: >
      M2 does NOT block the contract close. The authoritative M2 reading is the
      warmed lesion-phase 0.0363 (PASS). A standing caveat (mirroring AD-0036):
      the prediction-MAE gate metric is an unreset rolling window and is therefore
      phase-position/warmth sensitive; a cold-start replay-phase capture will read
      high and is not comparable to the warmed baseline. The preferred durable fix
      (warm or window the M2 capture, or reset+seed a fixed predictor corpus before
      the M2 phase) is recorded as a future gate-harness ticket, NOT required to
      close. No production code change.
    canon: "no tension — CANON predict-act-evaluate is intact; the world model is not regressed (warmed reading beats baseline). The failure is a gate measurement-timing artifact, not a prediction-accuracy loss."
    evidence:
      - test/gate/assertions.ts:92
      - packages/decision-making/src/monitoring/attractor-monitor.service.ts:143
      - packages/decision-making/src/monitoring/attractor-monitor.service.ts:214
      - packages/decision-making/src/decision-making.service.ts:2137
      - packages/decision-making/src/mae/mae-history.store.ts:29
      - "git 05491ec (TK-68): unifies MaeHistoryStore, removes double-append; does NOT touch AttractorMonitor window"
      - "/tmp/gate-replay.log:116,176 (replay PHASE 2: mae=0.1105, 2843 nodes) vs /tmp/gate-lesion.log:98,179 (lesion PHASE 2 same backend later: mae=0.0363 PASS, 2883 nodes)"
    supersedes: null

  - id: AD-0039
    date: 2026-06-21
    title: Q1.8 lesion-burst spec rests on a FALSE premise — the burst runs with the LLM HEALED, not lesioned. Drop the non-LLM/non-TYPE_2 clause; the burst's real invariants (isolation, no-splice, fast) are already proven by Q1.1/Q1.3. Harness edit, supersedes the AD-0037 Q1.8 remedy.
    status: accepted
    context: >
      Final contract-close verification. The lesion gate's only remaining FAIL is
      Q1.8: `returned=5/5 maxLatency=1976ms noType2=false noLlmAssisted=false
      allFast=true` (gate-lesion.log:199). The AD-0037 Q1.8 remedy (gate.ts:570-603)
      asserts the burst's returned responses are non-TYPE_2 AND non-LLM_ASSISTED
      AND <=5000ms, on the premise that the burst executes under a SEVERED LLM. The
      coordinator flagged empirically that the burst is in fact HEALTHY: all 5
      returned, fast (1976ms, allFast=true), but some are TYPE_2/LLM_ASSISTED.
    decision: >
      Rule: AD-0037's Q1.8 remedy was built on a FALSE PREMISE and the
      non-TYPE_2/non-LLM_ASSISTED clause is WRONG for this phase position. The
      burst (PHASE 2.5, runMultiPersonPhase) runs AFTER the perception proof phase's
      finally block heals the LLM (gate.ts:1879-1885, llmCassette.healNow), and
      BEFORE the genuine lesion test (PHASE 3, runLesionTest, gate.ts:2520-2522)
      where the LLM is actually severed. So in lesion-mode the burst executes with
      the LLM LIVE — TYPE_2/LLM_ASSISTED responses are CORRECT, not a defect. The
      real, deliverable burst invariants are ISOLATION (Q1.1 distinct turnIds) and
      NON-EMPTY/NO-SPLICE (Q1.3) — both mode-agnostic and both PASS. The genuine
      LLM-degradation proof lives entirely in PHASE 3 (L1-L8, L5, L7) and P6, ALL
      green. REMEDY (option (a) from the coordinator's menu): re-spec Q1.8 to the
      property the architecture actually delivers at this position — drop the
      non-TYPE_2 and non-LLM_ASSISTED clauses; keep at most `finalCount>=1 &&
      allFast(<=5000ms)`. Since that residual (returned + fast + distinct ids) is
      REDUNDANT with Q1.1 (distinct turnIds) and Q1.3 (non-empty/no-splice) plus
      L7 (latency), the cleanest concrete edit is to convert Q1.8 to a recordSkip
      under lesion (reason: "burst runs post-heal with LLM live; degradation shape
      is asserted by L1-L8/P6 where the LLM is genuinely severed; burst isolation
      proven by Q1.1/Q1.3"), OR keep a thin Q1.8 asserting only finalCount>=1 &&
      allFast. Do NOT move the burst before the heal or re-lesion it (option (c)
      rejected): the burst phase is intentionally a NORMAL-mode concurrency/
      isolation test (per its banner "WS4 Ticket 7"), and the lesion-degradation
      burst is not an architecture the system is designed to deliver — chat under a
      severed LLM correctly degrades to SHRUG, which the L-rows already prove.
    rationale: >
      Reading the lesion-mode execution order is dispositive: gate.ts:2504 (or the
      lesion P-skips) → :1881 heal → :2514 metrics → :2518 burst → :2522
      runLesionTest (where cassette.lesionNow is the real severance). The burst at
      :2518 is provably post-heal. The empirical signature the coordinator observed
      (5/5 returned, 1976ms, TYPE_2 present) is exactly a HEALTHY normal-mode burst,
      not a degraded one — which is why allFast=true and finalCount=5 (a severed-LLM
      burst would hang ~13s on chat misses and return <5, the symptom AD-0037
      originally tried to tolerate). AD-0037 correctly diagnosed the cassette
      non-determinism for X0/Q1.1/Q1.3 but then mis-specified Q1.8 by assuming the
      burst is the lesioned path; it is not. The non-LLM clause asserts a
      degradation property in a phase where the system is not degraded, so it can
      only fail (or pass by luck of cassette miss timing). The honest spec asserts
      what this phase delivers (isolation + fast completion), which Q1.1/Q1.3/L7
      already cover — hence SKIP-or-thin is correct and non-theatrical.
    alternatives:
      - option: (c) Move the burst before the heal / re-lesion it so Q1.8's non-LLM clause becomes testable
        rejected_because: >
          The burst phase is deliberately a NORMAL-mode concurrency/isolation test
          (WS4 T7); a severed-LLM concurrent burst is not a designed capability —
          chat under lesion correctly SHRUGs, already proven by L1-L8. Re-lesioning
          the burst would manufacture a degradation scenario just to satisfy a
          clause, and would re-introduce the ~13s cassette-miss hangs AD-0037 fought.
      - option: (b) Mark Q1.8 SKIP/replay-only with NO assertion
        rejected_because: >
          Acceptable and is effectively the chosen path's degenerate form; keeping
          a thin finalCount>=1 && allFast assertion (or an explicit SKIP with the
          post-heal reason) is marginally more honest about WHY it is skipped. Either
          lands the same verdict — Q1.8 is not a product gate.
    consequences: >
      Supersedes the AD-0037 Q1.8 remedy (the L5 and X0/Q1.1/Q1.3 portions of
      AD-0037 STAND — only the Q1.8 sub-decision is corrected here). Q1.8 does NOT
      block the contract close. One harness edit is warranted (owner: forge,
      conceptual: ashby — test/gate is app/shared tooling; falls under TK-92's
      scope): in gate.ts runMultiPersonPhase, replace the Q1.8 non-TYPE_2/
      non-LLM_ASSISTED assertion with either a recordSkip (post-heal/LLM-live
      reason) or a thin finalCount>=1 && allFast(<=5000ms) check. The
      heal-before-burst ordering is CORRECT and stays. No production code change.
    canon: "no tension — CANON Lesion Test is upheld by L1-L8/P6 where the LLM is genuinely severed; Q1.8 was asserting a degradation property in a non-degraded phase. Burst isolation (Std-3 cross-person) is intact (Q1.1/Q1.3 green)."
    evidence:
      - test/gate/gate.ts:570
      - test/gate/gate.ts:1879
      - test/gate/gate.ts:2514
      - test/gate/gate.ts:2522
      - "live observation: burst returned 5/5, maxLatency 1976ms, allFast=true (gate-lesion.log:103-104,199) — healthy normal-mode burst, LLM live"
    supersedes: null

