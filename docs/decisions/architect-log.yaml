  - id: AD-0050
    date: 2026-07-02
    title: use_learned checkpoint-load hole closed (force False on load, ignore — not migrate — the persisted flag); AC4 rewritten to deterministic "EWC armed" + explicit drift/ramp precondition; TK-B AC1 targets the inline handler
    status: accepted
    context: >
      Item 20260702-002 refine red-team, FORK 2 (CRITICAL) + two HIGH AC
      defects. FORK 2 verified: convergence.py load() restores use_learned
      from the persisted checkpoint (convergence.py:234-235) and save()
      persists it (:211); AD-0047's hard-disable as staged in TK-C only
      blocks the check() flip (:152-160), so a previously-graduated
      checkpoint boots with the untrained random head LIVE — the Std-4
      theater survives the fix through the load path. There are exactly two
      writers of use_learned outside __init__: the check() flip at :160 and
      the load() restore at :235. HIGH (a) verified: TK-C's AC4
      "penalty_gradients() non-zero in the phase immediately following the
      transition" is deterministically FALSE at the boundary — set_reference
      re-arms the ramp (replay.py:211), _ramp_factor() is 0.0 at that instant
      (replay.py:420-422) so penalty_gradients returns zeros (replay.py:
      395-402), and current==reference means zero gradient until drift even
      at full ramp. HIGH (b): TK-B's AC1 references "the consolidation helper
      (see TK-C)" though TK-B lands first by the plan's own sequencing.
    decision: >
      FORK 2 — closure CONFIRMED with one precision: the hard-disable must
      pin BOTH writers. load() forces self.use_learned = False, IGNORING the
      persisted flag (log a warning when the checkpoint carried True, citing
      this AD); check() keeps the AD-0047 pin. Ignore beats migrate: load()
      stays a read-only operation — rewriting checkpoint files on read is a
      side-effecting surprise that breaks rollback semantics, and the flag
      self-heals to False at the next routine save() since it can never be
      True in memory. Required unit test: construct/save a checkpoint npz
      with use_learned=True, load() it, assert use_learned is False and the
      divergence path selects heuristic_divergence (convergence.py:168).
      HIGH (a) — AC4 is rewritten to the deterministic form: after the first
      boundary with a non-empty buffer, assert EWC ARMED (ewc._reference is
      not None AND ewc._fisher is not None), and separately, under an
      explicit precondition (perturb a weight copy away from the anchor, then
      call penalty_gradients at least twice — the first call advances the
      ramp off zero per replay.py:398-399), assert the subsequent
      penalty_gradients result is non-zero. No AC may assert non-zero
      gradients at t=0. HIGH (b) — TK-B's AC1 targets the INLINE handler:
      swap the order at main.py:583/596 (compute_fisher then set_reference)
      and rewrite the :584/:589-595 comments in place; TK-C's extraction AC
      then states it preserves the TK-B-corrected order (no re-decision of
      ordering inside TK-C).
    rationale: >
      A hard-disable that survives neither restart nor rollback is not a
      hard-disable; the checkpoint is just a third writer path and all
      writers must be pinned or the theater re-enters through persistence.
      Ignoring rather than migrating keeps load() pure and makes the pin
      enforceable by a one-line invariant ("nothing may set use_learned
      True") instead of a file-format migration. The AC4 rewrite replaces a
      flaky, physically-impossible assertion with the two things that are
      actually true and checkable at the boundary: the mechanism is ARMED,
      and it BITES once its documented preconditions (ramp advanced, drift
      exists) are explicitly staged.
    alternatives:
      - option: Migrate the persisted flag (rewrite the checkpoint to use_learned=False on load)
        rejected_because: >
          Side-effecting read; breaks rollback-to-checkpoint semantics and
          adds a write path to load() for a flag that self-heals at next
          save. Revisit only if a checkpoint-format version bump happens
          anyway.
      - option: Drop use_learned from save() instead of pinning load()
        rejected_because: >
          Existing already-saved checkpoints still carry True and load() would
          still restore it; the hole is the reader, not the writer.
    consequences: >
      TK-C's use_learned AC gains the load-path pin + the load(True)->False
      unit test; TK-C's AC4 is replaced by the armed-assertion + staged-drift
      form; TK-B's AC1 is re-pointed at main.py:583/596 inline. With both
      writers pinned, use_learned can never be True in a running process
      until a real convergence-head trainer exists (per AD-0047 that trainer
      is new scope, Jim's product call to prioritize, not a point fix here).
    canon: "Std-4 — the surviving-theater finding is UPHELD: without the load-path pin, the random-head 'learned mode' re-enters via checkpoint restore; this closure completes the AD-0047 remedy"
    evidence:
      - packages/cognition-service/models/convergence.py:152
      - packages/cognition-service/models/convergence.py:160
      - packages/cognition-service/models/convergence.py:168
      - packages/cognition-service/models/convergence.py:211
