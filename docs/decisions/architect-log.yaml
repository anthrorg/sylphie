  - id: AD-0003
    date: 2026-06-16
    title: Fork C sceneNudge carrier — a frame-level systemTrigger flag, not InboundTurn threading
    status: accepted
    context: >
      CRITICAL-1. TK-21 reclassifies sceneNudge turns to SYSTEM_TRIGGER in
      categorizeFrame (process-input.service.ts:213), but categorizeFrame only
      sees a SensoryFrame and classifies purely off frame.active_modalities. The
      sceneNudge bit lives on InboundTurn (inbound-turn.ts:112) and is consumed
      ONLY in runCycleForTurn (decision-making.service.ts:349) to null
      currentTurnContext. nudgeSceneChange() writes NO modality slot
      (tick-sampler.ts:147) and does NOT mark the frame; the scene rides the
      tick-sampler slot via updateScene. So the frame categorizeFrame sees has no
      sceneNudge marker — there is no carrier today.
    decision: >
      Carry the bit as a frame-level marker, not a categorizeFrame signature
      change and not a new 'scene' modality. In runCycleForTurn, when
      turn.sceneNudge is true, stamp frame.raw['system_trigger'] = true on the
      sampled frame (the same place turn_id is already stamped,
      decision-making.service.ts:367-369), BEFORE processInput(frame). Then
      categorizeFrame reads that flag as its FIRST branch and returns
      SYSTEM_TRIGGER. Rationale for the carrier choice: (a) frame.raw is already
      the established side-channel for per-cycle context (turn_id, undiscovered_count),
      so this is assert+extend not re-architecture; (b) a new 'scene' modality was
      explicitly rejected upstream (tick-sampler.ts:123-130 — scene must NOT be a
      globally event-driven modality or it fires a cycle per 15fps frame); (c) a
      processInput signature change ripples to every caller and breaks the
      single-call-site discipline. categorizeFrame stays SensoryFrame-only.
    rationale: >
      The frame is the object that survives sample() and reaches categorizeFrame;
      the turn does not. frame.raw is already the carrier for exactly this kind of
      per-cycle, non-cognitive context. Reusing it keeps the change ~10 LOC and
      avoids touching the modality set or the processInput contract.
    alternatives:
      - option: Make 'scene' a real active_modality and branch on it
        rejected_because: >
          A normal co-present visual frame also carries scene; cannot distinguish
          an exogenous nudge from ambient vision, and risks re-enabling per-frame
          cycling that tick-sampler.ts:123-130 deliberately prevents.
      - option: Change processInput/categorizeFrame to take a turn-context arg
        rejected_because: >
          Ripples to all processInput call sites; categorizeFrame becomes
          frame+context impure; larger blast radius for no benefit over a frame flag.
    consequences: >
      TK-19 POC must answer the carrier question concretely (does the stamped flag
      survive sample() and reach categorizeFrame). TK-21 depends_on TK-19, drops
      the "do NOT touch inputCallback" overscope clause (it never needed to), and
      its budget rises to <=120 LOC to cover the runCycleForTurn stamp + the
      categorizeFrame branch + threading. A RISK item is added.
    canon: none
    evidence:
      - packages/decision-making/src/process-input/process-input.service.ts:213
      - packages/decision-making/src/concurrency/inbound-turn.ts:112
      - packages/decision-making/src/decision-making.service.ts:349
      - packages/decision-making/src/decision-making.service.ts:367
      - packages/decision-making/src/inputs/sampling/tick-sampler.ts:147
    supersedes: null

  - id: AD-0004
    date: 2026-06-16
    title: Reuse the live sceneSurprise drive path — collapse presenceSurprise (no distinct presence axis)
    status: accepted
    context: >
      CRITICAL-2. TK-20 adds a NEW presenceSurprise Zod field + rules.ts mapping;
      TK-22 emits it from a non-existent file
      (apps/sylphie/.../scene-prediction.service.ts). Ground truth: the
      sceneSurprise path is FULLY LIVE end-to-end. ipc-message-validator.ts:49
      clamps sceneSurprise [0,1]; rules.ts:165-168 maps ScenePrediction ->
      Curiosity +0.02*s, Anxiety +0.01*s (PRESSURE, no relief), with
      ScenePrediction in METADATA_SCALED_ACTION_TYPES (rules.ts:179);
      ScenePredictionService (scene-prediction.service.ts:142) computes surprise
      with per-identity habituation; and routeScenePredictionErrors
      (decision-making.service.ts:2725-2750) ALREADY emits the ScenePrediction
      ActionOutcome to the drive engine every cycle. presenceSurprise exists only
      in planning/wiki docs — zero source. The named file does not exist; the real
      emit is the gateway (perception.gateway.ts:323 nudgeSceneChange) and the
      real predictor is packages/decision-making/.../prediction/scene-prediction.service.ts.
    decision: >
      Do NOT introduce a distinct presenceSurprise axis. Collapse TK-20 to a
      verify-and-reuse ticket that ASSERTS the live sceneSurprise path (validator
      clamp + rules mapping + no-relief) with characterization tests — no new field,
      no rules.ts edit. Retarget TK-22 from "emit a new presenceSurprise" to
      "verify the ScenePrediction ActionOutcome is emitted on the sceneNudge path
      and exercise the trigger-vs-signal split at the gateway/cooldown seam"; fix
      files_in_scope to the real gateway + the real
      packages/decision-making/.../prediction/scene-prediction.service.ts.
      "Presence" (a person appearing/leaving) is already a scene change the existing
      predictor scores; a separate axis would duplicate live behavior and add a
      second un-habituated surprise source.
    rationale: >
      Building presenceSurprise next to a live sceneSurprise that already produces
      the exact Curiosity+Anxiety PRESSURE the ticket wants is duplicate,
      conflicting scope (CON-1, theater risk: two signals for one phenomenon). The
      cheaper, correct move is to reuse the proven path and spend the tickets on
      verifying the loop is cut and the trigger/signal split holds.
    alternatives:
      - option: Keep a distinct presenceSurprise axis for person-presence
        rejected_because: >
          Would require a justified, separately-habituated presence signal the
          plan never motivates; revisit only if a product need for a person-specific
          arousal axis distinct from scene-change is raised by Jim.
    consequences: >
      The drive-signal half of Fork C is already done; the remaining net-new work
      is purely the TRIGGER reclassification (TK-21) + tests. Scope and risk drop
      sharply. The contract's vision/goals that say "Zero relief deltas on
      action_type='ScenePrediction'" already hold against the live mapping.
    canon: none
    evidence:
      - packages/drive-engine/src/ipc-channel/ipc-message-validator.ts:49
      - packages/drive-engine/src/constants/rules.ts:165
      - packages/drive-engine/src/constants/rules.ts:179
      - packages/decision-making/src/prediction/scene-prediction.service.ts:142
      - packages/decision-making/src/decision-making.service.ts:2725
      - apps/sylphie/src/gateways/perception.gateway.ts:323
    supersedes: null

  - id: AD-0005
    date: 2026-06-16
    title: TK-23 cascade bound is cooldown+habituation, not arousal decay (Curiosity/Anxiety decay = 0)
    status: accepted
    context: >
      HIGH-5. TK-23 AC#2 asserts "decay dominates" so N distinct changes cannot
      ratchet arousal. But DRIVE_DECAY_RATES (drives.ts:84-98) sets Curiosity=0.0
      and Anxiety=0.0 — both are pure event-only drives with NO passive decay.
      There is no arousal decay to "dominate" a ratchet, so the AC is unsatisfiable
      as written.
    decision: >
      Reframe TK-23 AC#2 to bound the cascade by the two mechanisms that actually
      exist: (1) the cooldown gate — at most ceil(elapsed / SCENE_CYCLE_COOLDOWN_MS)
      SYSTEM_TRIGGER cycles over the window (perception.gateway.ts:46, 322-325);
      and (2) per-identity habituation in ScenePredictionService — surprise on a
      repeated identity strictly decreases (familiarityCounts attenuation,
      scene-prediction.service.ts:161), so the per-event magnitude fed to the drive
      shrinks even though the drive itself does not decay. State the numeric bound
      in those terms: cycles bounded by the cooldown count; and for a REPEATED
      scene/identity, surprise_{k+1} < surprise_k (habituation) so the cumulative
      Curiosity/Anxiety pressure increments form a decreasing series, not a constant
      ratchet. Drop the "decay dominates" phrasing entirely.
    rationale: >
      The real loop-safety property is "a flapping/static scene habituates and is
      rate-limited," which is what the live code guarantees. Asserting decay would
      test a mechanism that does not exist and would fail or be faked.
    alternatives:
      - option: Add passive decay to Curiosity/Anxiety so "decay dominates" becomes true
        rejected_because: >
          Changes core drive semantics (event-only by design) far outside this
          ticket's scope and the CANON drive model; not this plan's call.
    consequences: >
      TK-23 becomes provable against live constants. The bound is habituation +
      cooldown, which is also exactly DEP-1's loop-gain concern — folding DEP-1's
      cascade clause into TK-23 (see AD-0006) is consistent.
    canon: none
    evidence:
      - packages/drive-engine/src/constants/drives.ts:84
      - packages/decision-making/src/prediction/scene-prediction.service.ts:161
      - apps/sylphie/src/gateways/perception.gateway.ts:46
    supersedes: null

