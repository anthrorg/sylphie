  - id: AD-0021
    date: 2026-06-17
    title: Q-10 vision fixtures — synthesize COCO-plausible structure + lower the acceptance-run detection confidence threshold
    status: accepted
    context: >
      TK-30 builds synthetic mug/book/person fixtures as labeled rectangles.
      YOLO(-seg) is trained on natural images, so a flat rectangle may yield zero
      COCO detections — no confirmed track, no mask polygon — breaking ACC.A
      (768-D embedding + mask-zeroing), ACC.B (re-bind), and the intra-class
      cosine floor. main.py:29 documents an env knob
      COBEING_PERCEPTION_DETECTION__CONFIDENCE_THRESHOLD (default 0.25) read into
      the detector config at boot (main.py:428-436), so detection sensitivity is
      configurable for an acceptance run.
    decision: >
      Keep the fixtures synthetic but make them COCO-plausible (a clear
      bounding-box subject on a solid background with the correct aspect ratio)
      AND lower the detection confidence threshold for the acceptance run via the
      existing env knob. The acceptance ACs assert the lowered-threshold run
      yields at least one confirmed track per fixture so the embedding/mask path
      actually exercises rather than silently no-opping.
    rationale: >
      Real-photo fixtures add an uncontrolled variable and make the acceptance
      non-repeatable without a camera — contrary to TK-30's purpose (deterministic
      inputs). Accepting a non-zero-norm proxy for mask-zeroing weakens the gate to
      where it no longer proves masked-vs-unmasked behaviour. Synthetic plus
      lowered-threshold keeps determinism while exercising the real YOLO to track
      to embed to mask path.
    alternatives:
      - option: Real-photo fixtures
        rejected_because: >
          Uncontrolled variable; breaks the repeatable-without-camera property
          TK-30 exists to provide.
      - option: Accept a non-zero-norm proxy for mask-zeroing
        rejected_because: >
          Weakens the gate; revisit only if the lowered-threshold synthetic path
