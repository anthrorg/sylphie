  - id: AD-0041
    date: 2026-06-22
    title: Runaway-talk incident — root cause is ungated perception-driven self-emit, NOT the LearnedResponse-relief loop or the DB outage
    status: accepted
    context: >
      Live incident on sylphie.live (2026-06-22 ~04:03-04:09 UTC). Three symptoms:
      (1) runaway response loop — never yields the floor, 6+ replies to one user
      message; (2) self-triggered ambient talking with no user input, fabricating a
      TV/screen/reflection narrative; (3) Theater Prohibition breach — she narrates
      sensory capabilities that do not exist ("optical sensors", "perception
      filters", and "*a faint shimmer ripples across their form*"). All UI messages
      tagged "Sylphie guesses (tool-assisted)". Coordinator's working hypothesis was
      a LearnedResponse drive-relief reinforcement loop, with a note that the camera
      was erroring. BOTH framing assumptions were refuted by live logs +
      full-file reads.
    decision: >
      Recorded ROOT CAUSE: a single ungated, perception-pressure-driven self-emit
      loop, not a LearnedResponse contingency pathology and not caused by the DB
      outage. Ground truth from live `railway logs -s sylphie-app`: the camera is
      NOT erroring at the app — perception frames flow continuously (~2Hz:
      FaceEncoder 1 detection, SceneEncoder 3 confirmed, VideoEncoder 3 detections).
      Every perception frame emits pure-PRESSURE, no-relief, no-habituation
      ActionOutcomes — UndiscoveredObjectPressure (Curiosity/Focus) and
      UnknownPersonPressure (Social/Curiosity) (rules.ts:151-159) — pinning
      totalPressure above the self-tick IDLE_PRESSURE_THRESHOLD of 4.0 indefinitely
      (live: "Self-initiated tick: pressure=4.471"). The self-tick's two real gates
      (30s-since-user-input, 10s self-initiate cooldown — tick-engine
      :299-310) are correct and not the leak; the unbounded driver is the WS5
      scene-change nudge path (perception.gateway.ts:322-326 →
      tick-sampler.nudgeSceneChange → cycleGuard.enqueue) which carries NO
      30s/10s/pressure gate and only the 5s SCENE_CYCLE_COOLDOWN, PLUS pressure-gated
      self-ticks — together producing ~1Hz cycles. Arbitration then selects the
      generic bootstrap procedure `seed-greet` (SocialComment, reinforced to
      conf~0.81, threshold~0.57 → "Arbitration TYPE_2 ... Action: seed-greet"),
      whose default LLM_GENERATE step calls DeepSeek and emits theatrical prose every
      cycle. The system's OWN attractor monitor already names the pathology:
      "TYPE_2_ADDICT (metric=1.000)". CommunicationService.handleCycleResponse
      (communication.service.ts:617-737) delivers EVERY CycleResponse with NO
      turn-floor / barge-in gate; the Theater check (communication.service.ts:639)
      is AUDIT-ONLY and explicitly does NOT block delivery (:636 comment) — so
      theatrical text reaches the user (live verified OK verdict on a "*shimmer
      ripples across their form*" line: scoreAffect saw valence=0 magnitude=0, i.e.
      the lexical scorer does not detect FABRICATED-CAPABILITY theater, only
      affective theater). The DB outages (TimescaleDB + Neo4j[other] connect
      timeouts, GET /okg/count 500, fetchUnlearnedEvents failed) CO-OCCUR but do NOT
      cause the loop: drive pressure, arbitration, WKG[WORLD] writes and DeepSeek are
      all live; the outage only disables event logging/learning/OKG-recall (which,
      if anything, REMOVES a relief/grounding path and makes seed-greet more
      dominant). ElevenLabs is also 401 quota_exceeded (voice down) — incidental.
      This is a code/contingency-design gap, NOT a CANON enforcement gap alone:
      Symptoms 1+2 are one bug (no perception-driven-emit suppression + ungated
      delivery + a too-low, never-habituating pressure floor that a static visual
      scene saturates); Symptom 3 is a real Theater Prohibition gap (audit-only
      check, and a scorer blind to fabricated-capability narration). Fix is HANDED
      OFF, not implemented here (see consequences). No plan node owns this yet — it
      needs a ticket before any build (Gate 1).
    rationale: >
      Reading the live logs before trusting either prior assumption was decisive: the
      "camera erroring / no real perception" premise was false (perception is the
      DRIVER, exactly inverting Symptom 2's "despite no perception" framing), and the
      "LearnedResponse relieves integrity → re-select speak" loop, while a real
      latent hazard in the code, is not what fired — the winning action every cycle
      is the bootstrap `seed-greet`, and the pressure that keeps the loop alive is
      exogenous perception pressure with no habituation, not self-relief. The
      seed-greet LLM_GENERATE default is the same generic procedure the ws3 plan
      already flagged as a bypass. The correct system property is: a STATIC visual
      scene must habituate (UndiscoveredObject/UnknownPerson pressure must decay per
      repeated identity like ScenePrediction's per-identity familiarity does), AND a
      self-initiated/perception-nudged cycle must not deliver an unsolicited
      conversational utterance without a floor/barge-in gate, AND the Theater check
      must be able to BLOCK (not just audit) fabricated-capability narration.
    alternatives:
      - option: Accept coordinator's LearnedResponse-relief root cause and tune the contingency
        rejected_because: >
          Live logs show seed-greet (bootstrap SocialComment), not a learned-XXXX
          procedure, winning arbitration; tuning LearnedResponse relief would not
          stop a loop driven by exogenous perception pressure + the seed procedure.
          Revisit only if logs after the perception-habituation fix still show
          learned-XXXX re-selection.
      - option: Blame the DB outage and fix only connectivity (sentinel)
        rejected_because: >
          The loop runs entirely on live subsystems; restoring TimescaleDB/Neo4j
          would re-enable learning/OKG-recall but would NOT stop the ungated emit —
          it might worsen it by writing the theatrical turns back as reflexes. DB
          connectivity is a real but SEPARATE sentinel fix.
    consequences: >
      Needs a new plan node (Gate 1) before build. Recommended ownership split:
      (A) drive/skinner — add per-identity habituation/decay to
      UndiscoveredObjectPressure + UnknownPersonPressure so a static scene stops
      pinning pressure (mirror ScenePredictionService familiarity attenuation,
      AD-0005); reconsider IDLE_PRESSURE_THRESHOLD vs. a saturated visual baseline.
      (B) cortex/luria — gate the perception-nudge + self-initiated path so it does
      NOT emit an unsolicited conversational SocialComment with no floor; an
      ambient/perception cycle should update state (curiosity, episodic) WITHOUT
      a chatbox utterance unless a genuine bid is warranted; this is the
      "vision is ambient/non-triggering" invariant the design claims but the live
      path violates. (C) vox/forge — add a turn-floor / barge-in / min-inter-utterance
      gate in CommunicationService.handleCycleResponse so self-initiated deliveries
      are rate-limited and a user can hold the floor. (D) canon — make the Theater
      Prohibition check BLOCK (not audit-only) for fabricated-capability narration,
      and extend the detector beyond affective valence to capability-claim lexicon
      ("optical sensors", "perception filters", "audio analysis", "visual feed",
      stage-direction asterisk narration of a physical body). (E) sentinel — restore
      TimescaleDB + Neo4j[other] connectivity (connect-timeout) and ElevenLabs quota,
      tracked separately. architect/hopper to tie-break A-vs-B sequencing (the
      habituation fix and the emit-gate are complementary; the emit-gate is the
      faster bleed-stop). Interim mitigation Jim can take NOW without a build:
      disable the perception/camera feed (removes the exogenous pressure source) to
      stop the loop immediately.
    canon: "TENSION with Standard (Theater Prohibition): live, repeated fabricated-capability narration is reaching the guardian because the Theater check is audit-only (communication.service.ts:636,639) and the affective scorer does not flag capability-claim theater (live OK verdict on a fabricated-shimmer line). Surfaced to Jim. Also touches the 'vision ambient/non-triggering' design invariant, which the live perception-nudge→emit path violates."
    evidence:
      - "railway logs -s sylphie-app 04:09 — FaceEncoder/SceneEncoder/VideoEncoder ~2Hz; 'Self-initiated tick: pressure=4.471'; 'Arbitration TYPE_2 ... Action: seed-greet'; 'AttractorMonitorService Attractor state detected: TYPE_2_ADDICT (metric=1.000)'; 'WKG ActionProcedure written: learned-45232870 (LearnedResponse) relieves integrity'; ElevenLabs 401 quota_exceeded; fetchUnlearnedEvents failed timeout"
      - packages/decision-making/src/tick-engine/decision-tick-engine.service.ts:214
      - packages/decision-making/src/tick-engine/decision-tick-engine.service.ts:296
      - packages/decision-making/src/tick-engine/decision-tick-engine.service.ts:299
      - apps/sylphie/src/gateways/perception.gateway.ts:322
      - packages/drive-engine/src/constants/rules.ts:151
      - packages/decision-making/src/action-retrieval/action-retriever.service.ts:425
      - packages/decision-making/src/decision-making.service.ts:1092
      - apps/sylphie/src/services/communication.service.ts:636
