  - id: AD-0026
    date: 2026-06-17
    title: Q-15 TK-70 adaptive EMA weights — split-and-gate on CANON Std-6; build only if PERMITTED
    status: accepted
    context: >
      scoreCandidates lives in deliberation.service.ts:986 (in scope). The
      outcome-nudge call-site reaches the reinforcement seam of
      decision-making.service.ts, OUTSIDE files_in_scope — a scope expansion.
      task-1 is the CANON Std-6 (no-self-modification-of-evaluation)
      determination that gates the build.
    decision: >
      Split-and-gate. task-1 runs FIRST as a hard CANON Std-6 gate with a WRITTEN
      verdict. PERMITTED only if the EMA nudges scoring weights of NEW candidate
      selections (a tunable heuristic on forward selection); BLOCKED if it
      rewrites how the system evaluates its own PAST actions/outcomes. Build
      (task-2+) opens ONLY on PERMITTED; on BLOCKED the ticket STOPS and records a
      new open_question. decision-making.service.ts is added to files_in_scope
      CONDITIONALLY — effective only if task-1 clears.
    rationale: >
      Std-6 is the standard most at risk. The distinction is decidable: tuning how
      new candidates are scored is an allowed adaptive heuristic; rewriting the
      evaluation of prior behaviour is the forbidden self-modification of the
      evaluator. Putting the verdict before any build, and gating the scope
      expansion behind it, keeps the CANON gate from being a post-hoc rubber stamp.
    alternatives:
      - option: Build the EMA and run the CANON review post-hoc
        rejected_because: >
          A verdict written after the code exists is theater; Std-6 must clear
          first.
      - option: Close TK-70 as a non-goal (assume unsafe)
        rejected_because: >
          Pre-judges the verdict; the forward-selection-weight case is plausibly
          permitted.
    consequences: >
      TK-70 AC made gate-first; decision-making.service.ts conditionally in scope.
      Q-15 resolves to DEC-15.
    canon: "Std-6 is the gating standard; task-1 classifies the mechanism before any weight-update code lands"
    evidence:
