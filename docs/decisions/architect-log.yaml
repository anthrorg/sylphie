  - id: AD-0023
    date: 2026-06-17
    title: Q-12 per-model freeze protects the on-disk NPZ snapshot — byte-provable AC
    status: accepted
    context: >
      TK-38's freeze AC "panel[0] weights do NOT change" is trivially true on a
      never-trained NPZ because the Trainer trains the global model, not per-panel
      — the AC could pass without the freeze doing anything.
    decision: >
      Define the freeze to protect the on-disk NPZ at the panel's weights_path.
      Rewrite the AC byte-provably: freeze panel_0, run a training pass targeting a
      DIFFERENT model, assert panel_0's weights_path NPZ is byte-identical (sha256)
      before vs after; then unfreeze and assert a panel_0-targeted train CHANGES
      the sha256.
    rationale: >
      An AC must assert something a real training run can falsify. The on-disk NPZ
      sha256 plus a cross-target train while frozen plus the unfreeze control
      closes the trivially-true hole and makes the freeze observable.
    alternatives:
      - option: Keep the in-memory snapshot-before/after AC
        rejected_because: >
          Trivially true on a never-trained NPZ; the on-disk sha256 is the provable
          artifact.
    consequences: >
      TK-38 AC reworded to a sha256 freeze/cross-target-train/unfreeze sequence.
      Q-12 resolves to DEC-12.
    canon: none
    evidence:
