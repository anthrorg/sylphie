  - id: AD-0043
    date: 2026-07-02
    title: Experience-brief v1 ("Meeting Sylphie") — sound-with-revisions; ship-honest-now upheld with a security gate and an instrument-not-curve hero
    status: accepted
    context: >
      Pressure-test of the draft front-end experience brief (scratchpad
      meeting-sylphie.html) against README.md, sylphie-tech-spec.md, ROADMAP.md,
      and the 2026-07-02 feature/stub inventories. The brief proposes:
      purpose = "meeting a mind that is becoming" + start-LLM-dependent/
      end-LLM-independent; thesis = "a window onto a mind that breathes, reasons
      in the open, never shows an unearned number"; IA = presence-first with
      instruments demoted; and resolves the honesty tension (hero moment =
      graduation, which is currently the most broken thing — sidecar 422s,
      autonomy ~6%) as "make the honest low number the hero, ship honest now."
    decision: >
      Verdict SOUND-WITH-REVISIONS. (1) Purpose frame upheld but must restore
      the project's own wager register (README says "an attempt"/"the bet" —
      the hero asserts arrival) and elevate checkability ("clone it and check")
      into the purpose as a constitutive clause. (2) Experience thesis upheld;
      add the clickable-evidence clause into the thesis line. (3) Honesty
      tension: SHIP-HONEST-NOW upheld over wait-for-drama, with two mandatory
      amendments — (a) the launch hero is the INSTRUMENT + a live why-it's-low
      ledger, not a rising curve: the brief's "autonomy 6% UP-ARROW · nothing
      faked" strip is itself a Std-1 violation (the arrow is false while the
      bootstrap is starved, and "nothing faked" is a meta-claim the partly-
      theater self-monitoring cannot certify); milestones fire only on real
      graduation events; (b) ship-honest != open-the-door — public landing is
      gated on auth for the anonymous destructive endpoints (stub §0.3),
      Anthropic key out of the served bundle, and the WS zombie-reconnect fix
      (§0.7), because the window itself must pass the theater bar. (4) IA
      reframe upheld — Her Mind / Her Growth keep the proof surfaces at top
      level, only ops demote to Instruments — conditional on a hard deep-link
      rule (every narrated number drills to raw evidence) and considering a
      Presence+Conversation merge given live greet-first (AD-0042). (5) Factual
      corrections required in v2: Std-3 misstated (ceiling lifts on
      retrieval-and-use, NOT guardian confirmation — guardian sets base AT 0.60,
      spec §9-3); card-5 self-watching asserts present-tense what the brief's
      own ledger flags partly theater; no face-recognition implication
      (enrollment structurally dead, stub §0.8 — identity is session-based);
      arc step 3 redesigned around the visible :Candidate -> guardian-promotion
      mechanic (a visitor's taught fact stays candidate until Jim promotes —
      AD-0018 — make the constraint the feature). Missing and must be added:
      voice (valence-aware TTS, spec §7) and camera presence as hero-grade real
      capabilities in the Presence design. Brief's decision-leans: one shared
      being (endorse — consistent with WS4 + AD-0012), visitors-first (Jim's
      call), ship-honest-now (endorse as amended).
    rationale: >
      The steelman for waiting (unrepeatable first impressions; the sidecar fix
      is rated trivial so the wait could be short; "come watch her grow" cannot
      be fulfilled in-session at launch) loses because: delaying to look better
      concedes the product is the number when the thesis says the product is
      the instrument; "until graduation is live" has no crisp endpoint (the
      breakage is layered: 422 -> bootstrap starvation -> dedup ceiling-escape
      -> matchProcedures drift); and the declared audience (builders/
      researchers) rewards a proudly-low true number — WS1 catching its own
      80-96% confabulation and correcting to ~6% is the project's most credible
      artifact and should lead. But honesty must be ledger, not slogan: static
      "nothing faked" copy is exactly the unearned expressive output Std-1
      forbids.
    alternatives:
      - option: Wait to launch until the graduation story is live and the curve has drama
        rejected_because: >
          No crisp endpoint; contradicts the honesty differentiator; the
          audience rewards true-low over suspicious-high. Revisit only if Jim
          re-scopes the audience to non-technical consumers, for whom a flat 6%
          may genuinely read as failure.
      - option: Reframe-needed (instrument-first IA instead of presence-first)
        rejected_because: >
          The proof surfaces (Her Mind, Her Growth) already sit at top level in
          the proposed IA; only operations demote. Presence-first serves the
          witness thesis without hiding the telemetry, given the deep-link rule.
    consequences: >
      Coordinator writes brief v2 with the ten listed refinements (wager
      register, checkability clause, Std-3 fix, card-5 honesty, ledger-not-
      slogan strip, launch security preconditions, voice+camera in Presence,
      candidate-mechanic arc step 3, no face-rec implication, deep-link rule).
      When the brief hardens into a plan: frontend -> forge/ashby; security
      preconditions -> sentinel. The sidecar contract fix (stub §0.1) should be
      confirmed ticketed so the launch ledger has its first paid-off entry.
      This entry rules on the brief's framing only — no product code changed.
    canon: >
      tension found and resolved in-brief: the proposed "autonomy 6% UP · nothing
      faked" honesty strip would violate Standard 1 (theater prohibition) if
      shipped as static copy — replaced by a live ledger + real-event milestones.
      Std-3 misstatement corrected. No standing tension remains in the v2 spec.
    evidence:
      - README.md:5
      - README.md:21
