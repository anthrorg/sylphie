  - id: AD-0042
    date: 2026-06-26
    title: EP-20 milestone verification — CLOSE the turn-taking epic (7 of 8 tickets done + live-verified); TK-105 + TK-101 are the residuals
    status: accepted
    context: >
      Mandatory independent architect verification of EP-20 (communication /
      turn-taking fix) at main HEAD 23db4ca, the fix for AD-0041's runaway loop.
      Verified per-ticket AC against the merged source (read in full), ran the
      build + spec suites, and ran a LIVE behavioral smoke against the running
      :3000 NestJS instance (Postgres/Timescale/Neo4j/Drive-Engine all connected,
      drive isolation over ws://localhost:3001). EP-20 has 8 tickets: TK-97, 98,
      99, 100, 102, 103, 104 are status:done+merged; TK-101 (theater enforced+
      learned, CANON-gated) and TK-105 (frontend overlay buffer) are NOT done.
    decision: >
      CLOSE EP-20's turn-taking / bleed-stop milestone — the 7 done tickets are
      verified built, CANON-clean, and live-proven. Keep EP-20 the epic OPEN until
      its remaining two tickets land: TK-101 (P1, CANON-gated theater enforcement +
      extinction) and TK-105 (P2, frontend overlay buffer). The runaway-loop bleed
      stop that AD-0041 demanded (TK-97/98/99 + TK-103/104/102) is DONE and
      live-verified; a redeploy on this HEAD will NOT revive the loop. TK-105 is
      satisfied-by-design on main (overlay uses whole-replace per-frame refs,
      O(current frame)); a dedicated hardening (commit 4d3ab6b: explicit bound +
      15fps throttle) exists on branch agent/tk-105-... but is UNMERGED — it is a
      P2 frontend nicety, not a blocker. TK-101 is the one substantive open item
      and is independently CANON-gated; it does not block the turn-taking close.
    rationale: >
      Per-ticket AC verdicts (all PASS for the 7 done tickets): TK-103 emission-
      intent seam stamped at source (decision-making.service.ts:1835-1836,
      USER_REPLY when currentTurnContext!=null else AMBIENT_NONE; refined to
      SALIENT_OBSERVATION by the gate) and threaded verbatim to delivery
      (communication.service.ts:958) — emission-intent.spec + ambient-salient
      green. TK-104 worth-saying gate (worth-saying-gate.ts) bypasses USER_REPLY/
      DELIBERATE_GREET, content-dedups, treats novelty (surprise>=0.30) /
      GROUNDED as positive triggers, stays silent (NOT a SHRUG, Std-4) otherwise;
      wired so suppression skips ONLY the emit and STILL routes curiosity/scene
      drive errors (decision-making.service.ts:1854-1959 — the prior early-return
      AC0 gap is explicitly fixed). TK-99 TurnFloorGate (turn-floor-gate.ts) keys
      on emissionIntent exclusively (AMBIENT_NONE deny, USER_REPLY always admit +
      cancel in-flight, barge-in 5s, rate-limit 1.5s, DELIBERATE_GREET/SALIENT
      pass) — 27/0 tsx + 5/0 wiring; the cancel() flag is a REAL pre-emit guard
      (theater-honest, the interrupt genuinely cancels the next()). TK-100 greet-
      first: one DELIBERATE_GREET, userId+60s dedup, consume-on-admit rollback,
      TYPE_2+null-procedure synthetic (no phantom confidence record, Std-1/2),
      llmCalled=false — 14/0. TK-97 per-identity habituation (visual-presence-
      habituator.ts, 1/(1+0.6n), per-identity so novelty preserved). TK-102 stale
      eviction (visual-working-memory.service.ts:295-337, 10s timeout at top of
      updateScene) — 8/8. CANON audit PASS: theater prohibition honest (greet
      content plain, cancel real, cost/llmCalled honest — computeDeliveryCost
      returns 0 for non-DeepSeek, llmCalled gated off DELIBERATE_GREET);
      suppression is genuine silence not SHRUG; drive isolation intact (greet
      emits DRIVE_RELIEF push events, no RPC read into drive); honest telemetry on
      synthetic greet. Build PASS (yarn build:shared / @sylphie/decision-making /
      build:backend all exit 0). Specs: 4/4 EP-20 DM suites = 44/44; full DM
      655/665 with the 2 documented pre-existing failures (confidence-updater.
      flush-events from TK-67 2026-06-20, deliberation-helpers from TK-84
      2026-06-20 — both predate EP-20, touch no EP-20 file); visual-embedding.
      acceptance now 6/6 (3rd known failure currently green); tsx specs all green.
      LIVE SMOKE (authenticated WS to /ws/conversation?token=JWT, user ep20smoke):
      Phase A fresh connect = exactly 1 DELIBERATE_GREET ("Hi! How can I help you
      today?", llmCalled=false, cost=0), 0 idle spam over 8s; Phase B immediate
      reconnect = 0 greet (server log: "connection greet skipped (dedup window
      active) msSinceLastGreet=7993 windowMs=60000"); Phase C one user message =
      exactly 1 USER_REPLY (real DeepSeek, cost=$0.000022, no 6-repeat runaway);
      Phase D 8s idle = 0 unsolicited. Server idle ticks show
      arbitrationType=IDLE / NO_ACTION at totalPressure ~3.34 < IDLE threshold 4.0
      — habituation+eviction hold pressure below the self-tick floor live. The
      AD-0041 runaway is gone.
    alternatives:
      - option: Block the EP-20 close until TK-101 + TK-105 also land
        rejected_because: >
          The turn-taking / bleed-stop milestone (AD-0041's actual demand) is a
          separable, fully-verified deliverable; TK-101 is independently CANON-
          gated and TK-105 is a P2 frontend item already satisfied-by-design on
          main. Holding the verified bleed-stop hostage to two unrelated-scope
          tickets would misreport what is done. Revisit if Jim wants the whole
          epic closed atomically — then TK-101 (canon-gated) is the long pole.
    consequences: >
      The turn-taking fix is signed off for redeploy. EP-20 epic stays todo/open
      pending TK-101 (owner vox+cortex, canon gates) and TK-105 (owner forge —
      merge branch agent/tk-105-... PR #71 or accept satisfied-by-design and close
      as a no-op verify). No production code or contract was edited by this
      verification. The smoke test user 'ep20smoke' (guardian) was created in
      sylphie_system Postgres for the live run and can be left or pruned.
    canon: >
      none for the 7 verified tickets (theater prohibition, drive isolation,
      honest provenance/telemetry, Std-4 genuine-silence all upheld and live-
      confirmed). NOTE: AD-0041's standing Theater-Prohibition TENSION (audit-only
      capability-claim theater) is owned by TK-101 and remains OPEN until TK-101
      lands — it is NOT closed by this milestone.
    evidence:
