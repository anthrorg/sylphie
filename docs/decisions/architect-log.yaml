  - id: AD-0036
    date: 2026-06-20
    title: M3 experiential-provenance gate failure is a baseline-calibration artifact — re-anchor the baseline; gate is GREEN modulo a denominator-warmth caveat
    status: accepted
    context: >
      The provability gate's M3 (assertProvenance, test/gate/assertions.ts:134)
      failed at experientialRatio=0.823 against a floor of 0.870
      (baseline 0.9197 - 0.05 tolerance). The metric is computed by
      computeProvenanceRatio (apps/sylphie/src/controllers/metrics.controller.ts:1513)
      as (sensor+guardian+inference)/total over a CUMULATIVE MATCH(n) census of the
      ENTIRE live WORLD Neo4j graph — there is no per-run window and the gate does
      NOT reset the WORLD graph (correct: it holds durable learned knowledge). The
      committed baseline (test/gate/baseline.json) was captured 2026-06-14 over a
      WARMED 22,482-node graph at ratio 0.9197; the clean fresh-backend gate run
      reads a ~1,700-node graph. Coordinator (Sonnet) flagged this as a possible
      measurement artifact and asked for an independent ruling on a CANON Standard 2
      (provenance) metric.
    decision: >
      Rule: this is a MEASUREMENT / BASELINE-CALIBRATION ARTIFACT, not a provenance
      regression. Remedy = re-anchor baseline.json's provenance block to the current
      documented gate conditions (a fresh-backend single-corpus-run graph), and add
      a one-line note in baseline.json recording that the provenance ratio is
      graph-warmth-dependent and must be re-captured whenever the WORLD graph is
      reset or the corpus/LLM-node paths change. The gate is GREEN modulo this
      re-anchor. opus-agent (or the coordinator, mechanical) runs
      `yarn gate:update-baseline` under the SAME fresh-backend conditions used for
      the 34/1/4 run, OR hand-edits the provenance block to the observed values
      (experientialRatio ~0.83, totalNodes ~1,700) with the note. The 0.05 floor
      tolerance is retained — it is the right shape; only the anchor point was stale.
    rationale: >
      Three independent observations make this conclusive and rule OUT a regression:
      (1) the LIVE NORMAL-mode backend (real Ollama, no cassette) reports
      experientialRatio=0.8302 — identical to the gate's 0.823 — so it is NOT a
      cassette artifact and NOT specific to replay. (2) llmGenerated node count is
      STABLE at ~261 across cassette runs, a 3-run-polluted process, and the live
      backend, while sensor/inference dominate (915/508) and grow with runtime —
      the exact signature of a fixed LLM-origin node seed measured against a
      warmth-dependent denominator. (3) The baseline's non-experiential fraction was
      8.0% over 22,482 nodes (~1,805 non-exp nodes accumulated under heavy warmed
      sensor/inference mass); the fresh graph's is 17.0% over 1,720 (~261 LLM + ~31
      unknown) — the SAME ~261 LLM seed weighs heavier in a smaller graph. The
      metric is a cumulative unbounded census ratio compared to a point-in-time
      anchor at a wildly different graph size, so the assertion is not
      run-condition-invariant; the failure is the anchor, not the system.
      Importantly TK-87/TK-88 (LLM-assisted consolidation/relationship extraction,
      merged 2026-06-20 AFTER the baseline) write LLM_GENERATED provenance to EDGES
      (extract-edges.service.ts:46, r.provenance_type), which the nodes-only census
      (MATCH (n)) excludes — so they do NOT dilute the ratio and are not the cause.
      Conversation-derived nouns now stage as :Candidate (upsert-entities), also
      outside the experiential/LLM node split. No write path turned a self-built
      node into an LLM_GENERATED node; provenance tagging is intact (CANON Std 2
      upheld).
    alternatives:
      - option: Treat M3=0.823 as a real provenance regression and hunt a fix
        rejected_because: >
          The live and cassette numbers agree, llmGenerated is stable, and the drop
