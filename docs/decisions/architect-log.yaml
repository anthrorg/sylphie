# Architect decision log.
#
# A running register of every architectural / design decision the `architect`
# agent makes, and why. Read before deciding (a past entry may already govern
# the question); append after deciding. Never rewrite history — supersede an
# entry by setting its status to `superseded` and pointing the new entry's
# `supersedes` field at it.
#
# Schema per entry: id, date, title, status, context, decision, rationale,
# alternatives[], consequences, canon, evidence[], supersedes.
# See .claude/agents/architect.md §4 for the full protocol.

decisions:
  - id: AD-0001
    date: 2026-06-15
    title: Replace mythos with a single architect decision authority
    status: accepted
    context: >
      The Claude config carried a `mythos` generalist reasoner (read-only-ish,
      escalation target for hard questions) and five science-advisor agents
      pinned to the `fable` model. The reasoning layer had no durable memory of
      why past architectural calls were made.
    decision: >
      Retire `mythos`. Introduce `architect` (Opus) as the single
      reasoning/decision authority that reads the plan, holds the whole-system
      picture, decides how the system should work, and records each decision in
      this log. Implementation stays delegated to `opus-agent`.
    rationale: >
      A named decision authority with a running rationale log gives the cascade
      durable architectural memory instead of re-deriving context each session.
      Folding "reason + decide + record" into one role removes the ambiguity of
      a pure advisor that never commits to a call.
    alternatives:
      - option: Keep mythos, add a separate decision-logging mechanism
        rejected_because: >
          Splits the decider from the record; the logger drifts from the reasoner.
      - option: Give the architect full code-edit tools (one agent does all)
        rejected_because: >
          Collapses the reasoner/doer split that keeps heavy builds on opus-agent;
          revisit if the two-agent handoff proves to be friction.
    consequences: >
      rank / review-plan / question-route hook / CLAUDE.md / opus-agent now route
      and refer to `architect`. The architect writes only this log and planning
      docs, not production code.
    canon: none
    evidence:
      - .claude/agents/architect.md:1
      - .claude/skills/rank/SKILL.md:1
    supersedes: null

