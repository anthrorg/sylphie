  - id: AD-0047
    date: 2026-07-02
    title: Theater verdict on the EWC "live active path" claims — Std-4 violation confirmed; comments+ROADMAP corrected WITH the wiring, not deleted before it; convergence use_learned hard-disabled until trainable
    status: accepted
    context: >
      Item 20260702-002 HIGH-3 (theater contradiction). In-code notes at
      main.py:589-595 claim "TK-37 POC confirmed: this is the live active
      path — real empirical Fisher ... No wiring change needed (TK-39 Branch
      A)"; ROADMAP.md:83 marks EWC "wires set_reference() + compute_fisher()
      at runtime" as done. Verified reality: POST /cognition/phase-transition
      has ZERO runtime callers (repo-wide grep — only docs, plans, and the
      TK-37 manual POC); production mode transitions run through
      tracker.advance_mode() (main.py:421) with no consolidation;
      penalty_gradients() returns zeros forever because set_reference is
      never called (replay.py:392-393). The code inside the endpoint DOES
      compute real Fisher when manually POSTed (the narrow thing TK-37
      tested), but "live active path / no wiring change needed" is false as a
      system claim. Secondarily, the :584 NOTE calls the
      set_reference-before-compute_fisher lag "Online EWC design" — wrong:
      Schwarz et al. 2018 blends the just-computed Fisher at the boundary,
      and the class already supports compute-first (replay.py:186-189 seeds
      from _phase_fisher when present), so the correct order is compute_fisher
      then set_reference. Related theater: models/convergence.py:155-160
      flips use_learned=True off a single lucky proxy-accuracy call while
      trainer.py never trains the convergence weights — a random head
      presented as "learned convergence".
    decision: >
      Std-4 (Theater Prohibition) violation CONFIRMED on the in-code claims
      and the ROADMAP checkmark: they assert a live anti-catastrophic-
      interference mechanism that never runs in production. Remedy is
      reconcile-then-rewrite, not delete-first (red-team HIGH-3 upheld):
      (1) the wiring fix (AD-0045) makes consolidation actually live;
      (2) in the same change, the main.py:584 and :589-595 notes are
      rewritten to describe the REAL trigger (train-handler advance_mode ->
      _consolidate_phase_boundary; endpoint = manual override) and the
      ordering swap; (3) ROADMAP.md:83's claim is truth-edited to match.
      This AD entry is the recorded reconciliation the red-team required.
      Convergence gate ruling (folded from the same theater lens): gating
      use_learned on a training-pair count that nothing increments is
      disabling dressed as fixing — instead HARD-DISABLE learned mode
      explicitly (use_learned pinned False with a logged, commented,
      recorded reason) until a real convergence-head training path exists;
      designing that trainer is new scope, not a point fix.
    rationale: >
      The stub-inventory's own honesty rule applies: the math being real does
      not make the mechanism live; a checkmark + "no wiring change needed"
      comment on a dead path is precisely the misleading-claim pattern Std-4
      forbids. Deleting the comment before wiring would hide the evidence
      while leaving the lie in ROADMAP; wiring first makes the corrected
      comment true. For convergence, an explicit pinned-off flag is honest
      (states what the system does NOT do); a never-satisfiable gate
      pretending to be a threshold is a second theater layer on top of the
      first.
    alternatives:
      - option: Treat the comment as merely stale documentation (no CANON flag)
        rejected_because: >
          It was written to close TK-39 by claiming liveness; the audit,
          feature-inventory, and stub-inventory all independently flag the
          path as DEAD — this is a capability claim, not a typo.
      - option: Keep the lagged set_reference-first order as "Online EWC design"
        rejected_because: >
          Contradicts the published Online EWC update (immediate gamma-blend of
          the just-computed Fisher); the class's compute-first seeding branch
          (replay.py:186-189) exists precisely to support the correct order,
          so the swap is free.
    consequences: >
      TK-B (meridian) carries the ordering swap + comment rewrite +
      check_demotions() wiring beside check_graduations() (main.py:408;
      demotion AC must state the >=20-sample precondition,
      bootstrap.py:144-147). TK-C carries the wiring (AD-0045) + the
      use_learned hard-disable with its recorded reason. ROADMAP truth-edit
      rides whichever ticket lands last.
    canon: "Std-4 violation confirmed and remedied by wiring + truth-edit; use_learned proxy-flip ruled Std-4-adjacent and pinned off until trainable"
    evidence:
