  - id: AD-0046
    date: 2026-07-02
    title: drive_history contract fix — emit nested number[][] from the TS adapter (option a), including the gateway type; do NOT relax the pydantic schema
    status: accepted
    context: >
      Item 20260702-002 CRITICAL-2. The pydantic contract declares
      drive_history: list[list[float]] ("last N drive vectors",
      schemas.py:48); the adapter emits a FLAT 120-float array
      (getDriveHistoryFlattened(), tensor-inference-adapter.service.ts:189-198,
      padded.flat()) through the gateway (cognition-gateway.service.ts:166
      driveHistory?: readonly number[]; spread at :198), so every
      /cognition/cycle 422s. The server itself re-flattens a NESTED payload at
      inference/cycle.py:100-102 — nested is the expected shape; the flat
      producer is the bug. Fork: (a) fix the producer to nested (adapter +
      gateway type) vs (b) 1-line pydantic relax to accept flat.
    decision: >
      Option (a). The adapter returns number[][] (10x12, drop .flat(); rename
      or re-document the method) and the gateway panelContext type at
      cognition-gateway.service.ts:166-167 changes to the nested readonly
      shape; the :198 spread is unchanged. The pydantic schema is NOT
      loosened. The gateway type change is explicitly in scope — and it is
      compiler-forced: number[][] is not assignable to readonly number[], so
      a half-done fix cannot build (this also answers the red-team's
      AC-passes-while-gateway-stale concern). Contract test: a fixture payload
      built by the TS adapter path must validate against
      CognitionCycleRequest (pydantic model_validate).
    rationale: >
      The declared schema is the contract, and nested is the semantically
      correct, self-describing shape (N timesteps x D drives): it lets the
      upcoming versioned tensor input contract (item 20260702-017) validate
      both dimensions mechanically, whereas a flat 120 cannot distinguish a
      10x12 from a 12x10 mis-order — exactly the confident-garbage class -017
      exists to prevent. Option (b) bakes a two-shape union into precisely the
      surface -017 must then version and defend forever; a permanent contract
      ambiguity to save ~5 lines of TS is the wrong trade. Blast radius of (a)
      is 3 small edits in 2 files, all first-party, all compile-checked.
    alternatives:
      - option: (b) relax schemas.py to list[float] | list[list[float]] and flatten server-side
        rejected_because: >
          Weakens the exact contract 20260702-017 will version; two accepted
          shapes = permanent ambiguity + shape-safety loss. Revisit only if a
          third-party producer that can only emit flat ever appears (none
          exists — there is exactly one producer, ours).
    consequences: >
      TK-A (P0, owner forge) = adapter + gateway type + TS/pydantic contract
      test. The 50ms first-cycle AbortSignal (cognition-gateway.service.ts:209)
      stays a tracked nuance: the ticket must MEASURE first-cycle latency in
      the live smoke before deferring it (red-team MEDIUM upheld). -017 later
      formalizes this shape in the versioned input manifest.
    canon: none
    evidence:
      - packages/cognition-service/schemas.py:48
      - packages/cognition-service/inference/cycle.py:100
      - apps/sylphie/src/services/tensor-inference-adapter.service.ts:189
      - apps/sylphie/src/services/cognition-gateway.service.ts:166
      - apps/sylphie/src/services/cognition-gateway.service.ts:198
      - apps/sylphie/src/services/cognition-gateway.service.ts:209
      - pipeline/planning/20260702-017-feature-tensor-contract-versioned-inputarch-mani/source.md
