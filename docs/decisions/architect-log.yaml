  - id: AD-0049
    date: 2026-07-02
    title: Consolidation locking discipline — snapshot-under-lock via get_weights() ONLY; compute_fisher/set_reference run lock-free; no new lock on EWC state (amends AD-0045's "verify the EWC calls take _weight_lock" clause and TK-C's lock-held AC, both WRONG)
    status: accepted
    context: >
      Item 20260702-002 refine red-team, FORK 1 (CRITICAL). AD-0045's rationale
      said "the ticket should still verify the EWC calls take _weight_lock",
      and the staged TK-C AC demanded "both calls execute while holding
      trainer._weight_lock". Verified against code, both are wrong and the AC
      as written mandates a deadlock: trainer._weight_lock is a NON-reentrant
      threading.Lock (trainer.py:484); trainer.get_weights() already acquires
      it internally to copy the anchor snapshot (trainer.py:593), so wrapping
      the helper body in `with trainer._weight_lock:` self-deadlocks on the
      inner get_weights(). The documented lock discipline (trainer.py:450-453)
      is hold-briefly-for-write-back only (sub-ms); the training thread's only
      acquisition is the weight write-back at trainer.py:852. Inference reads
      weights with NO lock by design (trainer.py:447-449) — so holding the
      lock across the 1000-sample Fisher pass would not "stall inference"
      (inference never locks) but WOULD stall the training thread's write-back
      at :852 for the full pass, violating the documented sub-ms discipline.
      compute_fisher/set_reference currently hold no lock at the existing
      endpoint call site (main.py:583/596) — the envelope AD-0045 promised to
      keep unchanged. Additional verified facts: compute_fisher reads LIVE
      model weights (replay.py:281-289), not the anchor snapshot, by
      construction; set_reference writes ewc._reference/_fisher (replay.py:
      207-211) while the training thread reads them lock-free in
      penalty_gradients (trainer.py:844, replay.py:392-407).
    decision: >
      The locking discipline for _consolidate_phase_boundary(trainer, buffer)
      is: (1) The helper acquires NO lock itself — zero `with
      trainer._weight_lock` anywhere in it. (2) The anchor snapshot is taken
      exclusively via trainer.get_weights(), whose internal brief
      copy-under-lock is the ONLY _weight_lock acquisition in the whole
      consolidation path. (3) compute_fisher(trainer, calibration) and
      set_reference(weights) run lock-free, exactly as the existing endpoint
      does. compute_fisher's forward/backward passes read live model weights
      concurrently with training write-backs — accepted, same exposure class
      as the documented lock-free inference read (trainer.py:447-457); the
      Fisher floor/clamp (replay.py:321-322) bounds any mid-update noise.
      (4) set_reference needs NO lock against the concurrent reader: the
      reader is the TRAINING thread's penalty()/penalty_gradients() (not
      inference); under the GIL, list-attribute assignment is atomic, both
      lists are fresh copies with identical shapes, and replay.py:392 guards
      None — worst case is ONE train step pairing new _fisher with old
      _reference (the :207->:209 window), a bounded one-step regularization
      transient with no corruption possible. Accepted; do not add an EWC-state
      lock. (5) Anchor-vs-Fisher drift (weights snapshotted at T0, Fisher
      estimated over live weights during the pass) is ACCEPTED estimator noise
      for a floored/clamped diagonal empirical Fisher; the anchor stays the
      T0 snapshot. (6) The helper is called synchronously from the (async)
      train handler after advance_mode() returns True — same envelope as the
      existing endpoint; boundaries are rare (3 per lifetime + manual). The
      helper MUST log its wall-clock duration; if a live boundary measures
      >250ms of event-loop blockage, offloading via asyncio.to_thread is filed
      as follow-up, not preempted now. Testable ACs replacing TK-C's lock AC:
      (a) deadlock regression — run the helper on a real trainer + non-empty
      buffer in a worker thread, join(timeout), assert completion; (b) lock-
      scope assertion — wrap ewc.compute_fisher and ewc.set_reference to
      assert trainer._weight_lock.locked() is False at entry (single-threaded
      test, so locked() reflects the helper's own holding), and assert
      get_weights() was called exactly once before compute_fisher.
    rationale: >
      The snapshot-copy-then-work-unlocked pattern is the trainer's own
      documented design; the consolidation path only needs a CONSISTENT anchor
      (get_weights already provides it) — Fisher is a statistical diagonal
      estimate whose inputs are noisy by construction, so serializing it
      against training buys nothing measurable and costs a multi-hundred-ms
      training stall plus a deadlock trap. Every alternative acquires the
      non-reentrant lock somewhere it can meet itself.
    alternatives:
      - option: Wrap the whole helper in trainer._weight_lock
        rejected_because: >
          Self-deadlock on get_weights()'s internal acquire (non-reentrant
          Lock); even refactored to avoid re-entry it stalls the training
          write-back for the full Fisher pass, violating trainer.py:450-453.
      - option: Hold the lock across compute_fisher only (freeze weights for a "clean" Fisher)
        rejected_because: >
          Same training-thread stall; a frozen-weights Fisher is not more
          correct — the estimator is already chunk-aggregated and clamped, and
          the pass reads weights the same lock-free way inference does.
      - option: Add a dedicated lock around ewc._reference/_fisher
        rejected_because: >
          Puts a lock acquisition in penalty_gradients on EVERY train step to
          protect against a once-per-phase one-step transient that is already
          shape-safe and None-guarded. Revisit only if EWC state ever gains a
          reader outside the training thread.
    consequences: >
      AD-0045's "verify the EWC calls take _weight_lock" clause and the staged
      TK-C AC "both calls execute while holding trainer._weight_lock" are
      REPLACED by this discipline (AD-0045's seam/helper/call-site decision
      stands unchanged). TK-C gains the duration log + the two tests in (6).
      A one-step mixed-epoch EWC transient per boundary is accepted and
      documented here rather than papered over with a lock.
    canon: "none — upholds AD-0045's thread-safety-envelope-unchanged clause by making it precise; no Standard touched"
    evidence:
      - packages/cognition-service/training/trainer.py:484
      - packages/cognition-service/training/trainer.py:593
      - packages/cognition-service/training/trainer.py:450
      - packages/cognition-service/training/trainer.py:844
      - packages/cognition-service/training/trainer.py:852
      - packages/cognition-service/training/replay.py:207
      - packages/cognition-service/training/replay.py:281
      - packages/cognition-service/training/replay.py:321
      - packages/cognition-service/training/replay.py:392
      - packages/cognition-service/main.py:366
