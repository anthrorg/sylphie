  - id: AD-0014
    date: 2026-06-16
    title: Q-4 voice one-shot /transcribe — DECISION to implement via Deepgram REST (kill the silent stub)
    status: accepted
    context: >
      Tier-6 Q-4. voice.controller.ts:32-36 POST /transcribe returns a
      hardcoded { text:'', confidence:0, latencyMs:0 } with @HttpCode(200) — a
      silent stub that shapes a fake-success response. The frontend
      useVoiceRecording.ts hook calls it (press-to-talk). This is theater: a 200
      with an empty-but-valid transcript misleads the caller into thinking
      transcription ran. The choice is implement (Deepgram REST one-shot) or
      remove the press-to-talk UI + endpoint.
    decision: >
      Implement the one-shot /transcribe via Deepgram REST (the project already
      uses Deepgram for streaming STT, so no new vendor/dep). The endpoint must
      perform a real transcription of the posted audio and return the actual
      text/confidence, OR return an honest error (4xx/5xx) on failure — never a
      faked 200-empty. This becomes a ticket under the vox-owned voice path
      (vox owns stt.service.ts; voice.controller.ts is forge/app, but the STT
      call belongs to vox's domain — owner: vox). The silent-stub return is
      removed as part of the AC (CANON theater-prohibition: no fake success).
    rationale: >
      The press-to-talk UI is live and wired to this endpoint, so the feature is
      wanted; the only defect is that the backend is a silent stub. The honest,
      no-theater fix is to make it real with the STT vendor already in the stack
      (Deepgram), not to amputate working UI. Returning empty-200 is precisely
      the silent-stub pattern the project forbids — implementing closes that.
    alternatives:
      - option: Remove the press-to-talk UI and the /transcribe endpoint (non_goal)
        rejected_because: >
          The streaming /ws/audio path exists, but press-to-talk one-shot is a
          distinct, live UX already wired; removing live UI to avoid a small
          implementation is the wrong trade. Revisit only if Jim rules
          press-to-talk redundant with streaming STT.
      - option: Leave the empty-200 stub
        rejected_because: >
          Direct CANON theater-prohibition violation (fake success); not
          permissible.
    consequences: >
      Q-4 resolves to DEC-8. A ticket (owner: vox, conceptual: skinner) wires
      /transcribe to Deepgram REST and deletes the empty-200 return. Until built,
      the honest interim is a 501/explicit-error, NOT empty-200 — but the
      decision is to implement, so it goes straight to a ticket.
    canon: "resolves a theater-prohibition violation (empty-200 stub -> real transcription or honest error)"
    evidence:
      - apps/sylphie/src/controllers/voice.controller.ts:32
      - frontend/src/hooks/useVoiceRecording.ts
    supersedes: null

  - id: AD-0015
    date: 2026-06-16
    title: Q-5 drives-controller UI — DECISION keep the honest-501 backend; remove the decorative mutation UI affordances
    status: accepted
    context: >
      Tier-6 Q-5. drives.controller.ts:79-92 exposes POST /drives/override,
      /drift, /reset, all throwing NotImplementedException (501) with an explicit
      message that CANON Drive Isolation forbids the app process mutating drive
      state (drives.controller.ts:64-77). The backend is already CANON-correct
      and honest (501, not fake-{}). The only open piece is the FRONTEND: there
      are decorative UI affordances that call these always-501 endpoints. CANON
      Drive Isolation (separate process + Postgres RLS denying app UPDATE/DELETE
      on drive rules) forbids routing app->drive mutation; the only permitted
      influence is guardian-feedback EVENTS the Drive Engine itself processes
      (push, never an RPC mutation — matches the drive-engine event standard
      memory).
    decision: >
      Keep the backend exactly as-is (honest 501 + message — do NOT delete the
      endpoints; they are correct documentation of an isolation boundary).
      REMOVE the decorative frontend affordances that present override/drift/reset
      as if they were operable controls — a button that can only ever 501 is
      theater. Do NOT route them via guardian-feedback in this plan: a real
      guardian-feedback control surface is a separate, deliberate design (not a
      reskin of forbidden mutation endpoints) and is out of scope here. This
      becomes a small frontend ticket (owner: forge): strip the decorative
      mutation controls; leave the read-only GET /drives snapshot UI.
    rationale: >
      CANON Drive Isolation makes app->drive mutation structurally impossible by
      design (RLS), so a UI that appears to offer it is guaranteed-broken theater.
      The honest options are (a) remove the controls or (b) build a genuine
      guardian-feedback event path — and (b) is its own design problem (what
      events, what asymmetry, what guardian gating), not a UI tweak. The minimal,
      CANON-aligned, no-theater move is (a): remove the decorative controls now;
      a guardian-feedback control surface can be planned later on its merits.
    alternatives:
      - option: Route the UI controls through guardian-feedback events now
        rejected_because: >
          That is a real subsystem design (event types, guardian asymmetry ×2/×3,
          gating), not in this plan's scope; revisit when a guardian control
          surface is explicitly planned. Folding it in here would be unscoped
          design-on-the-fly touching CANON guardian asymmetry.
      - option: Delete the backend 501 endpoints too
        rejected_because: >
          The 501 endpoints honestly document the isolation boundary and prevent
          a future caller from assuming mutation is possible; keeping them is
          cheaper and more honest than silence.
    consequences: >
      Q-5 resolves to DEC-9. A frontend ticket (owner: forge, conceptual: ashby)
      removes the decorative drive-mutation affordances; backend untouched. A
      genuine guardian-feedback control surface remains unplanned (not deferred
      with a trigger — it has no committed need yet).
    canon: "supports Drive Isolation + theater-prohibition; explicitly does NOT touch guardian asymmetry (deferred out of scope)"
    evidence:
      - apps/sylphie/src/controllers/drives.controller.ts:64
      - apps/sylphie/src/controllers/drives.controller.ts:79
    supersedes: null

