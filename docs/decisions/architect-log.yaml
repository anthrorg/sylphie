  - id: AD-0048
    date: 2026-07-02
    title: Grounding provenance threading (003c) — the surface guard stays the SOLE provenance gate; fix locus is applyRecallGroundingFromRetrieval (surfaced-check before the GROUNDED early-return), not the upstream heuristics
    status: accepted
    context: >
      Item 20260702-003 ticket 003c. The plan's AC — "return factNodeId even
      when already GROUNDED" — would, as written, thread provenance for a
      fact that never surfaced (fabricated provenance; Std-1 + Std-4). Ground
      truth verified: applyRecallGroundingFromRetrieval
      (deliberation/recall-retrieval.ts:504-534) early-returns provenance:null
      when currentGrounding is already 'GROUNDED' (:517-519) BEFORE the
      valueSurfacesAsWord honesty guard (:525-527). Its own doc contract says
      the opposite: "the node id (provenance) is returned WHENEVER the value
      surfaced" (:497-499) — the code violates its own documented CRUCIAL T1
      DISTINCTION. Trigger confirmed: at the monologue short-circuit,
      deliberation.service.ts:425-430 sets knowledgeGrounding='GROUNDED'
      (personFactRecalled / topical-WKG) BEFORE the retrieval is applied at
      :446, so the WS3-T2 reinforcement gate
      (decision-making.service.ts:1993-1998, requires GROUNDED + provenance +
      factNodeId === responseGroundingProvenance) can essentially never fire
      on the common path. Same suppression exists at ALL FOUR call sites
      (deliberation.service.ts:446, :813; decision-making.service.ts:1060,
      :1151); none carries pre-existing provenance, so there is no overwrite
      hazard. Corrections to the record: the plan's files_in_scope path
      packages/decision-making/src/recall-retrieval.ts does not exist (actual:
      src/deliberation/recall-retrieval.ts); the red-team's claim that
      discriminateGroundedBy is "called at deliberation.service.ts:70 /
      decision-making.service.ts:1516" is imprecise — :70 is a re-export and
      :1516 threads the groundedBy VALUE from applied results; the FUNCTION
      has no production caller, but its role is covered by retrieval.source
      threading, so it is out of scope for 003c either way.
    decision: >
      CANON ruling: valueSurfacesAsWord MUST remain the sole gate for
      emitting provenance — unconditional provenance-on-GROUNDED is forbidden.
      The honest design that still lets legitimate reinforcement fire:
      inside applyRecallGroundingFromRetrieval, move the surfaced check ahead
      of the GROUNDED early-return —
      (i) retrieval null -> passthrough (unchanged);
      (ii) retrieval present + value NOT surfaced -> keep currentGrounding,
      provenance null (unchanged);
      (iii) retrieval present + value SURFACED -> return GROUNDED +
      retrieval.factNodeId + retrieval.source REGARDLESS of who set the
      GROUNDED label first (label is idempotent; the node id is the one
      resolved at retrieval time). This restores the function's documented
      contract and fixes all four call sites uniformly. The fix locus is the
      shared function, NOT a reorder of deliberation.service.ts:420-450 —
      the upstream heuristics are untouched.
    rationale: >
      Provenance attached only when the fact VALUE verifiably surfaced as a
      whole word in the delivered text is honest by construction — the
      upstream label's origin is irrelevant to whether THIS fact was
      recalled-and-used. The reinforcement gate additionally requires
      factNodeId === responseGroundingProvenance, so only the pre-resolved
      recall fact is ever reinforced. Fixing the shared function (a) enforces
      the invariant in exactly one place, (b) repairs the code-vs-doc
      contradiction at :497-499 vs :517-519, and (c) covers the latent
      (:1060) and procedure (:1151) sites that a deliberation.service-only
      reorder would miss. Side effect verified sound: groundedBy now also
      populates in case (iii), so write-time person-scoping
