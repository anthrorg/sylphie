      unless noted): (R1) gate-harness Q1.8 re-spec per AD-0039 (drop non-LLM clause
      / SKIP); (R2) optional M2 warmed-window capture or mae re-anchor per AD-0038;
      (R3) optional Postgres column-qualification fix for the boot query; (R4)
      pre-existing standing caveats from AD-0036/0037 (prompt-hash cassette
      non-determinism — durable fix is hash normalization). None of R1-R4 gates the
      close.
    rationale: >
      The close criterion is "every acceptance criterion passes a runnable check and
      the product behaves." Every PRODUCT assertion is green; the only two reds are
      independently shown to be measurement/spec artifacts of the gate harness, not
      system behavior — and both have a documented, minimal remedy that is itself a
      harness edit, not a product change. The mandatory live smoke against the
      NORMAL-mode backend on :3000 confirms the system is genuinely running, not
      merely passing static checks: the drive engine is ticking and isolated
      (tickNumber 135545->135548 over 3s, ~1Hz > 0.5Hz floor, isConnected=true,
      pressure vector moving organically — curiosity/boredom/anxiety drifting per
      tick); the tensor cognition sidecar is live and learning (available=true,
      5.57M params, 752,453 training steps, 529,470 shadow samples, all 5 panels +
      deliberation models loaded); perception sidecar is reachable
      (perception-status 200); provenance is healthy (experientialRatio 0.896 over
      2924 nodes, sensor+inference dominant, AD-0036 upheld); auth/JWT path works
      (health 200 with a minted guardian token). This is a warm, running,
      end-to-end system. Holding the close open on two harness artifacts would be
      the wrong call — the honest state is DONE with tracked harness follow-ups.
    alternatives:
      - option: NO-GO — keep the contract open until M2 and Q1.8 are green in the gate
        rejected_because: >
          Both reds are proven gate-harness artifacts (AD-0038/0039), not product
          regressions; the warmed M2 already passes and Q1.8's real invariants
          already pass via Q1.1/Q1.3. Blocking on a cold-window number and a
          false-premise assertion would chase green for its own sake (theater-
          adjacent) rather than reflect system truth. Revisit only if a WARMED M2
          exceeds ceiling (real regression -> hopper) or burst isolation fails under
          the deterministic replay gate (real concurrency defect -> TK-77/AD-0010).
      - option: GO (clean) — close with no residuals listed
        rejected_because: >
          Dishonest about the open harness edits (R1-R4); the residuals are real
          follow-ups even though none blocks. GO-WITH-RESIDUALS is the truthful shape.
    consequences: >
      Coordinator may roll all epics + FEAT-1/FEAT-2 to done and set meta.status ->
      done, recording in the changelog a reference to AD-0038/0039/0040 and the
      four non-blocking residuals R1-R4. Recommended follow-up governance items
      (NOT close blockers): R1 Q1.8 re-spec (forge, TK-92 scope), R2 M2 warmed
      capture (forge), R3 Postgres payload-column qualification (sentinel — it is a
      DB/SQL query fix), R4 cassette prompt-hash normalization (forge, the durable
      fix for AD-0036/0037 non-determinism). No production code change is required
      to close.
    canon: "no tension — all Six Standards intact: drive isolation (live isolated ticking process, isConnected), provenance-required (0.896 experiential, AD-0036), confidence ceiling/guardian asymmetry (unchanged), theater-prohibition (closing on system truth, not chased green), no self-mod of evaluation (harness edits are spec corrections, reviewer-gated)."
