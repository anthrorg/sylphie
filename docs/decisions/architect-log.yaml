    supersedes: null

  - id: AD-0035
    date: 2026-06-17
    title: Q-24 add hostilityMagnitude to the IPC metadata Zod sub-schema (additive); reword the TK-86 non-goal
    status: accepted
    context: >
      The metadata sub-object is a plain z.object().optional() with NO
      .passthrough() (ipc-message-validator.ts:45-51), and the top-level payload is
      .strict() (validator:81, per DEC-1). In Zod v3 a z.object() STRIPS unknown
      keys, so hostilityMagnitude would be dropped before computeDefaultAffect. The
      TK-86 non-goal "no IPC validator schema change" was scoped to actionType
      staying z.string() (no new enum).
    decision: >
      Add hostilityMagnitude as z.number().min(0).max(1).optional() to the metadata
      sub-schema. The non-goal meant "no actionType enum", NOT a frozen metadata
      object — reword it in TK-86. Add ipc-message-validator.ts to TK-86
      files_in_scope. Reusing an existing metadata field was rejected (semantic
      collision — undiscoveredObjectCount / unknownPersonCount / sceneSurprise each
      carry distinct validated meanings).
    rationale: >
      The schema mechanics are unambiguous from source: a z.object() without
      .passthrough() drops unknown keys, so the signal never reaches affect
      computation unless declared. The change is a single additive, range-clamped,
      optional field — it does not touch the top-level .strict() isolation boundary
      (the Std-6 hardening from DEC-1) and does not change actionType.
    alternatives:
