  - id: AD-0019
    date: 2026-06-16
    title: Drive hostility-appraisal — new InboundHostility action type reusing the lexical affect scorer; pressure-only Anxiety+Social, no relief
    status: accepted
    context: >
      The drive hostility-appraisal gap (WS4 T8 blind). The drive engine has NO
      path that turns a hostile/aggressive inbound message into threat-driven
      arousal: ACTION_TYPE_DEFAULTS (rules.ts:60-169) has no hostility/threat
      entry, and no emitter sends one. The IPC validator's ACTION_OUTCOME schema
      uses `actionType: z.string()` (ipc-message-validator.ts:40), so a new action
      type needs NO schema change. A deterministic lexical valence/magnitude scorer
      already exists (theater-affect-scorer.ts) producing valence in [-1,1] and
      magnitude in [0,1] from response text — the same machinery can score INBOUND
      text.
    decision: >
      Add an `InboundHostility` metadata-scaled action type to ACTION_TYPE_DEFAULTS
      mapping a hostility magnitude to Anxiety + Social PRESSURE (positive deltas,
      NO relief on any axis), added to METADATA_SCALED_ACTION_TYPES so the engine
      scales by the magnitude. Detection reuses the existing lexical affect scorer
      (strong negative valence + magnitude above a threshold => hostility
      magnitude), invoked on inbound text on the app side, emitted as an
      ActionOutcome to the drive engine over the existing IPC ACTION_OUTCOME path
      (push, never a read/RPC into the drive — matches the drive-event standard).
      Per-source habituation is NOT added in v1 (a genuinely hostile interlocutor
      should keep registering); the cooldown/rate-limit is left to a follow-up if
      flapping appears. Because the detector is heuristic and the drive-mapping is
      a value judgment, the ticket carries a POC: open question = which drives and
      what magnitude curve, hypothesis = Anxiety+Social pressure scaled by lexical
      hostility magnitude is sufficient and non-theatrical.
    rationale: >
      Reusing the proven lexical scorer avoids a new classifier and keeps the
      change to a rules.ts mapping + an emitter — the smallest move that closes the
      blind spot. Pressure-only (no relief) is correct: a hostile message should
      raise Anxiety, and its absence should NOT actively relieve it (Anxiety has no
      passive decay by design — drives.ts:84 — so a relief delta would be the only
      way it falls, which would let a calm message "reward away" prior threat;
      that is the wrong dynamics and a theater risk). actionType being z.string()
      means no validator change, only an additive rules entry.
    alternatives:
      - option: Train/wire a dedicated sentiment classifier for hostility
        rejected_because: >
          Net-new model + serving cost for a signal the existing lexical scorer
          already approximates; revisit only if the lexical scorer proves too
          coarse in the POC.
      - option: Map hostility to a relief-capable axis (allow negative deltas)
        rejected_because: >
          Anxiety/Social are event-only (no passive decay); a relief delta lets a
          subsequent calm turn cancel registered threat — wrong dynamics and a
          theater hazard. Pressure-only is the CANON-aligned shape.
    consequences: >
      TK-86 adds InboundHostility to rules.ts + METADATA_SCALED_ACTION_TYPES + an
      app-side emitter reusing theater-affect-scorer, POC-gated on the
      drive-mapping. No IPC schema change. Owner: drive (rules) + vox/forge
      (emitter); conceptual reviewer skinner.
    canon: "supports theater-prohibition (pressure-only, no reward-away of threat) + drive isolation (push ActionOutcome, no RPC into drive); no tension"
    evidence:
      - packages/drive-engine/src/constants/rules.ts:165
      - packages/drive-engine/src/ipc-channel/ipc-message-validator.ts:40
      - apps/sylphie/src/services/theater-affect-scorer.ts:23
      - packages/drive-engine/src/constants/drives.ts:84
    supersedes: null

