  - id: AD-0044
    date: 2026-07-02
    title: Guardian-cockpit DESIGN-LOCK — flight deck around a time-travel INSPECTOR with a command line, all bound to one selected-turn; breakpoints only from the five real backend detectors; client-side attractor derivation ruled theater and banned
    status: accepted
