      docs/frontend-experience-spec.md SS3A/SS4A/SS8, AD-0043 (two-experience
      brief), and direct code verification the research could not do: the
      actual frontend components, the attractor detectors, and the event-spine
      schema/write paths.
    decision: >
      LOCKED ORGANIZING MODEL (endorsed with one refinement): the cockpit is a
      flight-deck shell (always-on vitals, status-by-exception) wrapped around
      a TIME-TRAVEL INSPECTOR (not "debugger" — no re-execution/what-if is
      possible or may be implied; the spine is a recording), with an
      observability command line (Cmd-K), all three bound to a single
      selected-turn value that re-scopes every panel; earned-value /
      earned-zero / offline-unknown-theater are three never-conflated visual
      tokens rendered by ONE shared status-chip component. The five spec
      surfaces are views over the same recording bound to the same selected
      instant, not separate apps.
      LOCKED LAYOUT (research SS5, confirmed buildable): fixed regions —
      vitals strip / conversation (left) / Impact rail (right) /
      turn-timeline scrubber with stacked tracks (bottom) / Cmd-K overlay.
      Fixed positions, no widget rearrangement; a global density toggle is
      the only layout flexibility. Drill-in-place (no modals/drawers hiding
      the parent). Live-follow default with pause-on-select and a prominent
      jump-to-live; two clocks always visible (live vs selected). Every
      number deep-links to its verbatim spine row.
      TURN GRANULARITY (ruled): a "turn" = the gateway-minted turnId; on the
      spine it is the correlation group correlation_id='turn:<turnId>'
      (decision-making.service.ts:1784, indexed by idx_events_correlation).
      Her utterance-turns are the primary selectable/step unit; step-into =
      the event rows of the correlation group in timestamp order; self-ticks
      ('action:<id>' groups) render as minor timeline marks (selectable
      via the same impact rail — cheap, same query path).
      REVERSE-STEP SCOPE (ruled): entire recorded history, not a rolling
      window — every spine row carries its own drive_snapshot JSONB
      (002-events.sql:13), so state-at-instant is materialized per event; no
      reconstruction/replay engine is needed, only indexed reads.
      DETECTOR HONESTY (CANON call): breakpoints may surface ONLY from the
      backend AttractorMonitorService, which is real and wired
      (recordArbitration at decision-making.service.ts:1369, runDetectors at
      :816/:1464, recordPrediction at :2240, alerts emitted to the spine as
      ATTRACTOR_STATE_ALERT). Per-detector ruling: TYPE_2_ADDICT real;
      HALLUCINATED_KNOWLEDGE real (live WORLD Neo4j provenance query) but its
      noData fallback (triggered:false, metric:0 on Neo4j-down) is
      indistinguishable from healthy — DetectorResult must gain an explicit
      unmeasured/noData flag before the UI renders it; DEPRESSIVE_ATTRACTOR
      real (composite, read-only drive reader); PLANNING_RUNAWAY real but
      PARTIAL — surface labeled "failure-ratio only" (plan-proliferation leg
      unwired, admitted at attractor-monitor.service.ts:529-533);
      PREDICTION_PESSIMIST real (cold-start-guarded). MOOD_BLEED monitor is
      real and wired (module :189, tick engine :374-396) and may surface with
      its known hostile-appraisal blind-spot labeled.
      MUST NOT APPEAR: the entire client-side deriveAttractorAlerts in
      frontend/src/hooks/useObservatoryAlerts.ts — six client-invented
      "attractors" with hardcoded risk scores (e.g. :68 risk_score 0.5),
      invented intervention copy, and a primary fetch against a nonexistent
      endpoint (/api/metrics/observatory/alerts is not in
      metrics.controller.ts) that silently falls back to the fabrication.
      This is a UI Std-1 violation; delete it and replace with a real
      endpoint exposing AttractorMonitorService results + spine
      ATTRACTOR_STATE_ALERT rows for timeline markers. Also banned until
      earned: any coherence/contradiction breakpoint (scanner is a structural
      no-op, stub SS0.5), the communication theater-check chip as currently
      fed (is_grounded is flag-only theater both ends, stub SS3.1 — label or
      remove), and any convergence/graduation milestone not from a real
      event. AttractorAlertBanner's return-null-when-unreachable (:17) must
      become an explicit "detectors: offline" state. Tensor cognition renders
      "OFFLINE — no influence this turn" while stub SS0.1 stands. Supervisor
      shows "not sampled" for unsampled cycles, never a green tick. The 0.60
      confidence ceiling renders as a visible cap line with copy per AD-0043:
      the ceiling lifts on retrieval-and-use, NOT on guardian confirmation
      (the research report repeats the Std-3 misstatement — corrected here).
      RULED-OUT FOR V1: natural-language query (LLM dependency + theater
      risk; structured search only, graph nodes + turns + event types);
      what-if/counterfactual framing anywhere in copy. Watch-pins persist in
      localStorage per guardian (default; Jim may veto). Vitals strip = the
      spec four (executor, dominant drive, autonomy-so-far, cost) plus a
      feed-health channel (drive-feed staleness — pressureIsStale exists in
      the store — WS status, detector reachability).
      PRECONDITIONS (build-blocking, in scope of the epic): (1) NEW backend
      read API over the spine — GET turn index (scrubber) + GET per-turn
      impact bundle keyed by correlation_id with session_id+time-window
      fallback (some INSERTs omit correlation_id, e.g.
      communication.service.ts:1290) — this is the biggest gap the research's
      "mostly reorganize, not greenfield" reuse map understates; (2) real
      attractor-status endpoint + deletion of the client derivation; (3)
      turn_id stamped on every response message on the text path (type field
      exists, types/index.ts:94; voice path already sets it); (4) the WS
      zombie-socket fix (stub SS0.7) — duplicate delivery corrupts turn
      identity, already an AD-0043 launch gate; (5) DetectorResult noData
      flag. FORGE LATITUDE: proportions/spacing (tokens deferred per spec
      SS0), track order, sparkline/keyboard implementations, search facet
      scope within the ruled v1 boundary, transport details, self-tick
      rendering.
    rationale: >
      The hybrid model wins because each mode inherits its best-in-class
      metaphor while one global binding (selected turn) makes them one
      instrument — a pure dashboard cannot answer "step into this turn", a
      pure debugger has no vitals culture; the research's own strain analysis
      (SS7) is correct and its inspector-not-simulator caveat is promoted
      into the locked name to prevent capability-claim theater. The
      detector ruling follows from direct code reading: the backend monitor
      is genuinely fed by the live decision loop and emits to the spine,
      while the frontend hook fabricates differently-named detectors with
      hardcoded scores against an endpoint that does not exist — exactly the
      blank-reads-as-fine / invented-number failure the Theater Prohibition
      exists to stop, in the one product whose thesis is honest
      instrumentation. Turn granularity and reverse-step follow from the
      spine's actual shape: correlation_id anchors a real per-turn group and
      every row carries drive_snapshot, so "inspect state at any past
      instant" is an indexed read, not a reconstruction — the strongest
      possible grounding for the inspector metaphor.
    alternatives:
      - option: Pure observability-dashboard frame (Grafana-only, no inspector semantics)
        rejected_because: >
          Cannot express "step into this turn and read her state" — Jim's
          core causal question; revisit only if the impact API proves
          infeasible, which the spine's per-row drive_snapshot contradicts.
      - option: Surface the existing client-derived attractor alerts (keep useObservatoryAlerts) until the real endpoint lands
        rejected_because: >
          It fabricates detector identities, thresholds, and risk scores that
          do not exist in the backend — a standing Std-1 violation in the
          honesty-flagship surface. Nothing may render from it; the real
          endpoint is a precondition.
      - option: Rolling-window reverse-step (recent turns only) to bound query cost
        rejected_because: >
          Unnecessary — state is materialized per event row and
          correlation/session indexes exist; artificial windowing would
          understate a real capability.
    consequences: >
      forge builds against this lock (owner forge, conceptual reviewer ashby,
      code-reviewer per trio); the five preconditions enter the epic as
      tickets before or alongside the Impact rail; useObservatoryAlerts
      derivation is deleted, not deprecated. The research report SS5 layout +
      SS3/SS4 pattern tables are adopted as build reference EXCEPT its Std-5
      confidence-lift claim (corrected above) and its reuse-map optimism about
      B/C data availability (new API required). Remaining for Jim
      (non-blocking, defaults locked): final vitals-strip membership +
      deviation thresholds; density-toggle default; watch-pin persistence
      veto; keyboard reservation vs push-to-talk. Risk carried: the impact
      bundle depends on correlation_id stamping discipline — events that omit
      it degrade to time-window attribution and must render as
      "attributed-by-time" rather than claimed-exact (honesty in the join,
      not just the cell).
    canon: >
      Standard 1 (Theater Prohibition): three UI-side violations found and
      resolved by this lock — client-fabricated attractor alerts (banned),
      AttractorAlertBanner blank-when-offline (explicit offline state
      mandated), theater-check chip fed by flag-only is_grounded (label or
      remove until stub SS3.1 closes). Std-3 rendering mandated per AD-0043's
      corrected semantics. No standing tension remains in the locked design.
