  - id: AD-0034
    date: 2026-06-17
    title: Q-23 Type-1 face reflex anchor — a face-scoped procedure node in the person-scoped OKG, not an opaque key
    status: accepted
    context: >
      type1-tracker graduation requires a procedureId anchor tied to a learned
      procedure. A face to Type-1 path needs either (a) a face-scoped procedure
      node in the person-scoped OKG, or (b) extending type1-tracker to accept an
      opaque key not tied to learned_patterns. TK-85's POC must resolve which.
    decision: >
      Option (a). The face reflex graduates against a real face-scoped procedure
      node in the person-scoped OKG (analogous to the :Candidate
      grounding_person_id scope), never the shared WKG. type1-tracker must NOT
      accept an opaque key disconnected from a learned procedure — that breaks the
      Type-1 graduation invariant (every reflex traces to a learned procedure with
      provenance and a useCount). The POC must prove this anchor is feasible
      before build scope opens.
    rationale: >
      The graduation invariant — every reflex anchored to a learned,
      provenance-carrying procedure with a usage count — makes a graduated reflex
      auditable and prevents an ungrounded shortcut into reflexive behaviour. An
      opaque key would let a face become a reflex with no learned-procedure
      lineage, breaking that invariant and the provenance chain.
    alternatives:
      - option: Extend type1-tracker to accept an opaque key not tied to learned_patterns
        rejected_because: >
          Breaks the Type-1 graduation invariant and the provenance chain; revisit
          only if a person-scoped procedure-node anchor proves infeasible (which
          would defer the face reflex per DEC-21).
    consequences: >
      TK-85 POC gains the anchor-feasibility sub-question. Q-23 resolves to DEC-23.
    canon: "supports provenance-required + Std-3 isolation — the anchor is person-scoped and traces to a learned procedure"
    evidence:
