  - id: AD-0011
    date: 2026-06-16
    title: Q-1 legacy-pattern-rescope — DECISION to migrate; re-attribute the 293 world-scoped rows to guardian
    status: accepted
    context: >
      Tier-6 Q-1. 293 legacy rows were written under the old world-scoped
      attribution pattern before the three-graph (Self/Other/World) isolation
      landed (commit 1f53de2, "feat/wave3-three-graph-isolation"). The question
      is whether to run a one-shot migration re-attributing them to the guardian,
      or leave them. Jim's directive: make the call, don't punt. Wave 3 made
      guardian/self/other/world a hard isolation boundary; legacy rows that
      predate it sit in the wrong scope and would otherwise be a permanent
      provenance gap (CANON Std: provenance-required).
    decision: >
      Migrate. Run a one-shot, idempotent re-attribution that moves the 293
      legacy world-scoped rows to the correct guardian attribution, gated by a
      dry-run row-count assertion (exactly 293 candidates matched) and a
      reversible backup of the pre-migration scope values. This becomes a ticket
      under the data-model/migration owner (sentinel) — not left as an open
      question. The migration is provenance-restoring, not data-changing: only
      the attribution/scope column moves; payloads are untouched.
    rationale: >
      Leaving 293 mis-scoped rows is a standing provenance violation against the
      three-graph isolation the system now depends on — exactly the kind of
      "expensive to get wrong later" residue that compounds. A one-shot,
      counted, reversible migration is cheap now and removes the gap permanently.
      Re-attribution to guardian (not deletion) preserves the historical signal
      while putting it in the CANON-correct scope.
    alternatives:
      - option: Leave the legacy rows world-scoped (non_goal)
        rejected_because: >
          Permanent provenance gap against Wave-3 isolation; revisit only if Jim
          rules the 293 rows are genuinely world-facts (not guardian-attributed),
          in which case the migration is a no-op — but the default per isolation
          is guardian attribution for pre-isolation guardian-origin rows.
      - option: Delete the 293 rows
        rejected_because: >
          Discards real historical signal; re-attribution preserves it at equal
          cost.
    consequences: >
      A new migration ticket (owner: sentinel, conceptual: ashby) is added under
      the data-model epic with a dry-run/backup AC. Q-1 resolves to DEC-7. The
      migration must be idempotent and reversible.
    canon: "supports Std: provenance-required (restores correct scope); no tension"
    evidence:
      - "git commit 1f53de2 (three-graph isolation)"
    supersedes: null

  - id: AD-0012
