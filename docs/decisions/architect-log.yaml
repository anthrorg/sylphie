          meaning misleads every other consumer.
      - option: Use .passthrough() on the metadata object
        rejected_because: >
          Re-opens the silent-unknown-key hole the .strict() hardening closed; an
          explicit declared field is the honest path.
    consequences: >
      TK-86 gains ipc-message-validator.ts in scope + the additive field; the
      non-goal is reworded. Q-24 resolves to DEC-24.
    canon: "no tension — additive optional field; the top-level .strict() boundary (DEC-1 / Std-6 hardening) is untouched"
    evidence:
