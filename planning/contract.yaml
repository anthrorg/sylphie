    intent: "In `packages/planning/src/queue/opportunity-queue.service.ts`, replace the `dequeue()` method (lines 173-183) with a version that scans for the first eligible item rather than blindly taking `shift()`:\n\n```typescript\n  dequeue(): QueuedOpportunity | null {\n    if (this.queue.length === 0) return null;\n    const now = Date.now();\n    const idx = this.queue.findIndex(\n      (item) => item.retryAfter === undefined || item.retryAfter <= now,\n    );\n    if (idx === -1) return null;\n    const [item] = this.queue.splice(idx, 1);\n    vlog('opportunity dequeued', {\n      opportunityId: item.payload.id,\n      classification: item.payload.classification,\n      priority: item.currentPriority,\n      remainingQueueSize: this.queue.length,\n    });\n    return item;\n  }\n```\n\nItems with a future retryAfter remain in the queue (not dropped); the next eligible item by position (already priority-sorted) is returned instead. This satisfies both AC arms: a deferred item is skipped until its window expires, then returned normally."
