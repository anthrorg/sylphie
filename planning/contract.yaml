  - id: Q-10
    type: open_question
    status: resolved
    scope: TK-27
    title: Vision acceptance fixture strategy - synthetic flat-rectangle JPEGs may not trigger YOLO COCO detection
    owner: architect
    description: 'TK-30 synthetic mug/book/person JPEGs are labeled rectangles; YOLO(-seg) is trained on natural images, so they may yield zero COCO detections (no confirmed track, no mask polygon) - breaking ACC.A (768-D embedding + mask-zeroing), ACC.B (re-bind), and the intra-class cosine floor. Decide: (a) real-photo fixtures, (b) synthesize COCO-plausible structure, or (c) accept a non-zero-norm proxy for mask-zeroing at this engineering level. Gates EP-6 (TK-27/28/29).'
    resolution: 'DEC-10 (AD-0021): synthesize COCO-plausible structure AND set COBEING_PERCEPTION_DETECTION__CONFIDENCE_THRESHOLD=0.10 (default 0.25, main.py:29) for the acceptance run. Real-photo fixtures rejected (uncontrolled variable); the non-zero-norm proxy rejected (weakens the mask-zeroing gate). TK-30 fixtures stay synthetic but COCO-plausible; TK-26/27 ACs assert the 0.10-threshold run yields >=1 confirmed track.'
    date_raised: '2026-06-16'
