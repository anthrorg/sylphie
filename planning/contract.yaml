    title: Add transcribeAudio() REST method to SttService
    intent: "apps/sylphie/src/services/stt.service.ts — add a new public async method after `closeSession` (~:207), before `onModuleDestroy`. Insert at ~:208:\n\n```typescript\n/**\n * One-shot REST transcription via Deepgram pre-recorded API.\n * Returns { text, confidence, latencyMs } or throws on failure.\n */\nasync transcribeAudio(\n  audioBuffer: Buffer,\n  mimeType: string,\n): Promise<{ text: string; confidence: number; latencyMs: number }> {\n  if (!this.available) {\n    throw new Error('STT unavailable — DEEPGRAM_API_KEY not set');\n  }\n\n  const url =\n    'https://api.deepgram.com/v1/listen?model=nova-2&language=en-US&smart_format=true';\n  const t0 = Date.now();\n\n  const res = await fetch(url, {\n    method: 'POST',\n    headers: {\n      Authorization: `Token ${this.apiKey}`,\n      'Content-Type': mimeType,\n    },\n    body: audioBuffer,\n  });\n\n  if (!res.ok) {\n    const body = await res.text().catch(() => '');\n    this.logger.error(`Deepgram REST error ${res.status}: ${body}`);\n    throw new Error(`Deepgram REST ${res.status}`);\n  }\n\n  const data = (await res.json()) as {\n    results?: {\n      channels?: Array<{\n        alternatives?: Array<{ transcript: string; confidence: number }>;\n      }>;\n    };\n  };\n\n  const alt = data?.results?.channels?.[0]?.alternatives?.[0];\n  const text = alt?.transcript ?? '';\n  const confidence = alt?.confidence ?? 0;\n  const latencyMs = Date.now() - t0;\n\n  vlog('STT REST result', { text, confidence, latencyMs });\n  return { text, confidence, latencyMs };\n}\n```\n\nNo imports need adding — `fetch` is global on Node 24; `this.logger`, `this.apiKey`, and `vlog` are already in scope. The method uses the same `voiceConfig`-wired `this.apiKey` that `createSession` uses."
    files_in_scope:
    - apps/sylphie/src/services/stt.service.ts
