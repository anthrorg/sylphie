    intent: "packages/learning/src/pipeline/confidence-decay.service.ts — after decayOkgNodes() and before the closing brace of the class body (before the comment `// Helpers` at ~:248), insert:\n\n```typescript\n/**\n * Remove :Attribute nodes in OKG (OTHER instance) below PRUNE_THRESHOLD\n * with no remaining relationships. Same threshold as WORLD pruning.\n *\n * Note: a GUARDIAN Attribute node at confidence 0.0 would technically be\n * prunable, but because decayOkgNodes() never decays GUARDIAN nodes, they\n * cannot organically fall below PRUNE_THRESHOLD; this guard is therefore\n * belt-and-suspenders only.\n */\nprivate async pruneOkgOrphanedNodes(): Promise<number> {\n  const session = this.neo4j.getSession(Neo4jInstanceName.OTHER, 'WRITE');\n\n  try {\n    const result = await session.run(\n      `MATCH (a:Attribute)\n       WHERE a.confidence <= $pruneThreshold\n         AND NOT EXISTS { (a)--() }\n       DELETE a\n       RETURN count(a) AS pruned`,\n      { pruneThreshold: PRUNE_THRESHOLD },\n    );\n\n    const record = result.records[0];\n    return record ? toNumber(record.get('pruned')) : 0;\n  } catch (err) {\n    this.logger.warn(\n      `pruneOkgOrphanedNodes failed: ${err instanceof Error ? err.message : String(err)}`,\n    );\n    return 0;\n  } finally {\n    await session.close();\n  }\n}\n```"
