    title: Add InboundHostility emitter to parseInput in CommunicationService
    intent: "In `apps/sylphie/src/services/communication.service.ts`, add a hostility detection + emission call inside `parseInput()`, immediately AFTER the guardian teaching detection block at line 277 (after the `if (teaching)` block). The new block:\n\n```typescript\n// InboundHostility detection (TK-86): hostile/aggressive inbound messages raise\n// Anxiety + Social PRESSURE without relief. Reuses the deterministic lexical\n// affect scorer already imported above (scoreAffect). CANON Std-6: no relief delta.\nconst hostilityScore = scoreAffect(text);\nif (\n  hostilityScore.valence <= HOSTILITY_VALENCE_THRESHOLD &&\n  hostilityScore.magnitude >= HOSTILITY_MAGNITUDE_THRESHOLD\n) {\n  this.emitInboundHostility(sessionId, hostilityScore.magnitude);\n}\n```\n\nAlso add at the top of the file (after existing constant imports, before the class), two private constants:\n```typescript\n/** Valence must be at or below this to classify as hostile (negative valence gate). */\nconst HOSTILITY_VALENCE_THRESHOLD = -0.5; // matches NEGATIVE_VALENCE_THRESHOLD in theater-affect-scorer.ts\n/** Magnitude must be at or above this to emit a hostility signal (filters weak/neutral messages). */\nconst HOSTILITY_MAGNITUDE_THRESHOLD = 0.25; // matches MAGNITUDE_FLOOR in theater-affect-scorer.ts\n```\n\nAnd add a private method `emitInboundHostility` on `CommunicationService` after `handleGuardianTeaching` (~line 1263):\n```typescript\n/**\n * Emit an InboundHostility ActionOutcome to the drive engine.\n *\n * PUSH model (not RPC): fire-and-forget via outcomeReporter.\n * CANON Std-6: no relief delta; Anxiety + Social PRESSURE only (see rules.ts InboundHostility entry).\n */\nprivate emitInboundHostility(sessionId: string, magnitude: number): void {\n  const actionId = `inbound-hostility:${sessionId}:${Date.now()}`;\n  this.outcomeReporter.reportOutcome({\n    actionId,\n    actionType: 'InboundHostility',\n    success: false,\n    metadata: { hostilityMagnitude: magnitude },\n    feedbackSource: 'algorithmic',\n    theaterCheck: {\n      expressionType: 'none',\n      correspondingDrive: null,\n      driveValue: null,\n      isTheatrical: false,\n    },\n  });\n  vlog('inbound hostility emitted', { magnitude, sessionId });\n}\n```"
    files_in_scope:
    - apps/sylphie/src/services/communication.service.ts
