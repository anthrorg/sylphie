    status: todo
    title: Wrap each pipeline step in processEvent() with per-step try-catch for dead-letter capture
    intent: "In `packages/learning/src/learning.service.ts`, in `processEvent()` (line ~454), replace the current single-block try-catch with per-step try-catches so `pipeline_step` is set accurately. The outer catch (line ~529) becomes the final fallback. The new structure:\n\n```typescript\nprivate async processEvent(\n  event: UnlearnedEvent,\n  result: Mutable<MaintenanceCycleResult>,\n): Promise<void> {\n  let step = 'upsert-entities';\n  try {\n    // Step 3\n    step = 'upsert-entities';\n    const entities = await this.upsertEntities.upsertEntities(event);\n    result.entitiesUpserted += entities.length;\n    for (const entity of entities) {\n      this.eventLogger.log('ENTITY_EXTRACTED', { eventId: event.id, nodeId: entity.nodeId, label: entity.label, provenance: entity.provenance, confidence: entity.confidence }, event.session_id);\n    }\n\n    // Step 3b\n    step = 'extract-typed-edges';\n    const { edges: typedEdges, typedPairs } = await this.extractTypedEdges.extractTypedEdges(entities, event);\n    result.edgesUpserted += typedEdges.length;\n\n    // Step 4\n    step = 'extract-edges';\n    const cooccurrenceEdges = await this.extractEdges.extractEdges(entities, event, typedPairs);\n    result.edgesUpserted += cooccurrenceEdges.length;\n    const edges = [...typedEdges, ...cooccurrenceEdges];\n\n    // Step 5\n    step = 'conversation-entry';\n    const convNodeId = await this.conversationEntry.createEntry(event, entities);\n    if (convNodeId) result.conversationsCreated++;\n\n    // Step 6\n    step = 'can-produce-edges';\n    const canProduceCount = await this.canProduceEdges.createEdges(convNodeId, event);\n    result.canProduceEdgesCreated += canProduceCount;\n\n    // Step 7\n    step = 'refine-edges';\n    const refinedCount = await this.refineEdges.refineEdges(edges, event);\n    result.edgesRefined += refinedCount;\n    if (refinedCount > 0) {\n      this.eventLogger.log('EDGE_REFINED', { eventId: event.id, edgesRefined: refinedCount, totalEdges: edges.length }, event.session_id);\n    }\n\n    // Step 7b\n    step = 'detect-contradictions';\n    const contradictions = await this.detectContradictions.detectContradictions(edges, event);\n    result.contradictionsDetected += contradictions;\n\n    // Step 2b\n    step = 'mark-as-learned';\n    await this.updateWkg.markAsLearned(event.id);\n    result.eventsProcessed++;\n  } catch (err) {\n    this.logger.error(\n      `processEvent failed for event ${event.id} at step ${step}: ${\n        err instanceof Error ? err.message : String(err)\n      }`,\n    );\n    // Write dead-letter row (fire-and-forget; step captured at throw site).\n    this.insertDeadLetter(event.id, step, err);\n    // Mark as learned anyway to unblock the queue.\n    try {\n      await this.updateWkg.markAsLearned(event.id);\n      result.eventsProcessed++;\n    } catch {\n      // Let it be — the next cycle will retry.\n    }\n  }\n}\n```\n\nNote: the `step` variable is declared once before the try-block and reassigned at the start of each logical step so the catch captures the failing step name without needing nested try-catches."
    files_in_scope:
    - packages/learning/src/learning.service.ts
