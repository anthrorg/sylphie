    owner: jim
    description: 'Preflight AC reads model_loaded, face_model_loaded, embedding_init_failed from GET /perception/status, but only model_loaded/face_model_loaded are exposed; the DINOv2 _object_embedding_init_failed flag is module-private. Decide: add embedding_init_failed to /perception/status (small main.py change), or relax the AC to the two existing flags (face_model_loaded already implies ArcFace). Blocks TK-26 -> TK-27/28/29.'
    resolution: 'DEC-11 (AD-0022): expose it. Add embedding_init_failed to the GET /perception/status JSONResponse (main.py:1450-1454) as a one-line read of the module-private _object_embedding_init_failed (main.py:196) OR-ed with _embedding_init_failed/_face_embedding_init_failed as the embedding-failure aggregate. Relaxing the AC was rejected (weakens preflight, hides a latched init failure). TK-26 files_in_scope gains packages/perception-service/main.py.'
