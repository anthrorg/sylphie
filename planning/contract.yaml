    title: Update /cognition/control/freeze endpoint to dispatch per-panel freeze
    intent: "packages/cognition-service/main.py — Replace freeze_model (:894-911) with:\n\n@app.post(\"/cognition/control/freeze\")\nasync def freeze_model(model_name: str = \"all\"):\n    \"\"\"Freeze model weights — suspend training updates on the specified model.\n\n    model_name=\"all\"   : freezes the entire training loop (existing behaviour).\n    model_name=\"panel_N\": freezes panel N by index (N in 0..3).\n    model_name=unknown : returns accepted=False with an error message.\n    \"\"\"\n    if not _state.trainer:\n        return JSONResponse(\n            status_code=400,\n            content={\"accepted\": False, \"error\": \"Trainer not initialized\"},\n        )\n\n    from training.trainer import _PANEL_INDEX_TO_NAME\n\n    resolved = model_name\n    if model_name.startswith(\"panel_\"):\n        suffix = model_name[len(\"panel_\"):]\n        if not suffix.isdigit() or int(suffix) >= len(_PANEL_INDEX_TO_NAME):\n            return JSONResponse(\n                status_code=400,\n                content={\n                    \"accepted\": False,\n                    \"error\": f\"Unknown model_name '{model_name}'. \"\n                             f\"Valid panel indices: 0-{len(_PANEL_INDEX_TO_NAME)-1}.\",\n                },\n            )\n        resolved = _PANEL_INDEX_TO_NAME[int(suffix)]\n\n    accepted = _state.trainer.freeze(resolved)\n    if not accepted:\n        return JSONResponse(\n            status_code=400,\n            content={\n                \"accepted\": False,\n                \"error\": f\"Unknown model_name '{model_name}'.\",\n            },\n        )\n\n    logger.info(\"Freeze accepted: model_name='%s' (resolved='%s')\", model_name, resolved)\n    return {\"accepted\": True, \"model\": model_name, \"resolved\": resolved, \"frozen\": True}"
