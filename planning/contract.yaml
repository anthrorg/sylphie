    title: Create MaeHistoryStore injectable
    intent: "Create new file `packages/decision-making/src/confidence/mae-history-store.ts`. The full file content:\n\n```typescript\nimport { Injectable } from '@nestjs/common';\n\n/** Maximum MAE observations per action in the rolling window. */\nexport const MAX_MAE_WINDOW = 10;\n\n/**\n * MaeHistoryStore — shared, injectable, in-memory MAE rolling window.\n *\n * Replaces three independent Map<string,number[]> instances that previously\n * lived privately in PredictionService, ConfidenceUpdaterService, and\n * Type1TrackerService. All three consumers now read from the same window,\n * ensuring graduation/demotion/confidence decisions are never split-brained.\n *\n * Window is ephemeral (no DB, no persistence across restarts). FIFO eviction\n * at MAX_MAE_WINDOW = 10 entries.\n */\n@Injectable()\nexport class MaeHistoryStore {\n  private readonly windows = new Map<string, number[]>();\n\n  /** Append a MAE value; evicts oldest if at capacity. */\n  append(actionId: string, mae: number): void {\n    let w = this.windows.get(actionId);\n    if (!w) {\n      w = [];\n      this.windows.set(actionId, w);\n    }\n    if (w.length >= MAX_MAE_WINDOW) {\n      w.shift();\n    }\n    w.push(mae);\n  }\n\n  /** Return the rolling window (readonly). Empty array if no data yet. */\n  getWindow(actionId: string): readonly number[] {\n    return this.windows.get(actionId) ?? [];\n  }\n\n  /**\n   * Return the arithmetic mean of the window.\n   * Returns 0.0 (conservative sentinel) when the window is empty.\n   */\n  getMean(actionId: string): number {\n    const w = this.windows.get(actionId);\n    if (!w || w.length === 0) return 0.0;\n    return w.reduce((s, v) => s + v, 0) / w.length;\n  }\n}\n```"
