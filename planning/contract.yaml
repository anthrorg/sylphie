    title: Replace confidence + risk formulas (including zero-data path)
    intent: "In packages/planning/src/pipeline/simulation.service.ts:\n\n1. Zero-data early-return block (~lines 178–186): replace the returned object's last two fields:\n   OLD:\n     `confidenceEstimate: 0.2,\n     riskScore: 0.5,`\n   NEW:\n     `confidenceEstimate: 0,\n     riskScore: 1.0,`\n   (This makes count=0 satisfy AC1: confidence=0, risk=1.0.)\n\n2. After the for-loop, the two computed values at ~lines 211–219:\n   OLD:\n   ```\n   const avgEffect = totalCount > 0 ? totalEffect / totalCount : 0;\n   const successRate = totalCount > 0 ? successCount / totalCount : 0;\n\n   return {\n     description: `${category} based on ${totalCount} historical outcomes`,\n     actionCategory: category,\n     estimatedDriveEffect: { [affectedDrive]: avgEffect } as Partial<Record<DriveName, number>>,\n     confidenceEstimate: Math.min(0.8, successRate),\n     riskScore: 1.0 - successRate,\n   };\n   ```\n   NEW (add stdDev + shrinkage; keep avgEffect unchanged; no shape change on SimulatedOutcome):\n   ```\n   const avgEffect = totalCount > 0 ? totalEffect / totalCount : 0;\n   const shrinkageConfidence = successCount / (totalCount + SHRINKAGE_K);\n   const variance = totalCount > 0 ? sumSqEffect / totalCount - avgEffect * avgEffect : 0;\n   const stdDev = Math.sqrt(Math.max(0, variance));\n   const riskScore = Math.min(1.0, stdDev + (1.0 - shrinkageConfidence) * 0.5);\n\n   return {\n     description: `${category} based on ${totalCount} historical outcomes`,\n     actionCategory: category,\n     estimatedDriveEffect: { [affectedDrive]: avgEffect } as Partial<Record<DriveName, number>>,\n     confidenceEstimate: shrinkageConfidence,\n     riskScore,\n   };\n   ```\n\nNote: `successRate` local variable is no longer needed and should be removed. `sumSqEffect` is the accumulator added in Task 1."
