    title: Wrap contradiction scan in try/catch in ArbitrationService; return typed SHRUG on throw
    intent: "In `packages/decision-making/src/arbitration/arbitration.service.ts`, at line 256 (inside the `if (bestType1)` block, before `const scanResult = await this.contradictionScanner.scan(...)`), wrap the scan call in a try/catch:\n\n```typescript\nif (this.contradictionScanner) {\n  let scanResult: Awaited<ReturnType<typeof this.contradictionScanner.scan>>;\n  try {\n    scanResult = await this.contradictionScanner.scan(bestType1, driveSnapshot);\n  } catch (scanErr) {\n    this.logger.error(\n      `Contradiction scan threw unexpectedly: ${scanErr instanceof Error ? scanErr.message : scanErr}. Downgrading to SHRUG.`,\n    );\n    const result = this.buildShrug(\n      candidates,\n      driveSnapshot,\n      `Contradiction scanner threw: ${scanErr instanceof Error ? scanErr.message : String(scanErr)}`,\n      ['CONTRADICTION'],\n      threshold,\n    );\n    // Attach the typed arbitrationError so callers can distinguish scan-failure SHRUG\n    // from a normal contradiction SHRUG. Cast is safe — buildShrug returns the SHRUG variant.\n    return { ...result, arbitrationError: 'CONTRADICTION_SCAN_FAILED' as const };\n  }\n  if (scanResult.hasContradictions) {\n    // ... existing block at line 259 unchanged ...\n  }\n}\n```\n\nThe rest of the `if (this.contradictionScanner)` block (the `scanResult.hasContradictions` branch at lines 259-276) stays exactly as-is inside the `try`'s continuation — only the catch is new. The `arbitrationError` spread is the second AC's \"verdict SHRUG with arbitrationError=CONTRADICTION_SCAN_FAILED\" requirement."
