rounding)\", description: \"persistInsight() always creates Insight nodes at REFLECTION_CONFIDENCE=0.30 regardless of REVEALS edge count. edgesCreated ratio should set initial confidence (max(0.10, 0.30 * ratio)). TK-53 non_goals explicitly exclude computeGroundedConfidence. No ticket for the creation-time path.\" }\n  - { id: Q-11, type: open_question, status: open, scope: EP-13, title: \"Idea #8 — Observation validation pipeline (pre-ingestion quality gate in pipeline.py)\", description: \"pipeline.py:486-492: no min-bbox/min-confidence/zero-embedding gate between builder.build() and _observations.extend(). Junk propagates to WKG. ValidationConfig + validate_observation() filter insertion. No ticket.\" }\n  - { id: Q-12, type: open_question, status: open, scope: EP-14, title: \"Idea #9 — Deterministic constraint validation (replace deep-LLM call with rule-based)\", description: \"constraint-validation.service.ts:73-166 uses tier:'deep' LLM for 5 constraints that are largely structural. TK-65 only adds the trigger-context duplicate test; it does not replace the LLM call. Full deterministic replacement unticketeted. See wiki/ideas (idea not separately filed).\" }\n  - { id: Q-13, type: open_question, status: open, scope: EP-12, title: \"Idea #10 — Deterministic edge refinement heuristic (VERB_RULES fallback in refine-edges.service.ts)\", description: \"refine-edges.service.ts:143 uses quick-LLM; on LLM unavailability refinement skipped. VERB_RULES heuristic would reclassify high-confidence RELATED_TO edges without LLM. No ticket.\" }\n  - { id: Q-14, type: open_question, status: open, scope: EP-13, title: \"Idea #12 — Perception thread-safe state and lazy init (5 race conditions in main.py)\", description: \"perception-service main.py: frame_sequence increment (TOCTOU), embedding_extractor lazy-init race x2, tracker._tracks concurrent read/write. Needs asyncio.Lock + threading.Lock + double-checked locking. No ticket. See wiki/ideas/perception-embedding-init-deduplication.md (related).\" }\n  - { id: Q-15, type: open_question, status: open, scope: EP-15, title: \"Idea #16 — Stale stub comments in ActionHandlerRegistryService JSDoc\", description: \"action-handler-registry.service.ts lines 2-29 class-level JSDoc claims handlers are 'stubs that will be replaced'. All are fully wired. Documentation-only fix; no risk. No ticket. See wiki/ideas/action-handler-registry-stale-comments.md.\" }\n  - { id: Q-16, type: open_question, status: open, scope: EP-14, title: \"Idea #18 — Forward drive events to TimescaleDB event backbone\", description: \"drive-process-manager.service.ts:193-202 DRIVE_EVENT handler only logs; TimescaleService already injected; TODO comment confirms. No ticket. See wiki/ideas/drive-event-timescale-forwarding.md.\" }\n  - { id: Q-17, type: open_question, status: open, scope: project, title: \"Idea #20 — Wire IPCSelfKgReader for real KG(Self) access in drive process\", description: \"database-clients.ts: FallbackSelfKgReader returns empty arrays; IPCSelfKgReader.constructor sets ready:false. Self-evaluation loop runs without actual baseline data. Needs Promise-based IPC request/response pattern. No ticket. See wiki/ideas/ipc-self-kg-reader-wiring.md.\" }\n  - { id: Q-18, type: open_question, status: open, scope: EP-15, title: \"Idea #22 — Remove SensoryLoggerService temporary stand-in (after executor wiring)\", description: \"sensory-logger.service.ts runs setInterval at 2000ms sampling tickSampler.sample(); executor engine does NOT call tickSampler.sample(). Removing without wiring breaks telemetry. Prerequisite: wire sample() into ExecutorEngineService.onCycleComplete(). No ticket. See wiki/ideas/sensory-logger-temporary-standin.md.\" }\n  - { id: Q-19, type: open_question, status: open, scope: EP-14, title: \"Idea #24 — Real theater prohibition validation in communication.service.ts\", description: \"communication.service.ts:778 checkTheaterProhibition() checks anxiety>0.7 only, returns true, never blocks. Real