  # ================= FEAT-2 Wave 4d cognition stubs (TK-37..41) =================
  - { id: TK-37, kind: ticket, parent: EP-8, status: done, priority: P2, estimate: S, engineering_level: prototype,
      title: "EP8-POC — Verify EWC real-Fisher is live vs uniform fallback",
      intent: "Resolve whether the live cognition sidecar computes empirical Fisher at phase-transition (WS2 claim) or falls back to uniform Fisher, before writing a code ticket.",
      poc: { question: "Does POST /cognition/phase-transition on the live container compute empirical Fisher (fisher_computed=true), or is _compute_uniform_fisher still the active path?", hypothesis: "WS2 landed real Fisher; the backlog item is stale.", status: resolved, result: "RESOLVED — empirical Fisher is the live active path; _compute_uniform_fisher is only a documented first-call seed, not the running estimator. Verified on the live sylphie-cognition Docker container (port 8431, healthy, bootstrap_mode=shadow, 5,567,246 params).\n\nEMPTY-BUFFER call: POST /cognition/phase-transition {new_phase:\"audit\"} returned {\"accepted\":true,\"ewc_anchored\":true,\"fisher_computed\":false,\"calibration_samples\":0}. Container logs show the WARNING \"EWC set_reference() called before any compute_fisher() — falling back to uniform Fisher (L2 anchor) for this phase\" followed by Fisher[set_reference] stats of mean=1.000e+00 across all 8 layers (the all-ones uniform seed), then \"replay buffer empty, Fisher not computed\". This is the snapshot_calibration() empty-buffer path: data_buffer.py:197-198 returns [] when _count==0, so main.py's `if calibration:` (main.py:582) is false and compute_fisher() is never called.\n\nLOADED-BUFFER call: after submitting 10 valid TrainingSamples (the /cognition/train endpoint requires arbitration_type — TYPE_1 used; buffer grew 1→10), POST /cognition/phase-transition {new_phase:\"partial\"} returned {\"accepted\":true,\"ewc_anchored\":true,\"fisher_computed\":true,\"calibration_samples\":10}. Logs show real empirical Fisher: per-layer means ranging ~1e-8 to ~6e-6 with varying near_zero% (e.g. layer 1 mean=1.83e-06 near_zero=65.8%, layer 5 mean=5.93e-06 near_zero=12.5%) — NOT the uniform 1.000 seed. compute_fisher() (replay.py:222-331) computed squared per-chunk gradients over the 10 calibration samples and stored them in self._phase_fisher (replay.py:325).\n\nFIRST-CALL UNIFORM-SEED GAP: The call sequence in the handler (main.py:578 then 584) fires set_reference() BEFORE compute_fisher(). On the first phase boundary, set_reference() finds self._fisher is None and self._phase_fisher is None, so it seeds the EWC anchor with _compute_uniform_fisher() (replay.py:185-195) = plain L2 anchoring for that one phase. compute_fisher() then stores the empirical estimate into _phase_fisher but does NOT blend it into the active _fisher used for the penalty — by design the blend (F_new = γ·F_old + F_phase, replay.py:196-207) only happens at the NEXT set_reference(). So the empirical Fisher computed at boundary N only takes effect on the penalty from boundary N+1 onward. This is the intended Online EWC design (documented in replay.py:166-175), not a bug, but it means the very first phase transition's penalty is uniform/L2 regardless of buffer contents.\n\nIMPLICATION FOR TK-39: The WS2 hypothesis holds — real empirical Fisher is computed and active, so any backlog item claiming _compute_uniform_fisher is still the runtime path is STALE. The one residual nuance TK-39 should account for: there is a one-boundary lag — empirical Fisher computed at a boundary is seeded uniform on that same boundary and only blends into the active penalty at the following boundary (Online EWC accumulation). If TK-39 assumed empirical Fisher takes effect on the same transition it is computed, that assumption needs correcting; otherwise the path is real and proven." },
      complexity_budget: "<=4h; read replay.py/data_buffer.py + run one live phase-transition call; no fixes",
      acceptance_criteria: [ { given: "the live Docker cognition container", when: "POST /cognition/phase-transition with a loaded buffer", then: "response.fisher_computed is true (or explicitly false with reason); replay.py uniform path documented as legacy-only or confirmed active" } ],
      files_in_scope: ["packages/cognition-service/training/replay.py", "packages/cognition-service/training/data_buffer.py", "packages/cognition-service/main.py"],
      depends_on: [] }

