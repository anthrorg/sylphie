    title: Write test file for TK-58 acceptance criteria
    intent: "Create `packages/perception-service/tests/test_procedure_executor_syntactic.py` with the following content. Tests are pure async pytest, no markers needed (no model deps — uses InMemoryGraphPersistence and a mock matcher).\n\n```python\n\"\"\"Tests for TK-58: ProcedureExecutor syntactic step delegation.\n\nAC1: SyntacticTemplateMatcher injected -> match_root step dispatches to\n     matcher.match() and returns its result.\nAC2: matcher is None -> NotImplementedError with descriptive message;\n     non-syntactic step_types unchanged.\n\nRun::\n\n    cd packages/perception-service\n    .venv/Scripts/python.exe -m pytest tests/test_procedure_executor_syntactic.py -q\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom unittest.mock import AsyncMock, MagicMock\n\nimport pytest\n\nfrom cobeing.layer3_knowledge.in_memory_persistence import InMemoryGraphPersistence\nfrom cobeing.layer3_knowledge.node_types import (\n    KnowledgeEdge,\n    KnowledgeNode,\n    NodeStatus,\n    SchemaLevel,\n)\nfrom cobeing.layer3_knowledge.procedure_executor import ProcedureExecutor\nfrom cobeing.layer3_knowledge.procedure_types import (\n    HAS_OPERAND,\n    HAS_PROCEDURE_BODY,\n    PROCEDURAL_TEMPLATE,\n)\nfrom cobeing.shared.provenance import Provenance, ProvenanceSource\nfrom cobeing.shared.types import EdgeId, NodeId\n\n\n# ---------------------------------------------------------------------------\n# Helpers\n# ---------------------------------------------------------------------------\n\n_PROV = Provenance(\n    source=ProvenanceSource.INFERENCE,\n    source_id=\"test\",\n    confidence=1.0,\n)\n\n\ndef _node(node_id: str, node_type: str, **props) -> KnowledgeNode:\n    return KnowledgeNode(\n        node_id=NodeId(node_id),\n        node_type=node_type,\n        schema_level=SchemaLevel.SCHEMA,\n        properties=dict(props),\n        provenance=_PROV,\n        confidence=1.0,\n        status=NodeStatus.ACTIVE,\n    )\n\n\ndef _edge(edge_id: str, source: str, target: str, edge_type: str, **props) -> KnowledgeEdge:\n    return KnowledgeEdge(\n        edge_id=EdgeId(edge_id),\n        source_id=NodeId(source),\n        target_id=NodeId(target),\n        edge_type=edge_type,\n        properties=dict(props),\n        provenance=_PROV,\n        confidence=1.0,\n    )\n\n\nasync def _seed_syntactic_proc(store: InMemoryGraphPersistence, utterance: str) -> NodeId:\n    \"\"\"Seed a minimal procedure with one match_root step carrying 'utterance'.\"\"\"\n    proc_id = NodeId(\"proc:test_syntax\")\n    step_id = NodeId(\"step:root\")\n\n    proc = _node(\n        str(proc_id),\n        PROCEDURAL_TEMPLATE,\n        name=\"test_syntax\",\n        parameters=[],\n    )\n    step = _node(\n        str(step_id),\n        \"ProcedureStep\",\n        step_type=\"match_root\",\n        utterance=utterance,\n    )\n    body_edge = _edge(\n        \"edge:body\", str(proc_id), str(step_id), HAS_PROCEDURE_BODY\n    )\n    await store.save_node(proc)\n    await store.save_node(step)\n    await store.save_edge(body_edge)\n    return proc_id\n\n\n# ---------------------------------------------------------------------------\n# AC1: matcher injected -> dispatches to matcher.match(); result returned\n# ---------------------------------------------------------------------------\n\n@pytest.mark.asyncio\nasync def test_syntactic_step_dispatches_to_matcher_when_injected():\n    \"\"\"AC1: SyntacticTemplateMatcher injected; match_root step dispatches to\n    matcher.match() and the MatchResult is returned as result_value.\"\"\"\n    store = InMemoryGraphPersistence()\n    proc_id = await _seed_syntactic_proc(store, utterance=\"the cat sat\")\n\n    # Build a fake MatchResult-like object the mock will return\n    fake_match = MagicMock()\n    fake_match.template_id = \"tpl:copular\"\n    fake_match.role_bindings = {\"subject\": \"cat\"}\n\n    matcher = MagicMock()\n    matcher.match = AsyncMock(return_value=fake_match)\n\n    executor = ProcedureExecutor(graph=store, syntactic_matcher=matcher)\n\n    from cobeing.layer3_knowledge.procedure_types import ExecutionRequest\n    request = ExecutionRequest(\n        procedure_id=proc_id,\n        operands=[],\n        correlation_id=\"test-ac1\",\n        force_procedural=True,\n    )\n\n    result = await executor.execute(request)\n\n    # matcher.match must have been called with the utterance from the step node\n    matcher.match.assert_awaited_once_with(\"the cat sat\")\n    # The MatchResult is passed back as result_value\n    assert result.result_value is fake_match\n    assert result.strategy == \"procedural\"\n\n\n# ---------------------------------------------------------------------------\n# AC2: matcher is None -> NotImplementedError with descriptive message\n# ---------------------------------------------------------------------------\n\n@pytest.mark.asyncio\nasync def test_syntactic_step_raises_not_implemented_when_no_matcher():\n    \"\"\"AC2 (part A): When syntactic_matcher is None, hitting a syntactic step\n    raises NotImplementedError with a descriptive message (not a bare raise).\n    \"\"\"\n    store = InMemoryGraphPersistence()\n    proc_id = await _seed_syntactic_proc(store, utterance=\"anything\")\n\n    executor = ProcedureExecutor(graph=store)  # no matcher injected\n\n    from cobeing.layer3_knowledge.procedure_types import ExecutionRequest\n    request = ExecutionRequest(\n        procedure_id=proc_id,\n        operands=[],\n        correlation_id=\"test-ac2a\",\n        force_procedural=True,\n    )\n\n    with pytest.raises(NotImplementedError) as exc_info:\n        await executor.execute(request)\n\n    msg = str(exc_info.value)\n    assert \"SyntacticTemplateMatcher\" in msg, f\"Expected mention of SyntacticTemplateMatcher, got: {msg}\"\n    assert \"syntactic_matcher\" in msg, f\"Expected injection hint in message, got: {msg}\"\n    assert \"match_root\" in msg, f\"Expected step_type in message, got: {msg}\"\n\n\n@pytest.mark.asyncio\nasync def test_non_syntactic_steps_unchanged_when_no_matcher():\n    \"\"\"AC2 (part B): non-syntactic step_types are not affected by the matcher=None case.\n    A literal step still evaluates to its value.\"\"\"\n    store = InMemoryGraphPersistence()\n\n    proc_id = NodeId(\"proc:literal_test\")\n    step_id = NodeId(\"step:lit\")\n    proc = _node(str(proc_id), PROCEDURAL_TEMPLATE, name=\"literal_test\", parameters=[])\n    step = _node(str(step_id), \"ProcedureStep\", step_type=\"literal\", literal_value=42)\n    body_edge = _edge(\"edge:lit_body\", str(proc_id), str(step_id), HAS_PROCEDURE_BODY)\n    await store.save_node(proc)\n    await store.save_node(step)\n    await store.save_edge(body_edge)\n\n    executor = ProcedureExecutor(graph=store)  # no matcher\n\n    from cobeing.layer3_knowledge.procedure_types import ExecutionRequest\n    request = ExecutionRequest(\n        procedure_id=proc_id,\n        operands=[],\n        correlation_id=\"test-ac2b\",\n        force_procedural=True,\n    )\n\n    result = await executor.execute(request)\n    assert result.result_value == 42\n```\n\nNote: `pytest-asyncio` must be available (it is already used in other test files). If `asyncio_mode = \"auto\"` is not set in pyproject.toml, the `@pytest.mark.asyncio` decorator covers the async tests explicitly."
    files_in_scope:
