    title: Add two-person cross-grounding describe block to candidate-grounding-exclusion.spec.ts
    intent: "Append a new top-level `describe` block titled `'TK-81 — two-person cross-person isolation (§2.8 seal)'` at the END of `packages/decision-making/src/wkg/candidate-grounding-exclusion.spec.ts` (after line 399, within the same file). The block contains TWO `it` cases:\n\n```typescript\ndescribe('TK-81 — two-person cross-person isolation (§2.8 seal)', () => {\n  /**\n   * The exact §2.8 leak shape in a two-person corpus:\n   * Person A's spoken proper noun is staged as a :Candidate scoped to A.\n   * Person B issues a TYPE_2 question whose grounding would match that noun.\n   * Every grounding read-path must exclude the :Candidate so B's reply\n   * is NOT GROUNDED off A's staged fact.\n   */\n  it('Person A mints :Candidate for \"Max\" (grounding_person_id=A); Person B query getContextForFrame returns zero grounding entities', async () => {\n    const graph = new FakeWorldGraph();\n    // Person A's turn mints a :Candidate for 'Max' scoped to A.\n    graph.addNode({\n      node_id: 'cand-max-a',\n      label: 'Max',\n      labels: [CANDIDATE_NODE_LABEL],\n      confidence: 0.5,\n      provenance_type: 'CANDIDATE',\n      props: { grounding_person_id: 'user-A' },\n    });\n    // No promoted :Entity exists — 'Max' has never been guardian-confirmed.\n    const svc = makeService(graph);\n\n    // Person B now asks about 'Max' — simulates a TYPE_2 grounding read.\n    const ctx = await svc.getContextForFrame(frameMentioning('Who is Max?'));\n\n    // The four exclusion gates (wkg-context.service.ts:1075, 1099, 286, 330) must fire:\n    // matchEntities (fulltext :1075, CONTAINS :1099) is the first gate;\n    // getSubgraph (:286) and getEntityFacts (:330) are downstream.\n    // Net result: B sees zero grounding entities — A's :Candidate is invisible.\n    expect(ctx.entities).toHaveLength(0);\n    expect(\n      ctx.entities.find((e) => e.nodeId === 'cand-max-a'),\n    ).toBeUndefined();\n  });\n\n  it('Person A has :Candidate for \"Max\"; a promoted :Entity \"Max\" (from a DIFFERENT person/guardian) IS returned to Person B — isolation is candidate-scoped, not label-scoped', async () => {\n    const graph = new FakeWorldGraph();\n    graph.addNode({\n      node_id: 'cand-max-a',\n      label: 'Max',\n      labels: [CANDIDATE_NODE_LABEL],\n      confidence: 0.5,\n      provenance_type: 'CANDIDATE',\n      props: { grounding_person_id: 'user-A' },\n    });\n    // Guardian promoted a :Entity for the same label (now groundable).\n    graph.addNode({\n      node_id: 'entity-max-promoted',\n      label: 'Max',\n      labels: ['Entity'],\n      confidence: 0.9,\n      provenance_type: 'GUARDIAN_APPROVED_INFERENCE',\n    });\n    const svc = makeService(graph);\n\n    const ctx = await svc.getContextForFrame(frameMentioning('Who is Max?'));\n\n    // Only the :Entity surfaces — the :Candidate is still excluded.\n    const ids = ctx.entities.map((e) => e.nodeId);\n    expect(ids).toContain('entity-max-promoted');\n    expect(ids).not.toContain('cand-max-a');\n  });\n});\n```\n\nThese two tests directly assert the four exclusion lines in `wkg-context.service.ts` (fulltext NOT node:Candidate at :1075, CONTAINS NOT n:Candidate at :1099, subgraph NOT node:Candidate at :286, and getEntityFacts NOT n:Candidate / NOT m:Candidate at :330) in a two-person corpus scenario."
    files_in_scope:
    - packages/decision-making/src/wkg/candidate-grounding-exclusion.spec.ts
