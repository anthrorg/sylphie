    intent: "In `packages/learning/src/pipeline/conversation-reflection.service.ts` at line 708, change `function buildReflectionPrompt(` to `export function buildReflectionPrompt(`. Then, immediately above it (insert before line 708 after the closing brace of `describeDuration`), add the pure helper:\n\n```typescript\n/**\n * Select up to `count` indices evenly spread across the half-open range [start, end).\n * Returns a sorted array of unique indices.\n */\nfunction sampleEvenly(start: number, end: number, count: number): number[] {\n  const len = end - start;\n  if (len <= 0 || count <= 0) return [];\n  if (count >= len) return Array.from({ length: len }, (_, i) => start + i);\n  const step = len / count;\n  return Array.from({ length: count }, (_, i) => start + Math.floor(i * step + step / 2));\n}\n```\n\nNo other changes to this file in this task."
