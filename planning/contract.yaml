ing;\n  latentProvenance = null;\n}\n```\n\nSITE 4 (procedure path, ~:1384-1408): Replace:\n```\n} else {\n  // TRANSITIONAL FALLBACK ... comments ...\n  const legacy = applyOkgRecallGrounding(...);\n  procedureGrounding = legacy.grounding;\n  procedureProvenance = legacy.provenance;\n  procedureGroundedBy = discriminateGroundedBy(procedureGrounding, { entities:[], facts:[], relationships:[], procedures:[], summary:'' }, procedureResponseText, procedurePersonModel?.knownFacts, procedureProvenance);\n}\n```\nWith:\n```\n} else {\n  procedureGrounding = baseGrounding;\n  procedureProvenance = null;\n  procedureGroundedBy = discriminateGroundedBy(procedureGrounding, { entities:[], facts:[], relationships:[], procedures:[], summary:'' }, procedureResponseText, procedurePersonModel?.knownFacts, null);\n}\n```\n\nAlso update the import at decision-making.service.ts:71 — remove `applyOkgRecallGrounding` from the named imports: change `import { DeliberationService, type DeliberationResult, inferGrounding, isIgnoranceResponse, applyOkgRecallGrounding, discriminateGroundedBy }` to `import { DeliberationService, type DeliberationResult, inferGrounding, isIgnoranceResponse, discriminateGroundedBy }`.\n\nRemove the now-dead comment blocks at each site that referred to 'TRANSITIONAL FALLBACK (WS3 T1)' and 'applyOkgRecallGrounding' as a transitional fallback."
