    title: Add candidate-to-candidate edge test to candidate-grounding-exclusion.spec.ts
    intent: "Inside the same `'TK-81 — two-person cross-person isolation (§2.8 seal)'` describe block added in Task 2 (append after the second `it` but still inside the block, before the closing `});`), add a THIRD `it` case covering AC3 — a RELATED_TO/OWNS/KNOWS edge whose BOTH endpoints are `:Candidate`:\n\n```typescript\n  it('RELATED_TO edge with both :Candidate endpoints: neither endpoint becomes groundable via getRelationships or getSubgraph', async () => {\n    const graph = new FakeWorldGraph();\n    graph.addNode({\n      node_id: 'cand-max-a',\n      label: 'Max',\n      labels: [CANDIDATE_NODE_LABEL],\n      confidence: 0.5,\n      provenance_type: 'CANDIDATE',\n      props: { grounding_person_id: 'user-A' },\n    });\n    graph.addNode({\n      node_id: 'cand-spot-a',\n      label: 'Spot',\n      labels: [CANDIDATE_NODE_LABEL],\n      confidence: 0.4,\n      provenance_type: 'CANDIDATE',\n      props: { grounding_person_id: 'user-A' },\n    });\n    // A RELATED_TO edge exists between the two candidates (extract-edges / refine-edges can produce this).\n    graph.addRel('cand-max-a', 'RELATED_TO', 'cand-spot-a');\n    const svc = makeService(graph);\n\n    // getRelationships: label-agnostic MATCH binds the edge but C0 exclusions\n    // (wkg-context.service.ts:1129 AND NOT a:Candidate AND NOT b:Candidate) drop both.\n    const rels = await (svc as unknown as {\n      getRelationships(session: unknown, ids: string[]): Promise<unknown[]>;\n    }).getRelationships(graph.getSession(Neo4jInstanceName.WORLD, 'READ'), [\n      'cand-max-a',\n      'cand-spot-a',\n    ]);\n    expect(rels).toHaveLength(0);\n\n    // getSubgraph: traversal reaches the neighbour but NOT node:Candidate at :286 drops it.\n    const { entities } = await svc.getSubgraph(['cand-max-a'], 1);\n    const ids = entities.map((e: { nodeId: string }) => e.nodeId);\n    expect(ids).not.toContain('cand-max-a');\n    expect(ids).not.toContain('cand-spot-a');\n  });\n```\n\nThis closes the AC3 gap: the label-agnostic MATCH binds the edge, but the C0 exclusion clauses at `wkg-context.service.ts:1129` (getRelationships) and `:286` (getSubgraph WHERE NOT node:Candidate) suppress both candidate endpoints. The FakeWorldGraph.getSession interpretation already handles these (`getRelationships` filter at lines 165-189 of the spec, `getSubgraph` filter at lines 192-206)."
