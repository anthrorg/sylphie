    title: Write pytest tests for demotion (AC1 + AC2)
    intent: "Create new file packages/cognition-service/inference/test_bootstrap_demotion.py with the following content:\n\n\"\"\"Tests for BootstrapTracker category demotion (TK-40).\n\nAC1: a graduated category whose agreement drops below 0.70 is removed from\n     graduated set, a WARNING is logged, and should_use_tensor returns False.\nAC2: a category sitting between 0.70 and 0.85 (inclusive at 0.70, exclusive at\n     0.85) is NOT demoted.\n\"\"\"\nfrom __future__ import annotations\n\nimport logging\n\nimport pytest\n\nfrom inference.bootstrap import BootstrapTracker\n\n\ndef _graduate(tracker: BootstrapTracker, category: str, agree_n: int = 20) -> None:\n    \"\"\"Force a category into _graduated_categories by feeding agree_n=True entries.\"\"\"\n    for _ in range(agree_n):\n        tracker.record_comparison(category, category)  # 100% agreement\n    tracker.check_graduations()\n    assert category in tracker._graduated_categories, \"Precondition: category must be graduated\"\n\n\ndef test_demotion_below_threshold_removes_and_warns(caplog):\n    \"\"\"AC1: agreement < 0.70 demotes the category and logs a WARNING.\"\"\"\n    tracker = BootstrapTracker(initial_mode=\"partial\")\n    _graduate(tracker, \"conversationalresponse\", agree_n=20)\n\n    # Flood with 30 disagreements on top of the 20 agreements → agreement ≈ 20/50 = 0.40\n    for _ in range(30):\n        tracker.record_comparison(\"somethingelse\", \"conversationalresponse\")\n\n    with caplog.at_level(logging.WARNING, logger=\"cognition_service.bootstrap\"):\n        demoted = tracker.check_demotions()\n\n    assert \"conversationalresponse\" in demoted\n    assert \"conversationalresponse\" not in tracker._graduated_categories\n    assert tracker.should_use_tensor(\"conversationalresponse\") is False\n    assert any(\"demoted\" in rec.message.lower() for rec in caplog.records)\n\n\ndef test_demotion_not_triggered_in_safe_band(caplog):\n    \"\"\"AC2: agreement in [0.70, 0.85) does NOT demote the category.\"\"\"\n    tracker = BootstrapTracker(initial_mode=\"partial\")\n    _graduate(tracker, \"conversationalresponse\", agree_n=20)\n\n    # Add 10 disagreements on top of 20 agreements → agreement = 20/30 ≈ 0.667 ... reset first\n    # Build a fresh window: 21 agrees + 9 disagrees = 30 samples, agreement = 21/30 = 0.70 exactly\n    tracker._category_history[\"conversationalresponse\"] = [True] * 21 + [False] * 9  # 0.70\n\n    with caplog.at_level(logging.WARNING, logger=\"cognition_service.bootstrap\"):\n        demoted = tracker.check_demotions()\n\n    assert \"conversationalresponse\" not in demoted\n    assert \"conversationalresponse\" in tracker._graduated_categories\n    assert tracker.should_use_tensor(\"conversationalresponse\") is True"
