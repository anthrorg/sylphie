    title: 'Write the main() test body: session-1 → NestJS kill → session-2 → assertions'
    intent: "Fill in `main()` in `test/e2e/vision/accept-B.e2e.ts`. Exact sequence:\n\n```\nasync function main(): Promise<void> {\n  console.log('=== ACC.B — durable cross-session re-bind ===');\n  const MUG = path.join(REPO_ROOT, 'test/fixtures/vision/mug_640x480.jpg');\n  if (!fs.existsSync(MUG)) { record('fixture-exists', false, `${MUG} not found — run TK-30 first`); process.exit(1); }\n\n  // --- Pre-flight: POST /api/metrics/perception-reset (clear any residue from prior runs)\n  // Drive-server: spawn same pattern as ws5-t4-smoke.ts but only if needed (or note it's already up).\n  // For ACC.B, the drive-server and NestJS ARE spawned by this script.\n\n  let backend: ChildProcess | null = null;\n  try {\n    // Spawn backend session 1\n    backend = spawnBackend({});\n    record('s1:backend-up', await waitForBackend(), 'session-1 backend reachable');\n\n    // Clear residue\n    await fetchJson('/api/metrics/perception-reset', { method: 'POST' });\n\n    // Inject mug frames until VWM stabilises to 'present'\n    const s1Injected = await injectFramesUntilPresent(MUG, 40);\n    record('s1:frames-injected', s1Injected, `injected up to 40 frames to confirm mug track`);\n\n    // Allow VWM resolveEntityIdentity (async fire-and-forget) to settle\n    await sleep(4000);\n\n    // Read the Timescale row created by session 1\n    const s1Row = await pollForNodeCreated('cup', 20_000);\n    record('s1:node-created', !!s1Row, s1Row ? `node_id=${s1Row.node_id} sighting_count=${s1Row.sighting_count}` : 'no row found in visual_object_embeddings');\n    if (!s1Row) { return; }\n    const capturedNodeId = s1Row.node_id;\n    const s1EmbText = s1Row.embedding;\n\n    // Kill NestJS (DBs stay up)\n    killProcess(backend);\n    backend = null;\n    await sleep(3000); // wait for port to release\n    record('s1:nestjs-killed', true, 'NestJS killed; DBs still running');\n\n    // Spawn backend session 2 (fresh process, no in-memory VWM state)\n    backend = spawnBackend({});\n    record('s2:backend-up', await waitForBackend(), 'session-2 backend reachable (fresh boot)');\n\n    // Do NOT call perception-reset here — we want VWM to start fresh in-process\n    // but the DB rows from session 1 must survive (DBs were never touched).\n\n    // Inject mug frames again — VWM should re-bind via BindingService\n    const s2Injected = await injectFramesUntilPresent(MUG, 40);\n    record('s2:frames-injected', s2Injected, 'injected frames in session 2');\n    await sleep(4000); // let resolveEntityIdentity settle\n\n    // --- AC 1: same node_id, sighting_count>=2, no duplicate\n    const s2Count = await countNodesForLabel('cup');\n    record('ac1:no-duplicate-node', s2Count === 1, `visual_object_embeddings has ${s2Count} cup row(s) (expect 1)`);\n\n    const s2Row = await pollForNodeCreated('cup', 10_000);\n    const nodeIdMatches = s2Row?.node_id === capturedNodeId;\n    record('ac1:same-node-id', nodeIdMatches, `session-2 node_id=${s2Row?.node_id} (expected=${capturedNodeId})`);\n    const s2SightingCount = s2Row ? Number(s2Row.sighting_count) : 0;\n    record('ac1:sighting-count-gte-2', s2SightingCount >= 2, `sighting_count=${s2SightingCount} (expect >=2)`);\n\n    // --- AC 2: centroid drift > 0\n    const s1Emb = s1EmbText ? JSON.parse(s1EmbText) as number[] : null;\n    const s2Emb = s2Row?.embedding ? JSON.parse(s2Row.embedding) as number[] : null;\n    const drifted = s1Emb && s2Emb && s1Emb.length === s2Emb.length &&\n      s1Emb.some((v, i) => Math.abs(v - s2Emb[i]) > 1e-7);\n    record('ac2:centroid-drift', !!drifted, drifted ? 'centroid moved from session-1 value' : `no drift (s1Emb=${!!s1Emb} s2Emb=${!!s2Emb})`);\n\n    // --- AC 2: bounding_box non-null parseable JSON\n    let bboxOk = false;\n    try {\n      const bb = s2Row?.bounding_box ? JSON.parse(s2Row.bounding_box) : null;\n      bboxOk = Array.isArray(bb) && bb.length === 4 && bb.every((v: unknown) => typeof v === 'number');\n    } catch { /* noop */ }\n    record('ac2:bounding-box', bboxOk, `bounding_box=${s2Row?.bounding_box?.slice(0,80)}`);\n\n    // --- AC 2: KG-isolation (zero cross-instance edges)\n    const neo = await probeNeo4j(capturedNodeId);\n    record('ac2:neo4j-node-found', neo.found, `WORLD :VisualObject {node_id:${capturedNodeId}} found=${neo.found}`);\n    record('ac2:neo4j-sighting-count', neo.sightingCount >= 2, `Neo4j sighting_count=${neo.sightingCount}`);\n    record('ac2:kg-isolation', neo.crossInstanceEdges === 0, `cross-instance edges=${neo.crossInstanceEdges} (must be 0)`);\n\n  } catch (err) {\n    record('smoke-exception', false, `threw: ${err instanceof Error ? err.stack ?? err.message : String(err)}`);\n  } finally {\n    if (backend) killProcess(backend);\n  }\n\n  console.log('\\n=== ACC.B scorecard ===');\n  for (const r of results) console.log(`  ${r.pass ? 'PASS' : 'FAIL'}  ${r.name} — ${r.detail}`);\n  console.log(exitCode === 0 ? '\\nALL GREEN — ACC.B passed.' : '\\nFAILURES present.');\n  await sleep(1000);\n  process.exit(exitCode);\n}\n\nvoid main();\n```\n\nNote: `mug_640x480.jpg`'s YOLO label is 'cup' (COCO class) not 'mug' — the VWM label field holds the YOLO class string. The synthetic mug drawn by TK-30's `synth_frames.py` (a labeled rectangle labeled 'cup') should yield a confirmed cup track."
    files_in_scope:
    - test/e2e/vision/accept-B.e2e.ts
