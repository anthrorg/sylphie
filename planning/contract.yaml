    title: Add _frozen_panels set + update freeze/unfreeze signatures in Trainer
    intent: "packages/cognition-service/training/trainer.py — In Trainer.__init__ (:490), immediately after `self._training_frozen: bool = False` add:\n\n        # Per-panel frozen set. Entries are panel names as registered on PanelModels\n        # (\"drive\", \"decision\", \"learning\", \"planning\"). The global flag\n        # _training_frozen is only set when model_name=\"all\".\n        self._frozen_panels: set[str] = set()\n\nThen replace freeze() (:588-596) with:\n\n    def freeze(self, model_name: str = \"all\") -> bool:\n        \"\"\"Freeze weight updates for a model or all models.\n\n        Args:\n            model_name: \"all\" to freeze the whole training loop; or a panel\n                        name (\"drive\", \"decision\", \"learning\", \"planning\") to\n                        record that panel as frozen. Returns True when accepted,\n                        False when model_name is unrecognised.\n        \"\"\"\n        if model_name == \"all\":\n            self._training_frozen = True\n            logger.info(\"Trainer frozen — all weight updates suspended\")\n            return True\n        if model_name in _VALID_PANEL_NAMES:\n            self._frozen_panels.add(model_name)\n            logger.info(\"Panel '%s' frozen\", model_name)\n            return True\n        logger.warning(\"freeze: unknown model_name '%s'\", model_name)\n        return False\n\nAnd replace unfreeze() (:598-601) with:\n\n    def unfreeze(self, model_name: str = \"all\") -> bool:\n        \"\"\"Resume weight updates. Returns True when accepted.\"\"\"\n        if model_name == \"all\":\n            self._training_frozen = False\n            self._frozen_panels.clear()\n            logger.info(\"Trainer unfrozen — all weight updates resumed\")\n            return True\n        if model_name in _VALID_PANEL_NAMES:\n            self._frozen_panels.discard(model_name)\n            logger.info(\"Panel '%s' unfrozen\", model_name)\n            return True\n        logger.warning(\"unfreeze: unknown model_name '%s'\", model_name)\n        return False\n\nAlso add the constant at module level, immediately above the Trainer class definition (:442):\n\n# Panel names as registered on PanelModels.panels (order: drive, decision, learning, planning).\n# panel_N in the HTTP API maps to this list by index: panel_0 -> \"drive\", etc.\n_VALID_PANEL_NAMES: frozenset[str] = frozenset({\"drive\", \"decision\", \"learning\", \"planning\"})\n_PANEL_INDEX_TO_NAME: list[str] = [\"drive\", \"decision\", \"learning\", \"planning\"]\n\nUpdate is_frozen property (:561-563) to also expose frozen_panels:\n\n    @property\n    def is_frozen(self) -> bool:\n        \"\"\"True when the global supervisor freeze is active.\"\"\"\n        return self._training_frozen\n\n    @property\n    def frozen_panels(self) -> frozenset[str]:\n        \"\"\"The set of individually-frozen panel names.\"\"\"\n        return frozenset(self._frozen_panels)"
