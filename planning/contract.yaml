    intent: "In `packages/drive-engine/src/constants/rules.spec.ts`, append three new `describe` blocks after the existing `describe('rules — ScenePrediction relief invariant', ...)` block (after line 87).\n\n**Block 1** — membership:\n```typescript\ndescribe('rules — InboundHostility METADATA_SCALED_ACTION_TYPES membership', () => {\n  it(\"'InboundHostility' is a metadata-scaled action type\", () => {\n    expect(METADATA_SCALED_ACTION_TYPES.has('InboundHostility')).toBe(true);\n  });\n});\n```\n\n**Block 2** — magnitude scaling (mirror of ScenePrediction cases):\nAdd a helper `function inboundHostility(hostilityMagnitude: number): ActionOutcomePayload` (mirror of the `scenePrediction` helper at line 28, but with `actionType: 'InboundHostility'` and `metadata: { hostilityMagnitude }`). Then:\n```typescript\ndescribe('rules — InboundHostility metadata scaling', () => {\n  // Goldens pinned by running the real computeDefaultAffect:\n  //   m=0   -> { anxiety: 0,    social: 0    }\n  //   m=0.5 -> { anxiety: 0.02, social: 0.01 }\n  //   m=1.0 -> { anxiety: 0.04, social: 0.02 }\n  const cases: ReadonlyArray<readonly [number, number, number]> = [\n    [0,   0,    0   ],\n    [0.5, 0.02, 0.01],\n    [1.0, 0.04, 0.02],\n  ];\n  it.each(cases)('scales Anxiety=0.04*m and Social=0.02*m for hostilityMagnitude=%p',\n    (m, expectedAnxiety, expectedSocial) => {\n      const effects = computeDefaultAffect(inboundHostility(m));\n      expect(effects[DriveName.Anxiety]).toBe(expectedAnxiety);\n      expect(effects[DriveName.Social]).toBe(expectedSocial);\n      expect(new Set(Object.keys(effects))).toEqual(new Set([DriveName.Anxiety, DriveName.Social]));\n    });\n});\n```\n\n**Block 3** — relief invariant (AC-2: 'NO relief (negative) delta on any axis'):\n```typescript\ndescribe('rules — InboundHostility relief invariant', () => {\n  it.each([0, 0.25, 0.5, 0.75, 1.0])(\n    'never produces a relief (negative) delta on any axis at hostilityMagnitude=%p',\n    (m) => {\n      const effects = computeDefaultAffect(inboundHostility(m));\n      for (const delta of Object.values(effects)) {\n        expect(delta as number).toBeGreaterThanOrEqual(0);\n      }\n    });\n});\n```\n\nUpdate the import at line 21 to ensure `METADATA_SCALED_ACTION_TYPES` is imported if not already (it IS imported at line 21 from the existing spec). The golden values in Block 2 must match the constants chosen in TASK-3 (Anxiety base 0.04, Social base 0.02). If TASK-1 POC caused those constants to change, update the goldens here to match."
