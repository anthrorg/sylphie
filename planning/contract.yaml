    title: Add nudgeWeightsOnOutcome method to DeliberationService
    intent: "In packages/decision-making/src/deliberation/deliberation.service.ts, add a public method `nudgeWeightsOnOutcome` to the `DeliberationService` class, placed after the private `fallbackResult` method (after line ~918). This is the EMA updater:\n\n```\n/**\n * Nudge adaptive scoring weights toward the outcome of a reinforced selection.\n *\n * Called by the executor when a deliberation result is positively reinforced\n * (the response was used and the outcome was good). The correlated weight is\n * nudged by EMA (alpha=0.05) toward a value 10% above its current setting,\n * the full vector is then L1-normalised (for non-penalty weights only), and\n * all weights are clamped to WEIGHT_FLOOR. Weights are logged but never\n * persisted — they reset to DEFAULT_SCORING_WEIGHTS on restart.\n *\n * Guard: no update fires if totalScoredSelections < EMA_MIN_SELECTIONS.\n *\n * CANON Std-6: this modifies deliberation heuristics only; the drive\n * evaluation function is never touched (see determination comment above\n * scoreCandidates).\n *\n * @param correlatedFactor - The factor key from scored.scores[bestIndex].factors\n *   that most influenced the winning candidate (e.g. 'grounded', 'assisted').\n *   Pass null to skip the nudge (caller may not know the correlated factor).\n * @param driveSnapshotSessionId - Session id for log correlation.\n */\nnudgeWeightsOnOutcome(\n  correlatedFactor: keyof ScoringWeights | null,\n  driveSnapshotSessionId: string,\n): void {\n  if (this.totalScoredSelections < EMA_MIN_SELECTIONS) {\n    vlog('EMA weight nudge skipped: below floor', {\n      totalScoredSelections: this.totalScoredSelections,\n      floor: EMA_MIN_SELECTIONS,\n    });\n    return;\n  }\n  if (!correlatedFactor) return;\n\n  const old = this.scoringWeights[correlatedFactor];\n  const target = old * 1.1; // nudge 10% above current\n  const updated = old + EMA_ALPHA * (target - old);\n  const clamped = Math.max(WEIGHT_FLOOR, updated);\n  this.scoringWeights = { ...this.scoringWeights, [correlatedFactor]: clamped };\n\n  // L1-normalise the positive (bonus) weights so the sum stays bounded.\n  const bonusKeys: (keyof ScoringWeights)[] = ['grounded', 'assisted', 'unknownConv', 'unknownFactual', 'entityBonus'];\n  const sum = bonusKeys.reduce((s, k) => s + this.scoringWeights[k], 0);\n  if (sum > 0) {\n    const scale = (DEFAULT_SCORING_WEIGHTS.grounded + DEFAULT_SCORING_WEIGHTS.assisted +\n      DEFAULT_SCORING_WEIGHTS.unknownConv + DEFAULT_SCORING_WEIGHTS.unknownFactual +\n      DEFAULT_SCORING_WEIGHTS.entityBonus) / sum;\n    const normalised = { ...this.scoringWeights };\n    for (const k of bonusKeys) {\n      normalised[k] = Math.max(WEIGHT_FLOOR, this.scoringWeights[k] * scale);\n    }\n    this.scoringWeights = normalised;\n  }\n\n  this.logger.debug(\n    `[EMA] weight nudge: factor=${correlatedFactor} ${old.toFixed(4)}→${this.scoringWeights[correlatedFactor].toFixed(4)} ` +\n    `session=${driveSnapshotSessionId} totalSelections=${this.totalScoredSelections}`,\n  );\n  vlog('EMA weight nudge applied', {\n    factor: correlatedFactor,\n    before: +old.toFixed(4),\n    after: +this.scoringWeights[correlatedFactor].toFixed(4),\n    alpha: EMA_ALPHA,\n    totalScoredSelections: this.totalScoredSelections,\n  });\n}\n```"
    files_in_scope:
    - packages/decision-making/src/deliberation/deliberation.service.ts
