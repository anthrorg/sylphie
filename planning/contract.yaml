enanceSource.GUARDIAN,\n           source_id=session_id,\n           confidence=1.0,\n       ),\n       confidence=1.0,\n       status=NodeStatus.ACTIVE,\n   )\n   ```\n\nUpdate the docstring at line 218-229: replace \"placeholder sense_tag of 'noun_1' (the most common default)\" with \"a heuristic sense_tag: 'verb_1' for '-ing' forms, 'adv_1' for '-ly' forms, 'unknown_1' otherwise. An explicit ``sense_tag`` argument overrides the heuristic.\""
