    title: Write unit tests for depth-4 and depth-5 advancement predicates
    intent: "Create a new file `packages/perception-service/tests/test_inference_depth_advancement.py` with pure-Python unit tests (no Neo4j, no live network) that cover the two acceptance criteria:\n\n```python\n\"\"\"Unit tests for inference_query depth-4/5 advancement predicates (TK-60).\n\nAll tests mock _compute_inference_success_rate, _count_confirmed_inferences,\nand _update_depth_rule so no Neo4j session is required.\n\"\"\"\nfrom __future__ import annotations\n\nimport pytest\nfrom unittest.mock import AsyncMock, MagicMock, patch\n\nfrom cobeing.layer3_knowledge.inference_query import (\n    DEFAULT_DEPTH4_MIN_CONFIRMED,\n    DEFAULT_DEPTH4_SUCCESS_RATE,\n    DEFAULT_DEPTH5_MIN_CONFIRMED,\n    DEFAULT_DEPTH5_SUCCESS_RATE,\n    DEFAULT_INFERENCE_ARCHITECTURAL_MAX,\n    _check_depth_advancement,\n)\nfrom cobeing.layer3_knowledge.node_types import KnowledgeNode, NodeStatus, SchemaLevel\nfrom cobeing.layer3_knowledge.in_memory_persistence import InMemoryGraphPersistence\nfrom cobeing.shared.provenance import Provenance, ProvenanceSource\nfrom cobeing.shared.types import NodeId\n\n\ndef _make_depth_rule_node(current_max_depth: int, e5_met: bool) -> KnowledgeNode:\n    return KnowledgeNode(\n        node_id=NodeId(\"rule:inference_depth_config\"),\n        node_type=\"EvolutionRule\",\n        schema_level=SchemaLevel.META_SCHEMA,\n        properties={\n            \"current_max_depth\": current_max_depth,\n            \"e5_prerequisite_met\": e5_met,\n        },\n        provenance=Provenance(\n            source=ProvenanceSource.INFERENCE,\n            source_id=\"test\",\n            confidence=1.0,\n        ),\n        confidence=1.0,\n        status=NodeStatus.ACTIVE,\n    )\n\n\n# ---------------------------------------------------------------------------\n# AC1: depth 3, E5 met, depth-4 criteria met -> advance to 4\n# ---------------------------------------------------------------------------\n\n@pytest.mark.asyncio\nasync def test_depth3_e5_met_criteria_met_advances_to_4():\n    \"\"\"Given depth=3 and E5 met and depth-4 success+confirmed thresholds passed,\n    advancement returns 4.\"\"\"\n    persistence = InMemoryGraphPersistence()\n    rule_node = _make_depth_rule_node(current_max_depth=3, e5_met=True)\n    fake_session = MagicMock()\n\n    with (\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._compute_inference_success_rate\",\n            return_value=DEFAULT_DEPTH4_SUCCESS_RATE,  # exactly at threshold\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._count_confirmed_inferences\",\n            return_value=DEFAULT_DEPTH4_MIN_CONFIRMED,  # exactly at threshold\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._update_depth_rule\",\n            new_callable=AsyncMock,\n        ) as mock_update,\n    ):\n        result = await _check_depth_advancement(\n            persistence=persistence,\n            neo4j_session=fake_session,\n            current_depth=3,\n            e5_prerequisite_met=True,\n            depth_rule_node=rule_node,\n        )\n\n    assert result == 4, f\"expected 4, got {result}\"\n    mock_update.assert_awaited_once()\n\n\n@pytest.mark.asyncio\nasync def test_depth3_e5_not_met_stays_at_3():\n    \"\"\"Given depth=3 and E5 NOT met, stays at 3 regardless of metrics.\"\"\"\n    persistence = InMemoryGraphPersistence()\n    rule_node = _make_depth_rule_node(current_max_depth=3, e5_met=False)\n    fake_session = MagicMock()\n\n    with patch(\n        \"cobeing.layer3_knowledge.inference_query._update_depth_rule\",\n        new_callable=AsyncMock,\n    ) as mock_update:\n        result = await _check_depth_advancement(\n            persistence=persistence,\n            neo4j_session=fake_session,\n            current_depth=3,\n            e5_prerequisite_met=False,\n            depth_rule_node=rule_node,\n        )\n\n    assert result == 3, f\"expected 3 (E5 not met), got {result}\"\n    mock_update.assert_not_awaited()\n\n\n@pytest.mark.asyncio\nasync def test_depth3_e5_met_criteria_not_met_stays_at_3():\n    \"\"\"Given depth=3, E5 met, but success rate below threshold: stays at 3.\"\"\"\n    persistence = InMemoryGraphPersistence()\n    rule_node = _make_depth_rule_node(current_max_depth=3, e5_met=True)\n    fake_session = MagicMock()\n\n    with (\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._compute_inference_success_rate\",\n            return_value=DEFAULT_DEPTH4_SUCCESS_RATE - 0.01,  # just below threshold\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._count_confirmed_inferences\",\n            return_value=DEFAULT_DEPTH4_MIN_CONFIRMED,\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._update_depth_rule\",\n            new_callable=AsyncMock,\n        ) as mock_update,\n    ):\n        result = await _check_depth_advancement(\n            persistence=persistence,\n            neo4j_session=fake_session,\n            current_depth=3,\n            e5_prerequisite_met=True,\n            depth_rule_node=rule_node,\n        )\n\n    assert result == 3, f\"expected 3 (criteria not met), got {result}\"\n    mock_update.assert_not_awaited()\n\n\n# ---------------------------------------------------------------------------\n# AC2: depth 4, depth-5 criteria met -> advance to 5\n# ---------------------------------------------------------------------------\n\n@pytest.mark.asyncio\nasync def test_depth4_criteria_met_advances_to_5():\n    \"\"\"Given depth=4 and depth-5 thresholds met, advancement returns 5.\"\"\"\n    persistence = InMemoryGraphPersistence()\n    rule_node = _make_depth_rule_node(current_max_depth=4, e5_met=True)\n    fake_session = MagicMock()\n\n    with (\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._compute_inference_success_rate\",\n            return_value=DEFAULT_DEPTH5_SUCCESS_RATE,\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._count_confirmed_inferences\",\n            return_value=DEFAULT_DEPTH5_MIN_CONFIRMED,\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._update_depth_rule\",\n            new_callable=AsyncMock,\n        ) as mock_update,\n    ):\n        result = await _check_depth_advancement(\n            persistence=persistence,\n            neo4j_session=fake_session,\n            current_depth=4,\n            e5_prerequisite_met=True,\n            depth_rule_node=rule_node,\n        )\n\n    assert result == 5, f\"expected 5, got {result}\"\n    mock_update.assert_awaited_once()\n\n\n@pytest.mark.asyncio\nasync def test_depth4_criteria_not_met_stays_at_4():\n    \"\"\"Given depth=4 but confirmed count below threshold: stays at 4.\"\"\"\n    persistence = InMemoryGraphPersistence()\n    rule_node = _make_depth_rule_node(current_max_depth=4, e5_met=True)\n    fake_session = MagicMock()\n\n    with (\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._compute_inference_success_rate\",\n            return_value=DEFAULT_DEPTH5_SUCCESS_RATE,\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._count_confirmed_inferences\",\n            return_value=DEFAULT_DEPTH5_MIN_CONFIRMED - 1,  # one short\n        ),\n        patch(\n            \"cobeing.layer3_knowledge.inference_query._update_depth_rule\",\n            new_callable=AsyncMock,\n        ) as mock_update,\n    ):\n        result = await _check_depth_advancement(\n            persistence=persistence,\n            neo4j_session=fake_session,\n            current_depth=4,\n            e5_prerequisite_met=True,\n            depth_rule_node=rule_node,\n        )\n\n    assert result == 4, f\"expected 4 (confirmed short), got {result}\"\n    mock_update.assert_not_awaited()\n```\n\nRun with: `cd packages/perception-service && python -m pytest tests/test_inference_depth_advancement.py -v`\n\nExpected: all 5 tests GREEN."
