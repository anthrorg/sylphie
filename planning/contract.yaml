  expect(objs).toContain('observed_outcome'); // the second hardcoded triple's literal object\n  });\n\n  it('AC2: LLM response with zero parseable triples => heuristic fallback (no exception)', async () => {\n    const badLlm = { ...llmStub, complete: async () => ({ content: 'ENTITIES: a, b\\n(no relationships)', tokensUsed: { prompt: 1, completion: 1 }, latencyMs: 1, model: 'm', cost: 0 }) };\n    const svc = new ConsolidationService(episodicMemoryStub, null, badLlm as any);\n    const result = await svc.consolidate({ episode: makeEpisode(), ageHours: 3, estimatedConfidence: 0.8 } as any);\n    expect(result.success).toBe(true);\n    expect(result.conversionsCreated).toBeGreaterThanOrEqual(2); // two heuristic triples\n  });\n});\n```\n\nThen run `yarn workspace @sylphie/decision-making test --testPathPattern=\"consolidation.llm-extraction\"` and confirm the new relationship blocks pass green alongside the TK-87 blocks."
