    title: Write mae-history-store.spec.ts covering both acceptance criteria
    intent: "Create new file `packages/decision-making/src/confidence/mae-history-store.spec.ts`. Full content:\n\n```typescript\n/**\n * Unit tests for MaeHistoryStore — TK-68 acceptance criteria.\n *\n * AC-1: A single shared window — append via one consumer; all read the same value.\n * AC-2: FIFO eviction — 11th entry evicts the oldest (MAX_MAE_WINDOW=10).\n */\n\nimport { MaeHistoryStore, MAX_MAE_WINDOW } from './mae-history-store';\n\ndescribe('MaeHistoryStore', () => {\n  let store: MaeHistoryStore;\n\n  beforeEach(() => {\n    store = new MaeHistoryStore();\n  });\n\n  describe('AC-1 — shared window', () => {\n    it('getWindow returns the entry appended by append', () => {\n      store.append('action-a', 0.1);\n      expect(store.getWindow('action-a')).toEqual([0.1]);\n    });\n\n    it('getMean returns the mean of the single entry (simulating ConfidenceUpdater / Type1Tracker read)', () => {\n      store.append('action-a', 0.1);\n      // ConfidenceUpdater path: getMean\n      expect(store.getMean('action-a')).toBeCloseTo(0.1, 6);\n      // Type1Tracker path: getMean via the same store\n      expect(store.getMean('action-a')).toBeCloseTo(0.1, 6);\n    });\n\n    it('getWindow returns empty array for unknown actionId', () => {\n      expect(store.getWindow('unknown')).toEqual([]);\n    });\n\n    it('getMean returns 0.0 sentinel for unknown actionId', () => {\n      expect(store.getMean('unknown')).toBe(0.0);\n    });\n\n    it('windows are keyed independently per actionId', () => {\n      store.append('a', 0.2);\n      store.append('b', 0.8);\n      expect(store.getMean('a')).toBeCloseTo(0.2, 6);\n      expect(store.getMean('b')).toBeCloseTo(0.8, 6);\n    });\n  });\n\n  describe('AC-2 — FIFO eviction at MAX_MAE_WINDOW', () => {\n    it('window caps at MAX_MAE_WINDOW entries', () => {\n      for (let i = 0; i < MAX_MAE_WINDOW + 1; i++) {\n        store.append('action-b', i * 0.01);\n      }\n      expect(store.getWindow('action-b')).toHaveLength(MAX_MAE_WINDOW);\n    });\n\n    it('11th entry evicts the first (oldest) entry — FIFO', () => {\n      for (let i = 0; i < MAX_MAE_WINDOW; i++) {\n        store.append('action-b', i * 0.01); // 0.00, 0.01, ..., 0.09\n      }\n      store.append('action-b', 0.99); // 11th\n      const w = store.getWindow('action-b');\n      // First entry should now be 0.01 (index-1 of the original fill), not 0.00\n      expect(w[0]).toBeCloseTo(0.01, 6);\n      expect(w[w.length - 1]).toBeCloseTo(0.99, 6);\n    });\n\n    it('getWindow result at capacity still returns prior single-drive result for affectedDrive', () => {\n      // Mirrors AC-1 from ticket: single-entry map behavior unchanged at capacity.\n      // Fill with 10 identical values\n      for (let i = 0; i < MAX_MAE_WINDOW; i++) {\n        store.append('action-c', 0.05);\n      }\n      expect(store.getMean('action-c')).toBeCloseTo(0.05, 6);\n    });\n  });\n});\n```"
