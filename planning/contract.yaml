    title: Create suggestion-helper.ts with Levenshtein near-miss query
    intent: "Create new file `/c/Users/Jim/OneDrive/desktop/Code/codebase-pkg/src/mcp-server/tools/suggestion-helper.ts`.\n\nFull content to write:\n\n```ts\n/**\n * suggestion-helper.ts -- TS-side Levenshtein near-miss lookup for did_you_mean.\n *\n * Used by getFunctionDetail and getDataFlow when a name resolves to 0 rows.\n * Pure TS — no APOC required.\n */\n\nimport { runQuery } from '../neo4j-client.js';\n\n/** Levenshtein edit distance (case-insensitive). */\nfunction levenshtein(a: string, b: string): number {\n  const al = a.toLowerCase();\n  const bl = b.toLowerCase();\n  const m = al.length;\n  const n = bl.length;\n  const dp: number[][] = Array.from({ length: m + 1 }, (_, i) =>\n    Array.from({ length: n + 1 }, (__, j) => (i === 0 ? j : j === 0 ? i : 0))\n  );\n  for (let i = 1; i <= m; i++) {\n    for (let j = 1; j <= n; j++) {\n      dp[i][j] =\n        al[i - 1] === bl[j - 1]\n          ? dp[i - 1][j - 1]\n          : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);\n    }\n  }\n  return dp[m][n];\n}\n\nexport interface NearMiss {\n  name: string;\n  filePath: string | null;\n  distance: number;\n}\n\n/**\n * Fetch all Function names from the graph and return the top `limit` closest\n * matches to `query` by Levenshtein distance. Returns [] on any error so\n * callers always get a safe fallback.\n */\nexport async function findNearMisses(\n  query: string,\n  limit = 3\n): Promise<NearMiss[]> {\n  try {\n    const records = await runQuery(\n      `MATCH (f:Function) RETURN f.name AS name, f.filePath AS filePath LIMIT 2000`\n    );\n    return records\n      .map((r) => ({\n        name: r.get('name') as string,\n        filePath: r.get('filePath') as string | null,\n        distance: levenshtein(query, (r.get('name') as string).split('.').pop() ?? r.get('name') as string),\n      }))\n      .sort((a, b) => a.distance - b.distance)\n      .slice(0, limit);\n  } catch {\n    return [];\n  }\n}\n```\n\nThis is a new file — no anchor needed. ~60 LOC."
