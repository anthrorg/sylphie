    title: Create constraint-validation.service.spec.ts with three test scenarios
    intent: "Create file at `packages/planning/src/pipeline/constraint-validation.service.spec.ts`. Use the same `npx tsx`-runnable, node:assert/strict pattern as `constraint-checks.spec.ts` (manual `describe`/`it` runner, `.js` extensions, process.exit(1) on failure). Structure:\n\n1. IMPORTS (with .js extensions):\n```typescript\nimport assert from 'node:assert/strict';\nimport { ConstraintValidationService } from './constraint-validation.service.js';\nimport type { PlanProposal, QueuedOpportunity, IPlanningEventLogger, PlanningEventType } from '../interfaces/planning.interfaces.js';\nimport { DriveName, Neo4jInstanceName } from '@sylphie/shared';\n```\n\n2. FAKE NEO4J: A `FakeNeo4j` class that takes a constructor arg `mode: 'return-rows' | 'return-empty' | 'throw'`. Its `getSession()` returns a fake session whose `run()` either: returns records containing `{ get: (k) => k === 'ctx' ? 'greet' : null }` (mode='return-rows'), returns `{ records: [] }` (mode='return-empty'), or throws `new Error('Connection refused')` (mode='throw'). Session also has `close: async () => {}`. FakeNeo4j.getSession() must accept `(name: Neo4jInstanceName, mode: 'READ' | 'WRITE')` signature matching `Neo4jService`.\n\n3. FAKE SERVICES: `FakeProposalService` (never called in these tests; stub `refine()` that throws), `FakeEventLogger` (captures calls array).\n\n4. HELPER `makeService(neo4jMode)`: constructs `new ConstraintValidationService(fakeProposalService, fakeEventLogger, new FakeNeo4j(neo4jMode) as any)`.\n\n5. HELPER `makeProposal(triggerContext: string)`: returns a minimal `PlanProposal` with `name='greet-plan'`, `category='SelfRegulation'`, `triggerContext`, `rationale='addresses curiosity'`, `actionSequence=[{index:0, stepType:'LLM_GENERATE', params:{purpose:'respond'}}]`, `predictedDriveEffects:{ [DriveName.Curiosity]: -0.2 }`.\n\n6. HELPER `makeOpportunity()`: returns a `QueuedOpportunity` with `payload.id='opp-1'`, `classification='PREDICTION_FAILURE_PATTERN'`, `affectedDrive=DriveName.Curiosity`, `contextFingerprint='curiosity'`, `priority='MEDIUM'`, `sourceEventId='evt-1'`; `enqueuedAt=new Date()`, `initialPriority=0.6`, `currentPriority=0.6`.\n\n7. THREE TEST CASES:\n\nTest A — AC-1 (constraint-3 fires on duplicate trigger_context):\n```\ndescribe('AC-1: duplicate trigger_context — constraint 3 fires', () => {\n  it('returns passed=false with procedure_conflict in violations', async () => {\n    // FakeNeo4j in mode='return-rows' returns one record ctx='greet'\n    const svc = makeService('return-rows');\n    const proposal = makeProposal('greet'); // matches the seeded row\n    const opp = makeOpportunity();\n    const result = await svc.validate(proposal, opp);\n    assert.equal(result.passed, false);\n    assert.equal(result.deferred, false);\n    assert.ok(\n      result.violations.includes('procedure_conflict'),\n      `Expected violations to include 'procedure_conflict', got: ${JSON.stringify(result.violations)}`\n    );\n    assert.ok(result.reasoning.includes('greet'), 'reasoning should name the conflicting trigger');\n  });\n\n  it('returns passed=true when proposal has a different trigger_context', async () => {\n    const svc = makeService('return-rows'); // seeded with 'greet'\n    const proposal = makeProposal('farewell');  // no conflict\n    const opp = makeOpportunity();\n    const result = await svc.validate(proposal, opp);\n    assert.equal(result.passed, true);\n    assert.equal(result.deferred, false);\n    assert.deepEqual(result.violations, []);\n  });\n});\n```\n\nTest B — AC-2a (empty ActionProcedure set, no false positives):\n```\ndescribe('AC-2a: no ActionProcedure nodes — no false positives', () => {\n  it('returns passed=true when Neo4j returns no rows', async () => {\n    const svc = makeService('return-empty');\n    const proposal = makeProposal('greet');\n    const opp = makeOpportunity();\n    const result = await svc.validate(proposal, opp);\n    assert.equal(result.passed, true);\n    assert.equal(result.deferred, false);\n    assert.deepEqual(result.violations, []);\n  });\n});\n```\n\nTest C — AC-2b (Neo4j unreachable, fail-closed defer):\n```\ndescribe('AC-2b: Neo4j unreachable — fail-closed defer', () => {\n  it('returns deferred=true and passed=false when session.run throws', async () => {\n    const svc = makeService('throw');\n    const proposal = makeProposal('greet');\n    const opp = makeOpportunity();\n    const result = await svc.validate(proposal, opp);\n    assert.equal(result.passed, false);\n    assert.equal(result.deferred, true);\n    assert.deepEqual(result.violations, [],\n      'deferred result must NOT contain violations (fail-closed, not a constraint failure)');\n    assert.equal(result.attemptsUsed, 0);\n  });\n});\n```\n\n8. FOOTER: standard `console.log(\\`Results: ${passed} passed, ${failed} failed\\`)` + `if (failed > 0) process.exit(1);`"
