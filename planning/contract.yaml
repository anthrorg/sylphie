    title: Add parseLlmExtractionResponse() pure utility function at end of file
    intent: "In `packages/decision-making/src/episodic-memory/consolidation.service.ts`, append a new pure utility function after the closing `}` of `extractRelationships` (after line 424, end of file). This function parses the structured LLM response text:\n\n```ts\n/**\n * Parse the LLM's ENTITIES / RELATIONSHIPS structured response.\n *\n * Returns null if the response is missing the ENTITIES line (parse failure\n * signals caller to fall back to heuristic).\n *\n * Entity rules: each comma-delimited token is trimmed; multi-word tokens\n * survive intact; single-word all-caps tokens are lowercased (not proper\n * nouns); blank tokens are dropped.\n *\n * Relationship rules: each RELATIONSHIPS: line is split on ' | ' into\n * [subject, predicate, object]. Lines that do not yield exactly 3 parts\n * are skipped. At least one triple with object != 'observed_outcome' is\n * expected from the LLM; if none survive, returns null (triggers fallback).\n */\nfunction parseLlmExtractionResponse(\n  raw: string,\n  confidence: number,\n  provenance: ProvenanceSource,\n): { entities: readonly string[]; relationships: readonly SemanticRelationship[] } | null {\n  const lines = raw.split('\\n').map((l) => l.trim()).filter(Boolean);\n\n  const entityLine = lines.find((l) => l.startsWith('ENTITIES:'));\n  if (!entityLine) return null;\n\n  const entityPart = entityLine.slice('ENTITIES:'.length).trim();\n  const entities = entityPart\n    .split(',')\n    .map((t) => t.trim())\n    .filter((t) => t.length >= 2);\n\n  const relationships: SemanticRelationship[] = [];\n  for (const line of lines) {\n    if (!line.startsWith('RELATIONSHIPS:')) continue;\n    const triplePart = line.slice('RELATIONSHIPS:'.length).trim();\n    const parts = triplePart.split(' | ');\n    if (parts.length !== 3) continue;\n    const [subject, predicate, object] = parts.map((p) => p.trim());\n    if (!subject || !predicate || !object) continue;\n    relationships.push({ subject, predicate, object, confidence, provenance });\n  }\n\n  // Require at least one triple with a non-generic object (acceptance criterion).\n  const hasSpecificTriple = relationships.some((r) => r.object !== 'observed_outcome');\n  if (relationships.length === 0 || !hasSpecificTriple) return null;\n\n  return { entities, relationships };\n}\n```"
