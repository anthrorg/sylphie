nals 1.0 -> score still 1.0 (sum=1.0 preserved)\n        assert result.confidence == pytest.approx(1.0)\n\n    def test_weight_sum_not_one_raises_validation_error(self) -> None:\n        \"\"\"Weights not summing to 1.0 raise Pydantic ValidationError at construction time.\"\"\"\n        bad_weights = {\"spatial\": 0.50, \"embedding\": 0.30, \"color\": 0.15, \"size\": 0.05, \"label_raw\": 0.05}  # sums to 1.05\n        with pytest.raises(ValidationError):\n            PersistenceCheckConfig(new_weights=bad_weights)\n\n    def test_known_weights_bad_sum_raises_validation_error(self) -> None:\n        bad_weights = {\"embedding\": 0.40, \"color\": 0.25, \"spatial\": 0.15, \"size\": 0.10, \"label_raw\": 0.05}  # sums to 0.95\n        with pytest.raises(ValidationError):\n            PersistenceCheckConfig(known_weights=bad_weights)\n```\n\nNote: `ValidationError` is imported from `pydantic` — add `from pydantic import ValidationError` near the top of the test file after the existing `import pytest` line (around line 30). The existing imports of `_NEW_WEIGHTS`, `_KNOWN_WEIGHTS`, `_interpolate_weights` from `persistence_check_service` at lines 37-43 remain valid since those module-level names are unchanged."
