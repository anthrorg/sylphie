      description: "tts.service.ts uses a single global voiceId (tts.service.ts:17,24,59). A per-person voice cache is net-new product scope no ticket motivated (CON-1 / scope discipline). Sylphie speaks with one voice; varying her output voice by listener is neither requested nor coherent with a single-agent identity. Revisit only if Jim raises a concrete per-listener voice-rendering need — then it gets its own plan node.",
      rationale: "Unrequested feature; the global cache already serves the only need (one voice, cached).",
      decision_ref: AD-0012 }
