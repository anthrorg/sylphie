    title: Add backoff tests to opportunity-queue.service.spec.ts
    intent: "In `packages/planning/src/queue/opportunity-queue.service.spec.ts`, add a new `describe` block after the existing 'duplicate rejection' suite (before the summary block at ~line 292). Extend `makeQueued` calls with the optional `retryAfter` field by passing it as a third argument or inline override — the existing helper already allows `Partial<OpportunityCreatedPayload>` overrides; for `retryAfter` and `deferralCount` spread them onto the returned object directly.\n\nAdd this block:\n\n```typescript\ndescribe('OpportunityQueueService -- retryAfter backoff', () => {\n  it('dequeue skips an item whose retryAfter is in the future', () => {\n    const logger = new MockEventLogger();\n    const svc = makeService(logger);\n\n    const future = Date.now() + 60_000; // 1 min from now\n    const blocked = { ...makeQueued(0.9), retryAfter: future };\n    const eligible = makeQueued(0.6);\n\n    svc.enqueue(blocked);\n    svc.enqueue(eligible);\n    // blocked has higher priority and is at head after sort, but must be skipped\n    const result = svc.dequeue();\n\n    assert.ok(result !== null, 'Should return the eligible item');\n    assert.equal(result.payload.id, eligible.payload.id, 'Must skip the future-blocked item');\n    assert.equal(svc.size(), 1, 'Blocked item stays in queue');\n  });\n\n  it('dequeue returns null when all items are future-blocked', () => {\n    const logger = new MockEventLogger();\n    const svc = makeService(logger);\n\n    const future = Date.now() + 60_000;\n    svc.enqueue({ ...makeQueued(0.8), retryAfter: future });\n    svc.enqueue({ ...makeQueued(0.5), retryAfter: future });\n\n    const result = svc.dequeue();\n    assert.equal(result, null, 'All blocked → null');\n    assert.equal(svc.size(), 2, 'Items must stay in queue');\n  });\n\n  it('dequeue returns an item once its retryAfter has passed', () => {\n    const logger = new MockEventLogger();\n    const svc = makeService(logger);\n\n    const past = Date.now() - 1; // already expired\n    const item = { ...makeQueued(0.7), retryAfter: past };\n    svc.enqueue(item);\n\n    const result = svc.dequeue();\n    assert.ok(result !== null, 'Expired retryAfter must be dequeued');\n    assert.equal(result.payload.id, item.payload.id);\n  });\n\n  it('item without retryAfter is never blocked', () => {\n    const logger = new MockEventLogger();\n    const svc = makeService(logger);\n\n    const item = makeQueued(0.6); // no retryAfter\n    svc.enqueue(item);\n\n    const result = svc.dequeue();\n    assert.ok(result !== null);\n    assert.equal(result.payload.id, item.payload.id);\n  });\n});\n```"
