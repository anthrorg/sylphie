    title: Write seed_timescale.sql — seed a 768-D visual_object_embeddings row
    intent: "Create `test/fixtures/vision/seed_timescale.sql` (new file). The SQL must be idempotent (safe to re-run) and use the same column order as the VWM INSERT at `apps/sylphie/src/services/visual-working-memory.service.ts:839-844`. Content:\n\n```sql\n-- TK-30 seed: one deterministic 768-D VisualObject row for acceptance tests.\n-- Idempotent: ON CONFLICT (id) DO NOTHING.\n-- Run against: postgresql://sylphie:sylphie_events_dev@localhost:5433/sylphie_events\n-- Connection: psql \"postgresql://sylphie:sylphie_events_dev@localhost:5433/sylphie_events\" -v ON_ERROR_STOP=1 -f test/fixtures/vision/seed_timescale.sql\n\nINSERT INTO visual_object_embeddings\n  (id, node_id, label, embedding, confidence, discovered, created_at,\n   bounding_box, dominant_colors, object_crop_b64, embedding_version)\nVALUES (\n  'tk30-seed-mug-001',\n  'vobj-tk30seed01',\n  'cup',\n  ('[' || array_to_string(ARRAY(SELECT (i % 10)::float / 10 FROM generate_series(0, 767) AS i), ',') || ']')::vector,\n  0.40,\n  false,\n  NOW(),\n  '[0.2,0.3,0.5,0.6]',\n  '[[120,80,40]]',\n  NULL,\n  2\n)\nON CONFLICT (id) DO NOTHING;\n```\n\nThe vector expression generates a deterministic 768-D vector without requiring Python. `bounding_box` is a normalized [0,1] JSON array (matches VWM normalizeBbox output). `dominant_colors` is a JSON array of one RGB triple. `embedding_version=2` matches `CURRENT_OBJECT_EMBEDDING_VERSION` (vwm.service.ts:62). The row id `tk30-seed-mug-001` is stable across re-runs."
