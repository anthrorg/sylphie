  - id: TASK-664
    kind: task
    parent: TK-78
    status: todo
    title: Create infra/migrations/ directory and write the migration script
    intent: "Create the directory `infra/migrations/` (does not exist yet) and write the file `infra/migrations/001-legacy-pattern-rescope.ts`. The script must follow the exact pattern of `scripts/reset-data.ts` (standalone tsx, `pg` Pool, no NestJS imports, `process.cwd()` not `__dirname`). Full structure:\n\n```\n#!/usr/bin/env npx tsx\n/**\n * infra/migrations/001-legacy-pattern-rescope.ts\n *\n * One-shot idempotent migration: re-attribute the 293 legacy world-scoped\n * GROUNDED patterns in `learned_patterns` to grounding_person_id='guardian'.\n *\n * Background (AD-0011 / TK-78): 293 rows were written before Wave-3\n * three-graph isolation (commit 1f53de2). They have grounding_person_id IS NULL\n * and knowledge_grounding='GROUNDED', carrying guardian-private facts (name,\n * city, dog). After Wave-3 these are a standing provenance gap: a future\n * second person could receive GROUNDED replies citing Jim's personal facts.\n * This migration closes that gap by re-scoping the rows to 'guardian' so\n * applyPersonScopeDemotion() demotes them to UNKNOWN for non-guardian speakers.\n *\n * SAFETY\n * ------\n * - Dry-run by default (prints count + 5-row sample, no writes).\n * - Add --confirm (or SYLPHIE_MIGRATE_CONFIRM=1) to apply.\n * - Takes a pg_dump backup BEFORE any UPDATE when --confirm is given.\n * - Idempotent: rows already set to grounding_person_id='guardian' are untouched\n *   (WHERE clause scopes only NULL rows).\n *\n * REVERSE\n * -------\n * To undo:\n *   UPDATE learned_patterns\n *     SET grounding_person_id = NULL\n *   WHERE grounding_person_id = 'guardian'\n *     AND knowledge_grounding = 'GROUNDED'\n *     AND migrated_at IS NOT NULL;   -- if you stamp migrated_at\n * Or restore from the backup produced at migration time.\n *\n * USAGE\n * -----\n *   npx tsx infra/migrations/001-legacy-pattern-rescope.ts           # dry run\n *   npx tsx infra/migrations/001-legacy-pattern-rescope.ts --confirm # live\n */\n\nimport { Pool } from 'pg';\nimport { execSync } from 'child_process';\nimport * as fs from 'fs';\nimport * as path from 'path';\n\nconst REPO_ROOT = process.cwd();\n\nconst CONFIRMED =\n  process.argv.includes('--confirm') ||\n  process.env['SYLPHIE_MIGRATE_CONFIRM'] === '1';\n\nconst TIMESCALE_CONFIG = {\n  host:     process.env['TIMESCALE_HOST']     || 'localhost',\n  port:     parseInt(process.env['TIMESCALE_PORT'] || '5433', 10),\n  database: process.env['TIMESCALE_DB']       || 'sylphie_events',\n  user:     process.env['TIMESCALE_USER']     || 'sylphie',\n  password: process.env['TIMESCALE_PASSWORD'] || 'sylphie_events_dev',\n};\n\n// ---------------------------------------------------------------------------\n// Candidates: world-scoped GROUNDED rows only (idempotent scope)\n// ---------------------------------------------------------------------------\nconst DRY_RUN_SQL = `\n  SELECT id, LEFT(response_text, 80) AS preview, created_at\n    FROM learned_patterns\n   WHERE grounding_person_id IS NULL\n     AND knowledge_grounding = 'GROUNDED'\n   ORDER BY created_at\n`;\n\nconst COUNT_SQL = `\n  SELECT COUNT(*)::int AS n\n    FROM learned_patterns\n   WHERE grounding_person_id IS NULL\n     AND knowledge_grounding = 'GROUNDED'\n`;\n\nconst UPDATE_SQL = `\n  UPDATE learned_patterns\n     SET grounding_person_id = 'guardian'\n   WHERE grounding_person_id IS NULL\n     AND knowledge_grounding = 'GROUNDED'\n`;\n\nfunction header(text: string): void {\n  console.log(`\\n${'─'.repeat(60)}\\n  ${text}\\n${'─'.repeat(60)}`);\n}\nfunction info(t: string) { console.log(`  [INFO]  ${t}`); }\nfunction ok(t: string)   { console.log(`  [OK]    ${t}`); }\nfunction warn(t: string) { console.log(`  [WARN]  ${t}`); }\nfunction fail(t: string) { console.error(`  [FAIL]  ${t}`); }\n\nasync function main(): Promise<void> {\n  header('TK-78 — Legacy warm-pattern re-scoping migration');\n\n  const pool = new Pool({ ...TIMESCALE_CONFIG, max: 2, idleTimeoutMillis: 5000 });\n\n  try {\n    // 1. Count candidates\n    const countRes = await pool.query<{ n: number }>(COUNT_SQL);\n    const candidateCount = countRes.rows[0]!.n;\n    info(`Candidate rows (grounding_person_id IS NULL, knowledge_grounding='GROUNDED'): ${candidateCount}`);\n\n    // Warn if the count differs significantly from the expected 293\n    if (candidateCount === 0) {\n      ok('No candidates found — migration already applied or DB is clean. Nothing to do.');\n      return;\n    }\n    if (candidateCount < 200 || candidateCount > 400) {\n      warn(`Expected ~293 rows; found ${candidateCount}. Verify before proceeding.`);\n    }\n\n    // 2. Show a 5-row sample\n    const sampleRes = await pool.query<{ id: string; preview: string; created_at: Date }>(\n      DRY_RUN_SQL + ' LIMIT 5'\n    );\n    info('5-row sample:');\n    for (const row of sampleRes.rows) {\n      console.log(`    ${row.id}  ${String(row.created_at).substring(0, 10)}  ${row.preview}`);\n    }\n\n    if (!CONFIRMED) {\n      header('DRY RUN — no changes made');\n      console.log(`\n  To apply: npx tsx infra/migrations/001-legacy-pattern-rescope.ts --confirm\n  Or:       SYLPHIE_MIGRATE_CONFIRM=1 npx tsx infra/migrations/001-legacy-pattern-rescope.ts\n`);\n      return;\n    }\n\n    // 3. Backup BEFORE write\n    header('Step 1: pg_dump backup');\n    const backupDir = path.join(REPO_ROOT, 'backups');\n    fs.mkdirSync(backupDir, { recursive: true });\n    const backupFile = path.join(\n      backupDir,\n      `learned_patterns-pre-tk78-${new Date().toISOString().replace(/[:.]/g, '-')}.sql`\n    );\n    try {\n      // pg_dump of the single table via docker exec (same approach as reset-data.ts docs)\n      execSync(\n        `docker exec sylphie-timescaledb pg_dump -U ${TIMESCALE_CONFIG.user}` +\n        ` -d ${TIMESCALE_CONFIG.database} -t learned_patterns --data-only` +\n        ` > \"${backupFile}\"`,\n        { shell: 'bash', stdio: ['pipe', 'pipe', 'pipe'] }\n      );\n      ok(`Backup written to: ${backupFile}`);\n    } catch (backupErr) {\n      warn(`pg_dump failed (Docker may not be running): ${backupErr instanceof Error ? backupErr.message : String(backupErr)}`);\n      warn('Proceeding WITHOUT a backup — ensure you have one or abort with Ctrl+C.');\n    }\n\n    // 4. Apply migration in a transaction\n    header('Step 2: UPDATE grounding_person_id = \\'guardian\\'');\n    const client = await pool.connect();\n    try {\n      await client.query('BEGIN');\n      const updateRes = await client.query(UPDATE_SQL);\n      const updatedCount = updateRes.rowCount ?? 0;\n      await client.query('COMMIT');\n      ok(`Updated ${updatedCount} rows → grounding_person_id = 'guardian'.`);\n    } catch (err) {\n      await client.query('ROLLBACK');\n      fail(`UPDATE failed — rolled back: ${err instanceof Error ? err.message : String(err)}`);\n      process.exit(1);\n    } finally {\n      client.release();\n    }\n\n    // 5. Verify — count remaining NULL+GROUNDED rows (should be 0)\n    header('Step 3: idempotency verification');\n    const verifyRes = await pool.query<{ n: number }>(COUNT_SQL);\n    const remaining = verifyRes.rows[0]!.n;\n    if (remaining === 0) {\n      ok('Idempotency check PASSED — 0 NULL GROUNDED rows remain.');\n    } else {\n      warn(`${remaining} NULL GROUNDED rows still present — unexpected. Investigate before re-running.`);\n    }\n\n    header('Migration complete');\n    console.log(`\n  REVERSE step (if needed):\n    docker exec -it sylphie-timescaledb psql -U ${TIMESCALE_CONFIG.user} ${TIMESCALE_CONFIG.database} -c \\\\\n      \"UPDATE learned_patterns SET grounding_person_id = NULL WHERE grounding_person_id = 'guardian' AND knowledge_grounding = 'GROUNDED';\"\n  Or restore from: ${backupFile}\n`);\n  } finally {\n    await pool.end();\n  }\n}\n\nmain().catch((err) => {\n  fail(`Unhandled error: ${err instanceof Error ? err.message : String(err)}`);\n  process.exit(1);\n});\n```"
    files_in_scope:
    - infra/migrations/001-legacy-pattern-rescope.ts
