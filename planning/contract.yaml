    title: Implement the 'call' branch in _execute_string_ast
    intent: "In `packages/perception-service/cobeing/layer3_knowledge/morphology_executor.py`, inside `_execute_string_ast`, replace the existing `if step_type == 'call':` block (~lines 459-464) which currently raises `NotImplementedError`, with the full implementation:\n\n```python\nif step_type == \"call\":\n    target_procedure = step_node.properties.get(\"target_procedure\")\n    if target_procedure is None:\n        raise ValueError(\n            f\"call step '{step_id}' is missing required property \"\n            f\"'target_procedure'. Cannot determine which procedure to invoke.\"\n        )\n\n    # Recursion-depth guard (mirrors ProcedureExecutor ctx.remaining_depth)\n    if ctx.remaining_depth <= 0:\n        raise RecursionDepthExceededError(\n            f\"call step '{step_id}' targeting '{target_procedure}' \"\n            f\"exceeded maximum call depth. \"\n            f\"Call stack: {ctx.call_stack}\"\n        )\n\n    # Cross-procedure cycle guard (self-recursion is allowed)\n    current_procedure = ctx.call_stack[-1] if ctx.call_stack else None\n    if target_procedure in ctx.call_stack and target_procedure != current_procedure:\n        cycle_path = ctx.call_stack + [target_procedure]\n        raise CircularProcedureError(\n            f\"call step '{step_id}' would create a circular procedure \"\n            f\"call: {' -> '.join(cycle_path)}. \"\n            f\"Cross-procedure cycles are not allowed.\"\n        )\n\n    # Evaluate optional HAS_OPERAND children to allow word override;\n    # fall back to current word when no operands are declared.\n    operand_edges = await self._persistence.query_edges(\n        EdgeFilter(\n            edge_type=HAS_OPERAND,\n            source_node_id=step_id,\n        )\n    )\n    operand_edges.sort(key=lambda e: e.properties.get(\"position\", 0))\n    if operand_edges:\n        sub_word_raw = await self._execute_string_ast(operand_edges[0].target_id, word, ctx)\n        sub_word = str(sub_word_raw) if sub_word_raw is not None else word\n    else:\n        sub_word = word\n\n    sub_ctx = _StringExecContext(\n        remaining_depth=ctx.remaining_depth - 1,\n        call_stack=ctx.call_stack + [target_procedure],\n    )\n    sub_result = await self._execute_string_procedure_with_ctx(\n        target_procedure, sub_word, sub_ctx\n    )\n    if sub_result is None:\n        raise ValueError(\n            f\"call step '{step_id}': sub-procedure '{target_procedure}' \"\n            f\"returned None (procedure not found or execution failed).\"\n        )\n    return sub_result\n```\n\nAlso add the private helper method `_execute_string_procedure_with_ctx` to the class (place it immediately after `_execute_string_procedure`, ~after line 365):\n\n```python\nasync def _execute_string_procedure_with_ctx(\n    self,\n    procedure_id: str,\n    word: str,\n    ctx: _StringExecContext,\n) -> str | None:\n    \"\"\"Like _execute_string_procedure but with an inherited _StringExecContext.\n\n    Used by the 'call' step type to delegate to a sub-procedure while\n    propagating recursion-depth and call-stack from the parent traversal.\n    \"\"\"\n    proc_node = await self._persistence.get_node(NodeId(procedure_id))\n    if proc_node is None:\n        _logger.warning(\n            \"morph_procedure_not_found procedure=%s\", procedure_id\n        )\n        return None\n\n    body_edges = await self._persistence.query_edges(\n        EdgeFilter(\n            edge_type=HAS_PROCEDURE_BODY,\n            source_node_id=NodeId(procedure_id),\n        )\n    )\n    if not body_edges:\n        _logger.warning(\n            \"morph_procedure_no_body procedure=%s\", procedure_id\n        )\n        return None\n\n    root_step_id = body_edges[0].target_id\n    try:\n        result = await self._execute_string_ast(root_step_id, word, ctx)\n        return str(result) if result is not None else None\n    except (RecursionDepthExceededError, CircularProcedureError):\n        raise  # propagate depth/cycle errors as-is\n    except Exception as exc:\n        _logger.warning(\n            \"morph_ast_execution_failed procedure=%s word=%s error=%s\",\n            procedure_id,\n            word,\n            exc,\n        )\n        return None\n```\n\nThe existing `_execute_string_procedure` (~line 315) is unchanged — it still calls `_execute_string_ast` with no ctx (ctx defaults to None and gets a fresh context), which is correct for the top-level FST path. Only the 'call' branch uses the with_ctx variant to propagate depth/stack."
