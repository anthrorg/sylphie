    title: Add _detect_dep_cycle helper (three-colour DFS)
    intent: "In packages/perception-service/cobeing/layer3_knowledge/skill_installer.py, insert a new pure (non-async) helper immediately after _get_package_requires_from_graph (i.e., still before the '# Atomic installation' divider). The function:\n\n```python\ndef _detect_dep_cycle(\n    package_id: str,\n    dep_graph: dict[str, set[str]],\n) -> list[str] | None:\n    \"\"\"Three-colour DFS on dep_graph starting from package_id.\n\n    Returns the cycle path as a list of IDs (e.g. ['A', 'B', 'A']) if a\n    cycle is found, else None. All nodes not present as keys in dep_graph\n    (i.e. leaves with no known outbound deps) are treated as BLACK (done).\n    \"\"\"\n    WHITE, GRAY, BLACK = 0, 1, 2\n    color: dict[str, int] = {pkg: WHITE for pkg in dep_graph}\n\n    def _dfs(node: str) -> list[str] | None:\n        color[node] = GRAY\n        for neighbour in dep_graph.get(node, set()):\n            state = color.get(neighbour, BLACK)  # unknown leaf => BLACK (no outbound deps)\n            if state == GRAY:\n                return [node, neighbour]\n            if state == WHITE:\n                result = _dfs(neighbour)\n                if result is not None:\n                    return [node] + result\n        color[node] = BLACK\n        return None\n\n    if package_id in dep_graph and color.get(package_id, BLACK) == WHITE:\n        return _dfs(package_id)\n    return None\n```"
