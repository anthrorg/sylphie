    title: Define ScoringWeights type, constants, and instance-level EMA state on DeliberationService
    intent: "In packages/decision-making/src/deliberation/deliberation.service.ts:\n\n1. After the existing constants block (after line 186 `const DELIBERATION_TEMPERATURE = 0.4;`), add:\n```\n/** EMA learning rate for adaptive candidate scoring weights (Std-6 gate: PERMITTED). */\nconst EMA_ALPHA = 0.05;\n\n/** Minimum scored selections before any weight update fires. */\nconst EMA_MIN_SELECTIONS = 100;\n\n/** Floor below which a weight will not be reduced (prevents collapse). */\nconst WEIGHT_FLOOR = 0.05;\n\n/** Adaptive scoring weights — in-memory only, never persisted. */\ninterface ScoringWeights {\n  grounded: number;       // default 1.0\n  assisted: number;       // default 0.5\n  unknownConv: number;    // default 0.1\n  unknownFactual: number; // default 0.7\n  chatbot: number;        // default -0.5  (penalty, stored positive, applied negative)\n  idkConv: number;        // default -0.7  (penalty)\n  entityBonus: number;    // default 0.15\n  verbosePenalty: number; // default -0.1  (penalty)\n  questionPenalty: number;// default -0.15 (penalty)\n}\n\n/** Default weights matching the current hardcoded scoreCandidates logic. */\nconst DEFAULT_SCORING_WEIGHTS: Readonly<ScoringWeights> = {\n  grounded: 1.0,\n  assisted: 0.5,\n  unknownConv: 0.1,\n  unknownFactual: 0.7,\n  chatbot: 0.5,\n  idkConv: 0.7,\n  entityBonus: 0.15,\n  verbosePenalty: 0.1,\n  questionPenalty: 0.15,\n};\n```\n\n2. Inside the `DeliberationService` class, after the constructor (after line ~217), add two private instance fields:\n```\n  /** Mutable EMA-updated scoring weights. In-memory only; reset on restart. */\n  private scoringWeights: ScoringWeights = { ...DEFAULT_SCORING_WEIGHTS };\n\n  /** Total scored candidate selections across all deliberation calls this session. */\n  private totalScoredSelections = 0;\n```"
