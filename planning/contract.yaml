eDB persistence + pendingInterventions fix)\", description: \"supervisor.service.ts: recentVerdicts buffer in-memory only (lost on restart); pendingInterventions never consumed (memory leak); reasoning traces discarded. supervisor_verdicts hypertable + fire-and-forget emit. No ticket. See wiki/ideas/supervisor-verdict-audit-trail.md.\" }\n  - { id: Q-25, type: open_question, status: open, scope: EP-12, title: \"Idea #33 — Learning pipeline Neo4j session batching (upsert-entities + can-produce-edges)\", description: \"upsert-entities.service.ts:86-163 opens one Neo4j session per entity label. Up to 20 sessions/event. ExtractEdgesService already uses UNWIND+MERGE pattern. Replace with batched single-session UNWIND+MERGE. No ticket. See wiki/ideas/learning-neo4j-session-batching.md.\" }\n  - { id: Q-26, type: open_question, status: open, scope: EP-15, title: \"Idea #34 — Supervisor adaptive sampling rate based on verdict trends\", description: \"supervisor.service.ts: static modulo sampling; recentVerdicts buffer is the signal but not used to adjust rate. AdaptiveSamplingConfig + shouldEvaluate() trend computation. No ticket. See wiki/ideas/supervisor-adaptive-sampling-rate.md.\" }\n  - { id: Q-27, type: open_question, status: open, scope: EP-14, title: \"Idea #36 — Drive tick-loop observability instrumentation (latency histogram + /drives/health)\", description: \"drive-engine.ts: 100Hz tick loop; no per-tick latency collection; no /drives/health endpoint. Sample min/p50/p99/max every 100 ticks. TICK_PERFORMANCE_SAMPLE IPC. No ticket. See wiki/ideas/drive-tick-loop-observability.md.\" }\n  - { id: Q-28, type: open_question, status: open, scope: EP-14, title: \"Idea #39 — Simulation parallel category evaluation (Promise.allSettled over 5 categories)\", description: \"simulation.service.ts simulate() iterates 5 CANDIDATE_CATEGORIES with sequential await. Each evaluateCategory() is an independent TimescaleDB query. Promise.allSettled parallelises them. No ticket. See wiki/ideas/simulation-parallel-category-evaluation.md.\"\
