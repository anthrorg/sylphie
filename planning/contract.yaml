    title: Add public flushEvents(driveSnapshot) method to ConfidenceUpdaterService
    intent: "In `packages/decision-making/src/confidence/confidence-updater.service.ts`, immediately after the `recordPredictionMAE` method (after its closing `}` at line ~236), add a new public section and method. Insert between the `recordPredictionMAE` block and the `// Private — path implementations` section:\n\n```typescript\n  // ---------------------------------------------------------------------------\n  // IConfidenceUpdaterService — flushEvents\n  // ---------------------------------------------------------------------------\n\n  /**\n   * Emit all buffered confidence events with the cycle's DriveSnapshot.\n   *\n   * Call this once per cycle after update() has been called for all actions in\n   * the OBSERVING/LEARNING phase, passing the executor's captured DriveSnapshot.\n   * Events buffered during update() (CONFIDENCE_UPDATED, TYPE_1_GRADUATION,\n   * TYPE_1_DEMOTION) are written to TimescaleDB via the event logger, each\n   * carrying the correct driveSnapshot for cycle correlation.\n   *\n   * Empty buffer: returns immediately with no writes and no error.\n   * Batch decay: emits one row per action (no aggregation), per non_goal.\n   *\n   * @param driveSnapshot - The cycle-level drive state from IExecutorEngine.getCycleSnapshot().\n   */\n  flushEvents(driveSnapshot: DriveSnapshot): void {\n    if (!this.eventLogger || this._pendingEvents.length === 0) {\n      this._pendingEvents.length = 0;\n      return;\n    }\n\n    for (const event of this._pendingEvents) {\n      try {\n        switch (event.kind) {\n          case 'CONFIDENCE_UPDATED':\n            this.eventLogger.log(\n              'CONFIDENCE_UPDATED',\n              {\n                actionId: event.actionId,\n                oldConfidence: +event.oldConfidence.toFixed(4),\n                newConfidence: +event.newConfidence.toFixed(4),\n                delta: +event.delta.toFixed(4),\n                outcome: event.outcome,\n                guardianFeedback: event.guardianFeedback ?? null,\n              },\n              driveSnapshot,\n              driveSnapshot.sessionId,\n            );\n            break;\n          case 'TYPE_1_GRADUATION':\n            this.eventLogger.log(\n              'TYPE_1_GRADUATION',\n              {\n                actionId: event.actionId,\n                confidence: +event.confidence.toFixed(4),\n              },\n              driveSnapshot,\n              driveSnapshot.sessionId,\n            );\n            break;\n          case 'TYPE_1_DEMOTION':\n            this.eventLogger.log(\n              'TYPE_1_DEMOTION',\n              {\n                actionId: event.actionId,\n                confidence: +event.confidence.toFixed(4),\n                recentMAE: +event.recentMAE.toFixed(4),\n              },\n              driveSnapshot,\n              driveSnapshot.sessionId,\n            );\n            break;\n        }\n      } catch (err) {\n        this.logger.warn(`flushEvents: failed to emit ${event.kind} for ${(event as any).actionId}: ${err}`);\n      }\n    }\n\n    this._pendingEvents.length = 0;\n  }\n```"
