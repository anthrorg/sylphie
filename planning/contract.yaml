    intent: "Create `packages/decision-making/src/confidence/confidence-updater.service.spec.ts` with the following two describe blocks covering the two acceptance criteria:\n\n**AC1** — 'reinforced' update with flushEvents writes CONFIDENCE_UPDATED and TYPE_1_GRADUATION rows (not stdout-only):\n- Arrange: mock `IDecisionEventLogger` with `jest.fn()` on `log`. Construct `ConfidenceUpdaterService` with that mock. Call `recordPredictionMAE(actionId, 0.01)` enough times (10x) to satisfy graduation (MAE < 0.10). Then call `update(actionId, 'reinforced')` in a loop until `record.graduated` becomes true (seed with enough reinforcements so confidence rises above graduation threshold — you can drive count to 50 via 50 `update('reinforced')` calls, then check). After that final `update()`, call `flushEvents(stubDriveSnapshot)`.\n- Assert: `eventLogger.log` was called with `'CONFIDENCE_UPDATED'` containing `{ actionId, delta: expect.any(Number) }` AND with `'TYPE_1_GRADUATION'` containing `{ actionId, confidence: expect.any(Number) }`. Neither event must appear as a `console.log` / `logger.log` call only.\n\nSimpler approach: use the `qualifiesForGraduation` logic directly — call `recordPredictionMAE` 10 times with mae=0.01, then call `update('reinforced')` once with a service whose record already has `count=49` by calling `update('reinforced')` 49 times first (no snapshot → events buffered each time but not flushed). Then flush once. The graduation event must appear in `eventLogger.log` calls.\n\n**AC2a** — flushEvents on empty buffer: create service with mock logger, call `flushEvents(snapshot)` with no prior `update()`. Assert `eventLogger.log` not called, no error thrown.\n\n**AC2b** — batch decay: call `update('decayed')` twice for two different actionIds (both non-graduated, so no demotion fires; CONFIDENCE_UPDATED buffered for each). Call `flushEvents(snapshot)`. Assert `eventLogger.log` called exactly twice, once per actionId (no aggregation).\n\nSpec preamble:\n```typescript\nimport { ConfidenceUpdaterService } from './confidence-updater.service';\nimport { INITIAL_DRIVE_STATE, type DriveSnapshot } from '@sylphie/shared';\n\njest.mock('@sylphie/shared', () => {\n  const actual = jest.requireActual('@sylphie/shared');\n  return { ...actual, verboseFor: () => () => {} };\n});\n\nfunction makeSnapshot(): DriveSnapshot {\n  return {\n    pressureVector: { ...INITIAL_DRIVE_STATE },\n    timestamp: new Date(),\n    tickNumber: 1,\n    driveDeltas: {} as any,\n    ruleMatchResult: { ruleId: null, eventType: 'TEST', matched: false },\n    totalPressure: 0,\n    sessionId: 'test-session',\n  };\n}\n\nfunction makeLogger() {\n  return { log: jest.fn(), flush: jest.fn() };\n}\n```"
