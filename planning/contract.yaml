    intent: "In `packages/decision-making/src/episodic-memory/consolidation.service.ts`, add a new private async method immediately before the closing `}` of the class (after `emitConsolidationAttempted`, around line 329). The method calls the LLM, parses structured output, and falls back to the existing heuristic functions on any failure:\n\n```ts\n  // ---------------------------------------------------------------------------\n  // Private — LLM-assisted extraction\n  // ---------------------------------------------------------------------------\n\n  /**\n   * Attempt LLM-assisted entity + relationship extraction.\n   * Falls back to heuristic extractors on null LLM, unavailability, or parse\n   * failure. NEVER throws — fallback is always returned.\n   *\n   * Prompt format (LEARNING callerSubsystem; 'quick' tier; temp 0.2):\n   *   ENTITIES: <comma-separated multi-word entities>\n   *   RELATIONSHIPS: <subject> | <predicate> | <object>\n   *   (one RELATIONSHIPS line per triple, >=1 with object != 'observed_outcome')\n   */\n  private async extractWithLlm(\n    episode: Episode,\n    confidence: number,\n    provenance: ProvenanceSource,\n  ): Promise<{ entities: readonly string[]; relationships: readonly SemanticRelationship[] }> {\n    if (!this.llm || !this.llm.isAvailable()) {\n      return {\n        entities: extractEntities(episode.inputSummary, episode.actionTaken),\n        relationships: extractRelationships(episode, confidence, provenance),\n      };\n    }\n\n    const userContent =\n      `Extract named entities and semantic relationships from this episode.\\n` +\n      `Input: \"${episode.inputSummary}\"\\n` +\n      `Action: \"${episode.actionTaken}\"\\n\\n` +\n      `Reply with EXACTLY this format (no extra text):\\n` +\n      `ENTITIES: <comma-separated multi-word or lowercase concepts, NO sentence-initial capitals unless proper noun>\\n` +\n      `RELATIONSHIPS: <subject> | <predicate> | <object>\\n` +\n      `(Repeat RELATIONSHIPS line for each triple. At least one triple must have a specific object, not the literal word \"observed_outcome\".)`;\n\n    const request: LlmRequest = {\n      messages: [{ role: 'user', content: userContent }],\n      systemPrompt:\n        'You are a semantic extraction assistant. Extract named entities and relationship triples. ' +\n        'Respond ONLY in the specified format. No prose.',\n      maxTokens: 256,\n      temperature: 0.2,\n      tier: 'quick',\n      metadata: {\n        callerSubsystem: 'LEARNING',\n        purpose: 'CONSOLIDATION_EXTRACTION',\n        sessionId: episode.driveSnapshot.sessionId,\n      },\n    };\n\n    try {\n      const response = await this.llm.complete(request);\n      return parseLlmExtractionResponse(response.content, confidence, provenance) ??\n        {\n          entities: extractEntities(episode.inputSummary, episode.actionTaken),\n          relationships: extractRelationships(episode, confidence, provenance),\n        };\n    } catch (err) {\n      this.logger.warn(\n        `ConsolidationService: LLM extraction failed, falling back to heuristic: ${err}`,\n      );\n      return {\n        entities: extractEntities(episode.inputSummary, episode.actionTaken),\n        relationships: extractRelationships(episode, confidence, provenance),\n      };\n    }\n  }\n```\n\nThis is placed inside the class body, before the closing `}` of `ConsolidationService` at line 329."
