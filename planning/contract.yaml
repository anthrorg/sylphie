    intent: "packages/learning/src/pipeline/confidence-decay.service.ts:\n\n1. In `runDecayCycle()` (~:78-94): replace the three-method body with five calls and fold OKG counts into the totals:\n\n```typescript\nasync runDecayCycle(): Promise<DecayCycleResult> {\n  const t0 = Date.now();\n\n  const nodesDecayed = await this.decayNodes();\n  const edgesDecayed = await this.decayEdges();\n  const nodesPruned = await this.pruneOrphanedNodes();\n  const okgNodesDecayed = await this.decayOkgNodes();\n  const okgNodesPruned = await this.pruneOkgOrphanedNodes();\n\n  const totalNodesDecayed = nodesDecayed + okgNodesDecayed;\n  const totalNodesPruned  = nodesPruned  + okgNodesPruned;\n  const durationMs = Date.now() - t0;\n\n  vlog('decay cycle complete', { nodesDecayed: totalNodesDecayed, edgesDecayed, nodesPruned: totalNodesPruned, okgNodesDecayed, okgNodesPruned, durationMs });\n  this.logger.log(\n    `Decay cycle: ${totalNodesDecayed} nodes decayed (${okgNodesDecayed} OKG), ` +\n      `${edgesDecayed} edges decayed, ` +\n      `${totalNodesPruned} orphans pruned (${okgNodesPruned} OKG) (${durationMs}ms)`,\n  );\n\n  return { nodesDecayed: totalNodesDecayed, edgesDecayed, nodesPruned: totalNodesPruned, wasNoop: totalNodesDecayed + edgesDecayed + totalNodesPruned === 0 };\n}\n```\n\n2. In the file-level JSDoc at the top (~:33-39): replace the paragraph starting \"Scope (WS3 T3): decay runs only against Neo4jInstanceName.WORLD\" with:\n```\n * Scope: decay runs against Neo4jInstanceName.WORLD (nodes + edges) and\n * Neo4jInstanceName.OTHER (OKG :Attribute nodes only, not edges).\n * Guardian-confirmed identity facts (provenance_type='GUARDIAN') in OTHER\n * are excluded from decay. Stub §2.11 is closed by TK-49.\n```"
