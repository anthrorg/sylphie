    title: Add two-person cross-query describe block to upsert-entities.candidate.spec.ts
    intent: "Append a new top-level `describe` block titled `'TK-81 — two-person WKG isolation regression'` at the END of `packages/learning/src/pipeline/upsert-entities.candidate.spec.ts` (after line 256, within the same file). The block contains ONE `it` case:\n\n```typescript\ndescribe('TK-81 — two-person WKG isolation regression', () => {\n  it('Person A upsert mints a :Candidate scoped to A; a second upsert for Person B does NOT overwrite grounding_person_id to B', async () => {\n    const neo = new CapturingNeo4j();\n    const svc = new UpsertEntitiesService(neo as unknown as never);\n\n    // Person A introduces \"Maxford\" in their turn.\n    await svc.upsertEntities(inputEvent('My dog is named Maxford the Brave.', 'user-A'));\n    const aRuns = candidateMerges(neo);\n    expect(aRuns.length).toBeGreaterThan(0);\n    expect(aRuns.every((r) => r.params['speakerId'] === 'user-A')).toBe(true);\n\n    // Person B's turn mentions the same proper noun.\n    neo.runs.length = 0; // clear captured runs\n    await svc.upsertEntities(inputEvent('Tell me about Maxford the Brave.', 'user-B'));\n    const bRuns = candidateMerges(neo);\n    // B's run goes through ON MATCH coalesce — speakerId in the MERGE params is 'user-B'\n    // but the Cypher coalesce(n.grounding_person_id, $speakerId) preserves A's existing value.\n    // We assert: (a) B's upsert is itself also minted as a :Candidate (not :Entity),\n    // (b) the MERGE is scoped to the SAME label (label 'Maxford the Brave' or partial).\n    expect(bRuns.length).toBeGreaterThan(0);\n    for (const r of bRuns) {\n      // Still minted to :Candidate, not :Entity — the cross-person gap is in the Cypher,\n      // not the service. Confirm no :Entity mint.\n      expect(r.instance).toBe(Neo4jInstanceName.WORLD);\n      expect(r.params['provenance']).toBe(CANDIDATE_PROVENANCE_TYPE);\n      expect(r.params['confidence'] as number).toBeLessThanOrEqual(CANDIDATE_CONFIDENCE_CAP);\n    }\n    // Entity merges for B's turn must be zero — the §2.8 gate holds for B too.\n    expect(entityMerges(neo)).toHaveLength(0);\n  });\n});\n```\n\nThis test exercises the path through `upsert-entities.service.ts:267-318` (`mergeCandidateNode`) for two back-to-back speakers on the same label."
    files_in_scope:
    - packages/learning/src/pipeline/upsert-entities.candidate.spec.ts
