  - id: Q-12
    type: open_question
    status: resolved
    scope: TK-38
    title: freeze AC asserts panel weights don't change, but panels are not trained by the Trainer
    owner: jim
    description: 'AC: panel[0] weights do NOT change - but the Trainer trains the global model, not per-panel. Clarify what per-model freeze must protect (global model snapshot? convergence model?) so the AC is provable rather than trivially-true on a never-trained NPZ.'
    resolution: 'DEC-12 (AD-0023): per-panel freeze protects the on-disk NPZ snapshot at the panel''s weights_path, not in-memory state. Rewrite the TK-38 AC to be byte-provable: freeze panel_0, then run a training pass that targets a DIFFERENT model, then assert panel_0''s weights_path NPZ is byte-identical (e.g. sha256) before vs after; unfreeze then assert a targeted train changes it. This removes the trivially-true-on-never-trained-NPZ hole by exercising a real training run against a different target while frozen.'
    date_raised: '2026-06-16'
