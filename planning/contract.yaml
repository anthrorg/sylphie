e in getSplitHistory() (conversation-history.service.ts)\", description: \"conversation-history.service.ts getSplitHistory() has O(n²) nested scan, called every decision cycle. Lazy _splitCache invalidated by addUserMessage/addAssistantMessage/trim/clear. Cap is 50 messages so gain is modest but pattern is clean. No ticket. See wiki/ideas/conversation-history-split-lookahead-efficiency.md.\" }\n```\n\nInsert these lines after line ~1501 (after the DEF-5 closing `}`) and before `changelog:`. Do not alter any existing governance nodes."
