e whose object !== 'observed_outcome') stays as the acceptance-criterion check for TK-88's AC1. Do NOT change `extractEntities`/`extractRelationships` signatures.\n\nNo constructor change (TK-87 owns the injection). The only edits here are inside `extractWithLlm()` / `parseLlmExtractionResponse()` to make the relationship branch and its heuristic fallback explicit and correct."
