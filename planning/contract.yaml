    intent: "packages/planning/src/pipeline/simulation.service.ts\n\nReplace lines 189–220 (from `let totalEffect = 0;` through the closing `return { ... };`) with the following implementation. The existing query block (lines 164–175) and zero-history early-return (lines 177–186) are UNCHANGED.\n\n```typescript\n    // Aggregate drive effects across ALL drives seen in history.\n    const driveEffectTotals = new Map<DriveName, number>();\n    let successCount = 0;\n    let totalCount = 0;\n\n    for (const row of result.rows) {\n      const payload = typeof row.payload === 'string' ? JSON.parse(row.payload) : row.payload;\n      const count = parseInt(row.count, 10);\n      totalCount += count;\n\n      const driveEffects = payload['driveEffects'];\n      if (driveEffects && typeof driveEffects === 'object') {\n        for (const [drive, effect] of Object.entries(driveEffects)) {\n          if (typeof effect === 'number') {\n            const current = driveEffectTotals.get(drive as DriveName) ?? 0;\n            driveEffectTotals.set(drive as DriveName, current + effect * count);\n          }\n        }\n      }\n\n      if (payload['outcome'] === 'positive') {\n        successCount += count;\n      }\n    }\n\n    // Build per-drive averages.\n    const estimatedDriveEffect: Partial<Record<DriveName, number>> = {};\n    for (const [drive, total] of driveEffectTotals.entries()) {\n      estimatedDriveEffect[drive] = totalCount > 0 ? total / totalCount : 0;\n    }\n    // Guarantee the affectedDrive key is always present (may be 0 if history had no entry for it).\n    if (estimatedDriveEffect[affectedDrive] === undefined) {\n      estimatedDriveEffect[affectedDrive] = 0;\n    }\n\n    const successRate = totalCount > 0 ? successCount / totalCount : 0;\n\n    return {\n      description: `${category} based on ${totalCount} historical outcomes`,\n      actionCategory: category,\n      estimatedDriveEffect,\n      confidenceEstimate: Math.min(0.8, successRate),\n      riskScore: 1.0 - successRate,\n    };\n```\n\nOld lines 211–212 (`const avgEffect = totalCount > 0 ? totalEffect / totalCount : 0;` and `const successRate = ...`) are subsumed into the new block. Delete them. The `let totalEffect = 0;` variable declaration (old line 189) is also deleted (replaced by `driveEffectTotals` Map)."
