    intent: "Create `packages/perception-service/tests/test_morphology_executor_call.py` with three async test functions (no `requires_models` marker — pure unit tests using `InMemoryGraphPersistence`).\n\nTest setup: build a minimal graph with two `ProceduralTemplate` nodes (`proc:double_suffix` and `proc:add_s`) wired via `HAS_PROCEDURE_BODY` to `ProcedureStep` nodes that perform string operations, and a third template (`proc:call_chain`) whose body is a `call` step targeting `proc:add_s`.\n\n**test_call_step_delegates_to_subprocedure**: seeds a graph where `proc:caller` has body = a single `call` step (`target_procedure='proc:add_s'`), and `proc:add_s` has body = a `string_append` operation step ([variable $WORD, literal 's']). Assert that `executor.transform('cat', 'plural')` is NOT the test entry-point (transform uses `_PROCEDURE_FOR_TRANSFORM`). Instead call `executor._execute_string_procedure('proc:caller', 'cat')` directly. Assert `result == 'cats'`.\n\n**test_call_step_missing_procedure_raises_ValueError**: seeds a graph where the body step has `step_type='call'` and `target_procedure='proc:nonexistent'`. Call `executor._execute_string_procedure('proc:caller', 'cat')` and assert it returns `None` (because `_execute_string_procedure` catches the ValueError and returns None via the warning path). Then also call `executor._execute_string_ast(root_step_id, 'cat', None)` directly with a fresh ctx and assert it raises `ValueError` containing `'proc:nonexistent'`.\n\n**test_call_step_circular_chain_raises_CircularProcedureError**: seeds a minimal graph where `proc:A` has a `call` step targeting `proc:B`, and `proc:B` has a `call` step targeting `proc:A`. Directly call `executor._execute_string_ast(a_root_step_id, 'cat', _StringExecContext(remaining_depth=8, call_stack=['proc:A']))` and assert it raises `CircularProcedureError`.\n\n**test_call_step_depth_exceeded_raises_RecursionDepthExceededError**: seeds a `call` step targeting any valid sub-procedure. Directly call `executor._execute_string_ast(step_id, 'cat', _StringExecContext(remaining_depth=0, call_stack=['proc:A']))` and assert it raises `RecursionDepthExceededError`.\n\nImports at top of test file:\n```python\nimport pytest\nfrom cobeing.layer3_knowledge.morphology_executor import (\n    MorphologyExecutor,\n    _StringExecContext,  # internal — tested here for depth/cycle paths\n)\nfrom cobeing.layer3_knowledge.procedure_types import (\n    CircularProcedureError,\n    HAS_OPERAND,\n    HAS_PROCEDURE_BODY,\n    OPERATIONS,\n    PROCEDURE_STEP,\n    PROCEDURAL_TEMPLATE,\n    RecursionDepthExceededError,\n)\nfrom cobeing.layer3_knowledge.in_memory_persistence import InMemoryGraphPersistence\nfrom cobeing.layer3_knowledge.node_types import KnowledgeNode, KnowledgeEdge, NodeStatus, SchemaLevel\nfrom cobeing.shared.provenance import Provenance, ProvenanceSource\nfrom cobeing.shared.types import NodeId, EdgeId\n```\n\nUse `@pytest.mark.asyncio` and `pytestmark = pytest.mark.asyncio` for all four tests. Run with:\n    `cd packages/perception-service && .venv/Scripts/python.exe -m pytest tests/test_morphology_executor_call.py -v`\n\nAll four tests must pass; the old `NotImplementedError` assertion path is confirmed absent (covered by the missing-procedure and ValueError test replacing it)."
