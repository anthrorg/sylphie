    title: Add decayOkgNodes() to ConfidenceDecayService
    intent: "packages/learning/src/pipeline/confidence-decay.service.ts — after the closing brace of decayEdges() (~:209) and before the pruneOrphanedNodes() method, insert a new private method:\n\n```typescript\n/**\n * Apply time-based confidence decay to :Attribute nodes in the OKG (OTHER instance).\n *\n * Exclusion predicate (TK-49): nodes with provenance_type = 'GUARDIAN' are\n * NEVER decayed. Guardian identity facts (written by writeFact with isGuardian=true)\n * carry provenance_type='GUARDIAN' and must remain stable.\n *\n * Same ACT-R formula and per-provenance rates as decayNodes() against WORLD.\n * coalesce(last_retrieval_at, updated_at, learned_at) — OKG Attribute nodes use\n * `learned_at` as the creation timestamp (not `created_at`).\n */\nprivate async decayOkgNodes(): Promise<number> {\n  const session = this.neo4j.getSession(Neo4jInstanceName.OTHER, 'WRITE');\n\n  try {\n    const result = await session.run(\n      `MATCH (a:Attribute)\n       WHERE a.confidence > $pruneThreshold\n         AND a.provenance_type <> 'GUARDIAN'\n       WITH a,\n            coalesce(a.last_retrieval_at, a.updated_at, a.learned_at) AS lastActivity\n       WHERE lastActivity IS NOT NULL\n       WITH a, lastActivity,\n            (datetime().epochMillis - lastActivity.epochMillis) / 3600000.0 AS hoursSince,\n            CASE a.provenance_type\n              WHEN 'SENSOR'        THEN 0.05\n              WHEN 'LLM_GENERATED' THEN 0.08\n              WHEN 'INFERENCE'     THEN 0.06\n              WHEN 'BEHAVIORAL_INFERENCE' THEN 0.06\n              WHEN 'SELF_REPORTED' THEN 0.06\n              WHEN 'OBSERVED'      THEN 0.06\n              ELSE 0.05\n            END AS decayRate\n       WHERE hoursSince > $minHours\n       WITH a, a.confidence - decayRate * log(hoursSince + 1) AS newConf\n       WHERE newConf < a.confidence\n       SET a.confidence = CASE WHEN newConf < 0.0 THEN 0.0 ELSE newConf END,\n           a.decayed_at = datetime()\n       RETURN count(a) AS decayed`,\n      { pruneThreshold: PRUNE_THRESHOLD, minHours: MIN_HOURS_BEFORE_DECAY },\n    );\n\n    const record = result.records[0];\n    return record ? toNumber(record.get('decayed')) : 0;\n  } catch (err) {\n    this.logger.warn(\n      `decayOkgNodes failed: ${err instanceof Error ? err.message : String(err)}`,\n    );\n    return 0;\n  } finally {\n    await session.close();\n  }\n}\n```\n\nNote: OKG Attribute nodes use `learned_at` (written by writeFact ON CREATE) not `created_at`. The coalesce order is `last_retrieval_at` (written by reinforceFactNode) → `updated_at` (ON MATCH) → `learned_at` (ON CREATE). GUARDIAN is excluded by the `provenance_type <> 'GUARDIAN'` predicate, not a missing rate entry."
    files_in_scope:
    - packages/learning/src/pipeline/confidence-decay.service.ts
