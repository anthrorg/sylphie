    intent: "In `packages/decision-making/src/decision-making.service.ts`, make the following targeted changes inside `processInput()`:\n\n**A. Add a module-level variable** just above `async processInput(...)` (~line 821) to accumulate the error for the current cycle:\n```typescript\n// TK-66: per-cycle error context, set on catch and passed to encode().\nlet cycleError: import('@sylphie/shared').CycleErrorContext | undefined;\n```\n(Declare this as a `let` local at the TOP of `processInput`, not as a class field — it lives only for one cycle.)\n\n**B. Wrap each `this.deliberation.deliberate(...)` call** — there are four call sites in `processInput`:\n- Line ~1331 (latent empty fallthrough)\n- Line ~1428 (Type 2 novel)\n- Line ~1519 (SHRUG+text path)\n- (and one more in the Type 2+action-request branch at ~1448)\n\nFor each of these, wrap with a helper inline try/catch that classifies the error:\n```typescript\nlet deliberationResult: DeliberationResult;\ntry {\n  deliberationResult = await this.deliberation.deliberate(frame, contextForPrediction, recallRetrieval);\n} catch (deliberErr) {\n  const isTimeout =\n    deliberErr instanceof Error &&\n    (deliberErr.message.includes('timeout') ||\n     deliberErr.message.includes('ECONNRESET') ||\n     deliberErr.name === 'AbortError');\n  cycleError = {\n    cause: isTimeout ? 'LLM_TIMEOUT' : 'DELIBERATION_ERROR',\n    message: deliberErr instanceof Error ? deliberErr.message : String(deliberErr),\n    caughtAt: new Date().toISOString(),\n  };\n  this.logger.error(`Deliberation failed [${cycleError.cause}]: ${cycleError.message}`);\n  // Degrade: treat as if LLM unavailable (degradedNoLlm path)\n  executionResults.push({\n    content: '',\n    degradedNoLlm: true,\n  });\n}\n```\nDo not rethrow — the outer catch at line ~2270 currently rethrows (breaking the cycle). These inline catches contain the error and degrade gracefully so the cycle completes through LEARNING and the episode is written.\n\n**C. Detect HANDLER_NOT_FOUND** in the procedure execution loop at line ~1352 (the `for (const step of procedureData.actionSequence)` loop). After `const result = await this.actionHandlerRegistry.execute(step, cycleContext);`, add:\n```typescript\nif (result instanceof HandlerNotFoundError) {\n  cycleError = {\n    cause: 'HANDLER_NOT_FOUND',\n    message: result.message,\n    caughtAt: new Date().toISOString(),\n  };\n  this.logger.warn(`[TK-66] HANDLER_NOT_FOUND for step ${step.stepType}`);\n  // continue — null-result path already handles missing content downstream\n}\n```\nAdd the import of `HandlerNotFoundError` from the registry file at the top of decision-making.service.ts.\n\n**D. Pass cycleError to the encode call** at line ~1629:\n```typescript\nawait this.episodicMemory.encode(\n  {\n    source: episodeSource,\n    ...(visualContext !== null ? { visualContext } : {}),\n    driveSnapshot,\n    inputSummary,\n    actionTaken: actionId,\n    contextFingerprint,\n    embeddingVersion: EMBEDDING_VERSION,\n    attention,\n    arousal,\n    ...(this.currentTurnContext !== null ? {\n      speakerId: this.currentTurnContext.originator.userId,\n      speakerIsGuardian: this.currentTurnContext.originator.isGuardian,\n    } : {}),\n    // TK-66: thread the classified error context if this cycle hit a failure.\n    ...(cycleError !== undefined ? { cycleErrorContext: cycleError } : {}),\n  },\n  encodingDepth,\n);\n```"
