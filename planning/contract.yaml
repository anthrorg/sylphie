    title: Add HEALTHCHECK instruction to the production stage of Dockerfile
    intent: "Dockerfile, after EXPOSE 3000 (line 121) and before CMD (line 124), insert the following block (3 lines):\n\n```\nHEALTHCHECK --interval=30s --timeout=5s --start-period=60s --retries=3 \\\n  CMD wget -qSO- http://localhost:${PORT:-3000}/metrics/health || exit 1\n```\n\nRationale for each parameter:\n- `--interval=30s`: Railway polls every 30s — standard for a backend that does Prisma migrations on boot.\n- `--timeout=5s`: /metrics/health is a synchronous in-memory computation; 5s is generous.\n- `--start-period=60s`: docker-entrypoint.sh runs `prisma migrate deploy` before starting Node; 60s covers migrations + Nest bootstrap on a cold container.\n- `--retries=3`: Docker marks unhealthy after 3 consecutive failures (default), explicit here for legibility.\n- `wget -qSO-`: BusyBox wget (present in node:20-alpine without any apk install). `-q` suppresses output, `-S` prints server headers, `-O-` dumps body to stdout. Exits 0 on 2xx, non-zero on error — correct for a health probe. `|| exit 1` is explicit for clarity.\n- `${PORT:-3000}`: mirrors the app's own resolution: `process.env.PORT || process.env.APP_PORT || 3000` (apps/sylphie/src/main.ts:34). Railway injects PORT; fallback to 3000 is safe.\n\nDo NOT touch docker-compose.yml. Do NOT add a new health endpoint. Do NOT modify CMD or EXPOSE."
