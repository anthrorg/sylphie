    title: Return typed HandlerNotFoundError from ActionHandlerRegistryService.execute when no handler exists
    intent: "In `packages/decision-making/src/action-handlers/action-handler-registry.service.ts`, add a typed error class above the `@Injectable()` decorator (~line 88):\n\n```typescript\nexport class HandlerNotFoundError extends Error {\n  readonly stepType: string;\n  constructor(stepType: string, stepIndex: number) {\n    super(`No handler registered for step type: \"${stepType}\" (step index: ${stepIndex}).`);\n    this.name = 'HandlerNotFoundError';\n    this.stepType = stepType;\n  }\n}\n```\n\nThen in `execute()` at line 151, replace the `return null` path (lines 151-158) with:\n```typescript\nif (!handler) {\n  // TK-66: return a typed error so callers can detect HANDLER_NOT_FOUND without\n  // inspecting log output. Returning the error (not throwing) preserves the\n  // existing null-return contract shape — callers already check for null;\n  // a HandlerNotFoundError instance is truthy, so callers that do\n  // `if (!result)` still degrade correctly but can now narrow with instanceof.\n  return new HandlerNotFoundError(actionStep.stepType, actionStep.index) as any as Record<string, unknown>;\n}\n```\n\nNote: the return type is `Promise<Record<string, unknown> | null>`. To keep the signature clean, broaden it to `Promise<Record<string, unknown> | HandlerNotFoundError | null>` and update the `ActionStepHandler` type at line 79 to match. Callers in `decision-making.service.ts` already treat a non-null non-content result as a miss; the `HandlerNotFoundError` has no `content` key so the existing `if (result && typeof result['content'] === 'string')` guard at line ~1709 ignores it cleanly without change. The caller can additionally instanceof-check to log HANDLER_NOT_FOUND for TK-66 auditing (next task)."
