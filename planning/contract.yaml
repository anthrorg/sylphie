from:\n```\nconst scored = scoreCandidates(candidates, monologueParsed.intent, wkg);\n```\nto:\n```\nconst scored = scoreCandidates(candidates, monologueParsed.intent, wkg, this.scoringWeights);\n```\nAnd increment the counter immediately after:\n```\nthis.totalScoredSelections += 1;\n```"
