    title: Replace accept-A stub with test scaffold + helpers
    intent: "Replace the NOT_IMPLEMENTED stub at `test/e2e/vision/accept-A.e2e.ts` (created by TK-26) with the full test file. Write the header, const block, and three pure helper functions.\n\nAdd at the top of the file (lines 1-65 approx):\n```typescript\n/**\n * ACC.A — embeddings flow end-to-end (live)\n *\n * Acceptance criteria (TK-27):\n *   AC1: every confirmed track for mug/book has embedding.length === 768 (not null, not 1280)\n *   AC2a: intra-class cosine mean > inter-class cosine mean by >= MARGIN 0.05\n *   AC2b: mask-zeroing is active — a blank (all-black) frame produces a DIFFERENT embedding\n *         from the fixture frame (proves the mask path runs and DINOv2 sees object content)\n *\n * Prerequisites: TK-26 preflight green; TK-30 fixtures present.\n * Run: npx tsx test/e2e/vision/accept-A.e2e.ts\n */\n\nconst PERCEPTION_BASE = process.env.PERCEPTION_BASE ?? 'http://127.0.0.1:8430';\nconst OBJECT_EMBEDDING_DIM = 768;\nconst MARGIN = 0.05;\n// POST this many frames per object to drive tracker past min_confirm_frames=3.\nconst POST_COUNT = 4;\n\nimport * as fs from 'fs';\nimport * as path from 'path';\nimport { fileURLToPath } from 'url';\n\nconst __filename = fileURLToPath(import.meta.url);\nconst __dirname = path.dirname(__filename);\nconst FIXTURES = path.join(__dirname, '../../fixtures/vision');\n\nasync function postJpeg(buf: Buffer): Promise<any> {\n  const res = await fetch(`${PERCEPTION_BASE}/perception/detect`, {\n    method: 'POST',\n    headers: { 'Content-Type': 'image/jpeg' },\n    body: buf,\n  });\n  if (!res.ok) throw new Error(`POST /perception/detect HTTP ${res.status}: ${await res.text()}`);\n  return res.json();\n}\n\nfunction cosine(a: number[], b: number[]): number {\n  let dot = 0, na = 0, nb = 0;\n  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }\n  if (na === 0 || nb === 0) return 0;\n  return dot / (Math.sqrt(na) * Math.sqrt(nb));\n}\n\n/** POST buf POST_COUNT times; return all 768-D embeddings from confirmed tracks on the LAST response. */\nasync function confirmAndCollect(buf: Buffer, label: string): Promise<number[][]> {\n  let last: any;\n  for (let i = 0; i < POST_COUNT; i++) last = await postJpeg(buf);\n  const tracked = (last.tracked_objects ?? []) as any[];\n  const embeddings = tracked\n    .filter((t: any) => t.state === 'confirmed' && Array.isArray(t.embedding) && t.embedding.length === OBJECT_EMBEDDING_DIM)\n    .map((t: any) => t.embedding as number[]);\n  console.log(`  [${label}] confirmed_count=${last.scene_summary?.confirmed_count ?? '?'} 768-D embeddings=${embeddings.length}`);\n  return embeddings;\n}\n```"
