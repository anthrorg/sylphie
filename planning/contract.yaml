constitution:
  - { id: CON-1, kind: must,  rule: "Do the simplest thing that meets a ticket's acceptance_criteria; respect complexity_budget." }
  - { id: CON-2, kind: never, rule: "Pay curiosity/social relief for anything but durable knowledge/identity change (Invariant 1 / CANON Std 6)." }
  - { id: CON-3, kind: never, rule: "Use an online/drifting embedding backbone. Embedding changes are frozen + versioned + migration-gated phase transitions (Invariant 2)." }
  - { id: CON-4, kind: never, rule: "Let the world unconditionally command the decision loop. Vision triggers are settled-semantic-change only, rate-limited, habituating (Invariant 3)." }
  - { id: CON-5, kind: must,  rule: "Ship each improvement with its test; no phase closes without mythos live-smoke sign-off." }

vision:
  problem: >
    The CV path is built but dormant and untested. The richest visual signal (the EfficientNet/DINOv2
    track embedding) is computed then discarded at the cognitive boundary, so visually-distinct same-COCO
    scenes collapse to near-identical latents; vision-only scenes are unrecallable; and there is no
    integrated vision test suite.
  outcome: >
    Vision is promoted into cognition end-to-end — distinguishable in the fused latent, recallable by
    cosine, and able to trigger habituating, rate-limited cycles — behind versioned destructive migrations,
    with a 7-layer test suite, all verified on a live run.
  measurable_goals:
    - "Two same-COCO scenes (mug-vs-book) produce a fused-latent cosine gap > margin (bounded both directions)."
    - "Embedding-null rate on visual_object_embeddings ≈ 0 over a 10-min live window."
    - "Same object across a NestJS power-cycle re-binds to the SAME :VisualObject node (sighting_count>=2)."
    - "A vision-only frame fires a SYSTEM_TRIGGER cycle; a static busy scene habituates (no fixation)."
    - "Zero relief deltas on action_type='ScenePrediction' drive events (CANON Std 6)."

non_goals:
  - { id: NG-1, statement: "SAM 3.1 stateful perception-core swap.", rationale: "Impossible on the substrate (no checkpoint/push API); parked, separately scoped." }
  - { id: NG-2, statement: "Booting the dead PerceptionPipeline camera-loop.", rationale: "Promote the stateless A.5 scorer into a NestJS BindingService instead; Python file stays reference spec." }
  - { id: NG-3, statement: "Live-wiring Neo4jGraphPersistence into the /detect path.", rationale: "Jim decision: class-correct + round-trip only; the live re-bind path runs NestJS-side via Neo4jService." }

constraints:
  - { id: CST-1, statement: "torch is CPU-only; DINOv2-base ~69ms/crop. Keep /detect YOLO-dominated via confirm-gate + every-Nth re-embed throttle (COBEING_PERCEPTION_EMBED_EVERY_N)." }
  - { id: CST-2, statement: "Per-modality embedding dims: object 768 (DINOv2) / face 512 (ArcFace). NOT uniform. Two independent dim constants + migration versions." }
  - { id: CST-3, statement: "Drive isolation: zero vision symbols importable from packages/drive-engine; raw-signal-in only; axis+delta computed in-child." }

tech_stack:
  - { id: TECH-1, name: "DINOv2-base", version: "768-D", rationale: "Object embedding backbone; 768==fused EMBEDDING_DIM so JL projection is deleted.", decision_ref: DEC-5 }
  - { id: TECH-2, name: "ArcFace/InsightFace", version: "512-D (buffalo_l)", rationale: "Face embedding backbone; unmasked crop.", decision_ref: DEC-5 }

