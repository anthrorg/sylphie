  - id: TK-85
    kind: ticket
    parent: EP-16
    pr_url: "https://github.com/anthrorg/sylphie/pull/30"
    branch: "agent/tk-85-ws555-face---type-1-reflex"
    status: done
    verification_note: "POC done: PersonScopedFaceIndex structural isolation proven (13/13 spec incl. Person-A-face-invisible-to-Person-B); faces never enter shared hotLayer, dropped-with-warning when no groundingPersonId. Residual: in-memory only (prototype); DB persistence is a follow-on ticket."
    priority: P2
    estimate: L
    engineering_level: prototype
    title: 'WS5.5.5 — face -> Type-1 reflex behind a person-scoped privacy gate (POC: prove isolation before any face write)'
    intent: 'Promote a recognized face to a Type-1 reflex. The blocker is privacy, not mechanics: latent-space.service.ts:645-650 DELIBERATELY DROPS face embeddings (Wave 3 C6 — faces carry identity/privacy weight). The POC must find a person-scoped face index that lets a face graduate to a reflex WITHOUT becoming a cross-person grounding leak (the §2.8 hazard one modality over). No write-path AC is committed until the POC answers it (AD-0020).'
    complexity_budget: POC spike first (<=1d); build only if the privacy gate is proven, then <=300 LOC for a scoped face index + Type-1 reuse
    acceptance_criteria:
    - given: the POC concludes a privacy-safe isolation exists
      when: a recognized face recurs N times within a person scope
      then: its embedding is written to a PERSON-SCOPED face index (never the shared conversational latent index) and graduates via the existing type1-tracker path; a face seen with Person A can NEVER ground/reflex for Person B (regression asserts the scope boundary)
    - given: the POC concludes no privacy-safe scope exists
      when: the ticket closes
      then: the item is DEFERRED with the isolation finding recorded; no face write ships (the Wave 3 C6 drop is retained)
    files_in_scope:
    - packages/decision-making/src/latent-space/latent-space.service.ts
    - packages/decision-making/src/graduation/type1-tracker.service.ts
    non_goals:
    - Writing faces to the shared conversational latent index; cross-person face grounding; a face-management UI
    depends_on:
    - TK-81
    poc:
      question: 'Two sub-questions. (1) PRIVACY: under what isolation can a face embedding be stored and graduated to a Type-1 reflex without becoming a cross-person grounding leak (the section-2.8 hazard one modality over) — is a person-scoped face index (analogous to :Candidate grounding_person_id) sufficient and does it keep faces out of the shared latent index? (2) ANCHOR (DEC-23): the graduation anchor MUST be a face-scoped procedure node in the person-scoped OKG — type1-tracker must NOT be extended to accept an opaque key disconnected from a learned procedure (that breaks the Type-1 graduation invariant). Is such a face-scoped procedure-node anchor feasible?'
      hypothesis: A person-scoped face index, excluded from the shared conversational latent read-path exactly as :Candidate is excluded from WKG grounding, lets faces graduate safely; the type1-tracker graduation reuse against a face-scoped procedure node in the person-scoped OKG (NOT an opaque key) is the cheap part and carries no new privacy risk.
      status: proven
      result: |
        PROVEN on both sub-questions. PRIVACY isolation is structurally complete and the person-scoped face index is sufficient. TASK-748 latent-space.service.ts writeMultiModal lines 650 to 661 guards modality drives or faces, increments droppedModalityWrites, warns once, then continues at line 660, so no face row ever reaches write or learned_patterns; searchByModality lines 326 to 430 has no faces case and filters this.hotLayer by entry.modality, so a faces query matches zero rows and returns null at line 373. TASK-749 face_embeddings is person-scoped with person_id TEXT NOT NULL at line 661 and a person index at lines 679 to 681; saveSnapshot at line 526 writes only the OKG FaceSnapshot node plus the face_embeddings INSERT at line 570, never learned_patterns; identifyFace at line 225 and matchFace at line 259 iterate only this.centroids; imports are only nestjs, sylphie shared, and crypto, so there is no LatentSpaceService type, no this.hotLayer, and no learned_patterns reference. TASK-750 all five production call sites, scene-event-detector lines 83 and 170 and visual-working-memory lines 404, 450, and 554, use the returned personId only to label the current track or entity, which is case a. decision-making.service.ts has zero references to identifyFace, matchFace, or faceEmbedding; the groundingPersonId write at lines 1838 to 1844 derives currentSpeakerId from frame.raw person_model personId, which communication.service.ts at lines 370 to 372 sets via getPersonModelForTurn userId, the JWT speaker, NOT the vision face identity. groundingPersonId is world-scoped null only when responseGroundedBy equals WKG at line 1844; a face-identified personId is on a disjoint path and cannot reach that branch, so it cannot yield a GROUNDED world-scoped pattern. No leak path exists. ANCHOR is feasible. TASK-751 recordObservation procedureId mae confidence at line 121 keys purely on procedureId via getOrCreate at line 167, minting a fresh in-memory record for any string with no learned_patterns lookup; isGraduated at lines 155 to 157 reads only the in-memory records Map. The tracker is a pure in-memory state machine over an opaque procedureId and structurally requires no learned_patterns entry; the latent-match caller at decision-making line 997 is just one caller. A face-scoped OKG procedure node id can be passed directly to recordObservation without any learned_patterns write. Design caveat for the dependent build, not a blocker, enforce that the anchor is a real face-scoped procedure node in the person-scoped OKG and do not extend type1-tracker to take an opaque key disconnected from a learned procedure, since the tracker today accepts any string indiscriminately.
