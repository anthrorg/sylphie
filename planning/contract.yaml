    title: Write simulation.service.spec.ts covering all four AC scenarios
    intent: "Create packages/planning/src/pipeline/simulation.service.spec.ts as a zero-dependency tsx spec (same runner pattern as constraint-checks.spec.ts — `npx tsx ...`, `import assert from 'node:assert/strict'`).\n\nThe spec must exercise `evaluateCategory` indirectly via `simulate()` by mocking `TimescaleService.query`. Use the `SimulationService` class directly (new SimulationService(mockTimescale)).\n\nFour test cases (matching the two ACs exactly):\n\n--- AC1 CASE A: count=1, successRate=1.0 ---\nquery returns: [{ payload: JSON.stringify({ driveEffects: { curiosity: -0.1 }, outcome: 'positive' }), count: '1' }]\nAssert: confidenceEstimate < 0.2\n(shrinkage: 1/(1+10)=0.0909)\n\n--- AC1 CASE B: count=50, successRate=1.0 ---\nquery returns: [{ payload: JSON.stringify({ driveEffects: { curiosity: -0.1 }, outcome: 'positive' }), count: '50' }]\nAssert: confidenceEstimate > 0.7\n(shrinkage: 50/(50+10)=0.833)\n\n--- AC1 CASE C: count=0 ---\nquery returns: [] (empty rows)\nAssert: confidenceEstimate === 0, riskScore === 1.0\n\n--- AC2 CASE A: high-variance effects [-0.9, +0.3, -0.3] ---\nquery returns 3 rows with count '1' each, outcome 'negative' (successCount=0):\n  [{ payload: JSON.stringify({ driveEffects: { curiosity: -0.9 }, outcome: 'negative' }), count: '1' },\n   { payload: JSON.stringify({ driveEffects: { curiosity: 0.3  }, outcome: 'negative' }), count: '1' },\n   { payload: JSON.stringify({ driveEffects: { curiosity: -0.3 }, outcome: 'negative' }), count: '1' }]\nAssert: riskScore > 0.5\n(stdDev≈0.49, shrinkConf=0/(3+10)=0 → risk=min(1, 0.49+0.5)=0.99)\n\n--- AC2 CASE B: low-variance effects [-0.3, -0.3, -0.3], successRate=1.0 (n=10) ---\nquery returns 1 row with count '10', all positive:\n  [{ payload: JSON.stringify({ driveEffects: { curiosity: -0.3 }, outcome: 'positive' }), count: '10' }]\nAssert: riskScore < 0.3\n(stdDev=0, shrinkConf=10/(10+10)=0.5 → risk=min(1, 0+0.25)=0.25)\n\nThe mock timescale must return the right rows per category. Since CANDIDATE_CATEGORIES has 5 entries, mock query to return the target rows ONLY for 'ConversationalResponse' and return [] for all others — this keeps only one outcome in the result. Extract that outcome by asserting outcomes.length >= 1 and reading outcomes[0].\n\nAdd a run-if-main block at the bottom: `if (process.argv[1] === fileURLToPath(import.meta.url)) { ... }`."
