validator')` resolved to `/app/packages/drive-engine/dist/ipc-channel/ipc-message-validator.js` and `require('@sylphie/drive-engine/drive-process/message-transport')` loaded (exporting IpcTransport) — proving the exports field alone is sufficient. Caveat on the drive-server boot leg: `node apps/drive-server/dist/main.js` failed with `Error: Cannot find module '/app/apps/drive-server/dist/main.js'` (code MODULE_NOT_FOUND), but this is NOT a subpath/exports failure and NOT caused by removing the cp lines — the production Dockerfile never COPYs apps/drive-server/dist into the image (only apps/sylphie/dist is copied, line 109), so the drive-server entrypoint is simply absent from the production target regardless of the cp hack. (TASK-236) Dockerfile fully reverted to its original 6-line cp block; `git diff --stat Dockerfile` shows no change and the test image was removed. Net: deleting the cp hack is safe; recommend also fixing the stale exports comment, and separately noting that drive-server is not shipped in the production image." },
