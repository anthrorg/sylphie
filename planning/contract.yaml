    title: Add buildReflectionPrompt tests to the spec file
    intent: "Append a second `describe` block to `packages/learning/src/pipeline/conversation-reflection.service.spec.ts` after the closing brace of the existing `computeGroundedConfidence` describe block (after line 149). Add the import at the top alongside the existing import:\n\n```typescript\nimport { computeGroundedConfidence, buildReflectionPrompt } from './conversation-reflection.service';\n```\n\n(Replace the existing import on line 14 with this expanded version.)\n\nThen append after line 149:\n\n```typescript\n// ---------------------------------------------------------------------------\n// buildReflectionPrompt — windowed sampling (TK-52)\n// ---------------------------------------------------------------------------\n\n/** Minimal SessionEvent factory for prompt tests. */\nfunction makeEvents(count: number, charsEach = 10): Array<{\n  id: string; type: string; timestamp: Date; subsystem: string; content: string;\n}> {\n  return Array.from({ length: count }, (_, i) => ({\n    id: `e${i}`,\n    type: 'RESPONSE_GENERATED',\n    timestamp: new Date(Date.UTC(2026, 0, 1, 0, i, 0)),\n    subsystem: 'COGNITION',\n    content: 'x'.repeat(charsEach),\n  }));\n}\n\n/** Rough char cost of one formatted event line (HH:MM:SS + role + content). */\nconst LINE_OVERHEAD = '[00:00:00] (SYLPHIE) '.length; // 21 chars\n\ndescribe('buildReflectionPrompt', () => {\n  describe('within-budget session', () => {\n    it('includes all events when total fits within MAX_CONVERSATION_CHARS', () => {\n      // 10 events × (10 content + 21 overhead) = 310 chars — well within 8000\n      const events = makeEvents(10, 10);\n      const prompt = buildReflectionPrompt(events, []);\n      // All 10 lines should appear in the timeline\n      expect((prompt.match(/\\[00:/g) || []).length).toBe(10);\n    });\n\n    it('handles two-event trivial case without throwing', () => {\n      const events = makeEvents(2, 10);\n      expect(() => buildReflectionPrompt(events, [])).not.toThrow();\n      const prompt = buildReflectionPrompt(events, []);\n      expect((prompt.match(/\\[00:/g) || []).length).toBe(2);\n    });\n\n    it('handles zero-event edge case without throwing', () => {\n      expect(() => buildReflectionPrompt([], [])).not.toThrow();\n    });\n  });\n\n  describe('over-budget session (windowed sampling)', () => {\n    // Each event: 10-char content + overhead ≈ 31 chars.\n    // To force windowing we need totalChars > 8000.\n    // 300 events × 31 = 9300 chars → over budget.\n    const OVER_N = 300;\n\n    it('produces a prompt whose timeline portion is <= MAX_CONVERSATION_CHARS', () => {\n      const events = makeEvents(OVER_N, 10);\n      const prompt = buildReflectionPrompt(events, []);\n      // The header lines are outside MAX_CONVERSATION_CHARS, so just check that\n      // the number of timeline-entry chars is bounded.\n      const timelineLines = prompt\n        .split('\\n')\n        .filter((l) => l.startsWith('['));\n      const timelineChars = timelineLines.reduce((s, l) => s + l.length, 0);\n      expect(timelineChars).toBeLessThanOrEqual(8000);\n    });\n\n    it('includes events from the head of the session', () => {\n      const events = makeEvents(OVER_N, 10);\n      // First event: minute 0 → timestamp 00:00:00\n      const prompt = buildReflectionPrompt(events, []);\n      expect(prompt).toContain('[00:00:00]');\n    });\n\n    it('includes events from the tail of the session', () => {\n      const events = makeEvents(OVER_N, 10);\n      // Last event: minute 299 → 04:59:00\n      const prompt = buildReflectionPrompt(events, []);\n      expect(prompt).toContain('[04:59:00]');\n    });\n\n    it('includes events from the middle of the session', () => {\n      const events = makeEvents(OVER_N, 10);\n      // Pure head-only would stop ~minute 86 (head third);\n      // pure tail-only would start ~minute 200.\n      // A middle sample should include something in the 100-199 range.\n      const prompt = buildReflectionPrompt(events, []);\n      const midMatch = prompt.match(/\\[(01|02|03):\\d\\d:\\d\\d\\]/g);\n      expect(midMatch).not.toBeNull();\n      expect(midMatch!.length).toBeGreaterThan(0);\n    });\n\n    it('does not repeat events (chronological order, no duplicates)', () => {\n      const events = makeEvents(OVER_N, 10);\n      const prompt = buildReflectionPrompt(events, []);\n      const timestamps = (prompt.match(/\\[\\d\\d:\\d\\d:\\d\\d\\]/g) || []);\n      const unique = new Set(timestamps);\n      // Allow collisions only on same-minute events (there are none here)\n      expect(timestamps.length).toBe(unique.size);\n    });\n  });\n\n  describe('known entities', () => {\n    it('appends entity section when knownEntities is non-empty', () => {\n      const events = makeEvents(2, 5);\n      const prompt = buildReflectionPrompt(events, ['Alice', 'Bob']);\n      expect(prompt).toContain('Alice, Bob');\n    });\n\n    it('omits entity section when knownEntities is empty', () => {\n      const events = makeEvents(2, 5);\n      const prompt = buildReflectionPrompt(events, []);\n      expect(prompt).not.toContain('knowledge graph');\n    });\n  });\n});\n```"
