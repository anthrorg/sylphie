    status: todo
    title: Replace head-only loop in buildReflectionPrompt with head+middle+tail sampling
    intent: "In `packages/learning/src/pipeline/conversation-reflection.service.ts`, replace the body of `buildReflectionPrompt` (lines 712–749, from `const lines: string[] = [];` through the closing `].join('\\n');`) with the following implementation. Leave the function signature and JSDoc unchanged.\n\n```typescript\n  const n = events.length;\n\n  // Fast path: if all events fit within budget, include them all.\n  const allLines = events.map((event) => {\n    const time = event.timestamp.toISOString().substring(11, 19);\n    const role = resolveRole(event.type, event.subsystem);\n    const content = event.content || `[${event.type}]`;\n    return `[${time}] (${role}) ${content}`;\n  });\n  const totalChars = allLines.reduce((sum, l) => sum + l.length, 0);\n\n  let selectedLines: string[];\n  if (totalChars <= MAX_CONVERSATION_CHARS) {\n    selectedLines = allLines;\n  } else {\n    // Windowed sampling: ~33% head + ~33% evenly-sampled middle + ~33% tail.\n    // Index bands are computed on event count; the char budget is then applied\n    // as a hard truncation on the assembled line list.\n    const third = Math.floor(n / 3);\n    const headEnd = third;              // [0, headEnd)\n    const tailStart = n - third;        // [tailStart, n)\n\n    const headIndices = Array.from({ length: headEnd }, (_, i) => i);\n    const middleIndices = sampleEvenly(headEnd, tailStart, third);\n    const tailIndices = Array.from({ length: n - tailStart }, (_, i) => tailStart + i);\n\n    // Merge in chronological order, deduplicate (handles n<3 edge cases).\n    const seen = new Set<number>();\n    const merged: number[] = [];\n    for (const idx of [...headIndices, ...middleIndices, ...tailIndices]) {\n      if (!seen.has(idx)) { seen.add(idx); merged.push(idx); }\n    }\n    merged.sort((a, b) => a - b);\n\n    selectedLines = merged.map((i) => allLines[i]);\n  }\n\n  // Apply char budget: include lines until exhausted; truncate the one that spills.\n  const lines: string[] = [];\n  let charBudget = MAX_CONVERSATION_CHARS;\n  for (const line of selectedLines) {\n    if (charBudget <= 0) break;\n    if (line.length <= charBudget) {\n      lines.push(line);\n      charBudget -= line.length;\n    } else {\n      lines.push(line.substring(0, charBudget) + '...');\n      charBudget = 0;\n    }\n  }\n\n  const duration = events.length >= 2\n    ? describeDuration(events[0].timestamp, events[events.length - 1].timestamp)\n    : 'unknown duration';\n\n  const entitySection = knownEntities.length > 0\n    ? `\\nKnown entities already in the knowledge graph for this session:\\n${knownEntities.join(', ')}`\n    : '';\n\n  return [\n    `Analyze the following completed conversation for holistic insights.`,\n    `The conversation had ${events.length} events over ${duration}.`,\n    '',\n    'Conversation timeline:',\n    ...lines,\n    entitySection,\n  ].join('\\n');\n```\n\nThe `sampleEvenly` helper (added in Task 1) must be defined before this function in the file."
