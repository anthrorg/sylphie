    intent: "Create `test/fixtures/vision/seed_neo4j.cypher` (new file). The Cypher must be idempotent (MERGE) and set exactly the properties VWM `createUndiscoveredNode` sets (visual-working-memory.service.ts:790-806). Content:\n\n```cypher\n// TK-30 seed: one deterministic :VisualObject node in the WORLD graph for acceptance tests.\n// Idempotent: MERGE on node_id so re-runs are safe.\n// Run against WORLD Neo4j (bolt://localhost:7687, user neo4j, pw sylphie_world):\n//   cypher-shell -u neo4j -p sylphie_world -a bolt://localhost:7687 < test/fixtures/vision/seed_neo4j.cypher\n\nMERGE (n:Entity:VisualObject {node_id: 'vobj-tk30seed01'})\nON CREATE SET\n  n.label = 'cup',\n  n.node_type = 'VisualObject',\n  n.schema_level = 'instance',\n  n.provenance_type = 'SENSOR',\n  n.confidence = 0.40,\n  n.discovered = false,\n  n.yolo_class = 'cup',\n  n.sighting_count = 1,\n  n.synthetic = false,\n  n.bounding_box = '[0.2,0.3,0.5,0.6]',\n  n.dominant_colors = '[[120,80,40]]',\n  n.object_crop_b64 = null,\n  n.embedding_version = 2,\n  n.created_at = datetime()\nRETURN n.node_id AS id, n.provenance_type AS provenance, n.confidence AS confidence;\n```\n\nThe `node_id` matches the Timescale row's `node_id` (`vobj-tk30seed01`) so a later ACC.B test can cross-reference both stores by the same stable key. The RETURN clause lets the runner confirm the node was created without a separate query."
