    intent: 'Close the WS4 T8 blind spot: a hostile/aggressive inbound message has NO path to threat-driven arousal today (rules.ts has no hostility entry). Add an InboundHostility metadata-scaled action type mapping hostility magnitude to Anxiety+Social PRESSURE (no relief), detected by reusing the deterministic lexical affect scorer, emitted as an ActionOutcome (push, never an RPC into the drive). actionType is z.string() so NO validator schema change (AD-0019).'
    complexity_budget: '<=180 LOC: rules.ts entry + METADATA_SCALED_ACTION_TYPES addition + an app-side emitter reusing theater-affect-scorer; no IPC schema change'
    acceptance_criteria:
    - given: an inbound message with strong negative valence + magnitude above the hostility threshold scored by the lexical affect scorer
      when: the emitter runs
      then: 'an ActionOutcome (actionType=''InboundHostility'', metadata.hostilityMagnitude in [0,1]) is pushed to the drive engine over the existing IPC ACTION_OUTCOME path; metadata.hostilityMagnitude SURVIVES validation (the additive z.number().min(0).max(1).optional() field per DEC-24 — not stripped by the z.object() metadata schema) and reaches computeDefaultAffect'
    - given: InboundHostility with magnitude m
      when: computeDefaultAffect runs
      then: Anxiety and Social receive PRESSURE scaled by m (positive deltas); NO relief (negative) delta on any axis — assert zero relief, matching the event-only no-decay drive model (drives.ts:84)
    - given: a neutral or positive inbound message
      when: scored
      then: no InboundHostility outcome is emitted (below threshold); the drive is not perturbed
    files_in_scope:
    - packages/drive-engine/src/constants/rules.ts
    - packages/drive-engine/src/constants/rules.spec.ts
    - packages/drive-engine/src/ipc-channel/ipc-message-validator.ts
    - apps/sylphie/src/services/theater-affect-scorer.ts
    - apps/sylphie/src/services/communication.service.ts
    non_goals:
    - A dedicated trained sentiment classifier; relief-capable hostility (reward-away of threat); per-source habituation in v1
    - 'IPC actionType stays z.string() (no new enum). Per DEC-24/AD-0035 the metadata sub-schema DOES gain an additive optional hostilityMagnitude field — that is in scope, not a schema freeze.'
    poc:
      question: Which drives, and what magnitude curve, should inbound hostility move — and is the lexical affect scorer's negative-valence+magnitude a sufficient, non-theatrical hostility signal?
      hypothesis: Anxiety + Social PRESSURE scaled by the lexical hostility magnitude is sufficient and non-theatrical; no separate classifier is needed for v1.
      status: confirmed
      result: "Hypothesis confirmed. Drives: Anxiety + Social, PRESSURE only (no relief), scaled by magnitude in [0,1]. Signal: lexical affect scorer's negative-valence+magnitude is sufficient for v1 (DEC-22). Ticket defines the full build; no blocking POC work needed before build."

