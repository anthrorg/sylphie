    title: Update the narration-builder spec for the async signature and null-sidecar assertions
    intent: "packages/supervisor/src/narration-builder.service.spec.ts\n\nAll three `check` blocks call `b.buildNarration(...)` synchronously. Because `buildNarration` is now async, every call-site must `await` it. Also, the spec constructs `new NarrationBuilderService()` with no args; the new constructor accepts zero args (default null), so construction stays unchanged.\n\n1. Make each `check` callback async and await the calls:\n\nLine 56–60 — replace:\n```ts\ncheck('first narration carries a sampleCount=0 baseline', () => {\n  const b = new NarrationBuilderService();\n  const n = b.buildNarration(makeCycle('TYPE_1', 'a', 10));\n```\nwith:\n```ts\ncheck('first narration carries a sampleCount=0 baseline', async () => {\n  const b = new NarrationBuilderService();\n  const n = await b.buildNarration(makeCycle('TYPE_1', 'a', 10));\n```\n\nLine 64–71 — replace the three `b.buildNarration(...)` calls and the fourth:\n```ts\ncheck('baseline reflects the prior-cycle window', async () => {\n  const b = new NarrationBuilderService();\n  await b.buildNarration(makeCycle('TYPE_1', 'a', 10, 0.2));\n  await b.buildNarration(makeCycle('TYPE_1', 'a', 20, 0.4));\n  await b.buildNarration(makeCycle('TYPE_2', 'b', 30, 0.6));\n  const n = await b.buildNarration(makeCycle('SHRUG', 'c', 40, 0.8));\n```\n\nLine 89–96 — replace:\n```ts\ncheck('baseline window stays bounded under many cycles', async () => {\n  const b = new NarrationBuilderService();\n  let n: any;\n  for (let i = 0; i < 200; i++) {\n    n = await b.buildNarration(makeCycle('TYPE_1', 'a', 10, 0.1));\n  }\n```\n\n2. Add two new checks at the end (before the final console.log), asserting the two acceptance criteria:\n```ts\ncheck('sidecar valid state: convergenceScore=1/(1+0.2), panelDivergenceScores non-null', async () => {\n  const fakeSidecar = {\n    getModelState: async () => ({\n      total_parameters: 1000,\n      training_active: false,\n      training_steps: 10,\n      training_loss: 0.2,\n      bootstrap_mode: 'off',\n      models: {\n        global: { params: 500 },\n        panels: { safety: { params: 100 }, intent: { params: 150 } },\n        convergence: { params: 50 },\n        deliberation: {\n          pragmatist: { params: 50 },\n          conservative: { params: 50 },\n          advocate: { params: 50 },\n          synthesis: { params: 50 },\n        },\n      },\n    }),\n  } as any;\n  const b = new NarrationBuilderService(fakeSidecar);\n  const n = await b.buildNarration(makeCycle('TYPE_1', 'a', 10));\n  assert.ok(Math.abs(n.convergenceScore! - 1 / 1.2) < 1e-9, 'convergenceScore=1/(1+0.2)');\n  assert.ok(n.globalModelConfidence != null, 'globalModelConfidence non-null');\n  assert.ok(n.panelDivergenceScores != null, 'panelDivergenceScores non-null');\n  assert.strictEqual(n.panelDivergenceScores!['safety'], 100);\n});\n\ncheck('sidecar null: all three fields undefined, no exception', async () => {\n  const nullSidecar = { getModelState: async () => null } as any;\n  const b = new NarrationBuilderService(nullSidecar);\n  const n = await b.buildNarration(makeCycle('TYPE_1', 'a', 10));\n  assert.strictEqual(n.convergenceScore, undefined);\n  assert.strictEqual(n.globalModelConfidence, undefined);\n  assert.strictEqual(n.panelDivergenceScores, undefined);\n});\n```"
