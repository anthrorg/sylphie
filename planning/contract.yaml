    intent: "In `packages/perception-service/cobeing/layer3_knowledge/inference_query.py`, replace lines 1286-1292 (inside `_check_depth_advancement`) — the entire block that reads:\n\n```python\n    # Depth 4+ requires E5 inner monologue\n    if current_depth >= DEFAULT_INFERENCE_ARCHITECTURAL_MAX:\n        if not e5_prerequisite_met:\n            return current_depth\n        # E5 is available -- could advance to 4 or 5\n        # For now, depth 4+ advancement criteria are not defined in E3\n        return current_depth\n```\n\nReplace with:\n\n```python\n    # Depth 4+ requires E5 inner monologue\n    if current_depth >= DEFAULT_INFERENCE_ARCHITECTURAL_MAX and not e5_prerequisite_met:\n        return current_depth\n\n    if current_depth == 3:\n        # Check depth 4 unlock criteria (E5 prerequisite already confirmed above)\n        required_success_rate = float(\n            props.get(\"depth_4_success_rate\", DEFAULT_DEPTH4_SUCCESS_RATE)\n        )\n        required_confirmed = int(\n            props.get(\"depth_4_min_confirmed\", DEFAULT_DEPTH4_MIN_CONFIRMED)\n        )\n\n        success_rate = _compute_inference_success_rate(\n            neo4j_session, max_depth=3\n        )\n        confirmed_count = _count_confirmed_inferences(neo4j_session, max_depth=3)\n\n        _log.debug(\n            \"inference_query depth advancement check (3->4): \"\n            \"success_rate=%.2f/%.2f confirmed=%d/%d e5_met=%s\",\n            success_rate,\n            required_success_rate,\n            confirmed_count,\n            required_confirmed,\n            e5_prerequisite_met,\n        )\n\n        if (\n            success_rate >= required_success_rate\n            and confirmed_count >= required_confirmed\n        ):\n            await _update_depth_rule(persistence, depth_rule_node, new_depth=4)\n            return 4\n\n    elif current_depth == 4:\n        # Check depth 5 unlock criteria\n        required_success_rate = float(\n            props.get(\"depth_5_success_rate\", DEFAULT_DEPTH5_SUCCESS_RATE)\n        )\n        required_confirmed = int(\n            props.get(\"depth_5_min_confirmed\", DEFAULT_DEPTH5_MIN_CONFIRMED)\n        )\n\n        success_rate = _compute_inference_success_rate(\n            neo4j_session, max_depth=4\n        )\n        confirmed_count = _count_confirmed_inferences(neo4j_session, max_depth=4)\n\n        _log.debug(\n            \"inference_query depth advancement check (4->5): \"\n            \"success_rate=%.2f/%.2f confirmed=%d/%d\",\n            success_rate,\n            required_success_rate,\n            confirmed_count,\n            required_confirmed,\n        )\n\n        if (\n            success_rate >= required_success_rate\n            and confirmed_count >= required_confirmed\n        ):\n            await _update_depth_rule(persistence, depth_rule_node, new_depth=5)\n            return 5\n```\n\nThe new depth-3 block is ordered AFTER the existing depth-1 (line 1294) and depth-2 (line 1333) elif branches — insert it as a new `elif current_depth == 3:` block and `elif current_depth == 4:` block after the existing `elif current_depth == 2:` block that ends at line 1364. The guard at the top (`>= DEFAULT_INFERENCE_ARCHITECTURAL_MAX and not e5_prerequisite_met`) short-circuits before reaching these new elif branches only when depth is already 3 and E5 is not met — but `DEFAULT_INFERENCE_ARCHITECTURAL_MAX = 3` means depth==3 is already at the ceiling for non-E5 mode, so the guard fires. Once E5 is met, depth==3 falls through the guard (condition is False) and enters the new `elif current_depth == 3:` branch. This is load-bearing: placement must come after the `elif current_depth == 2:` block at line 1333."
