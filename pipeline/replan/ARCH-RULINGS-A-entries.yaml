  - id: AD-A1
    date: 2026-07-06
    title: "Item 20260702-011 Q1 ruled: consolidation reuses the :Insight label/shape (additive insight_source + DERIVED_FROM), shared atlas writer contract; trigger is an idle-injected executor action (CycleGuard-serialized), NOT a second driveState$ subscriber; cap 0.45"
    status: accepted
    context: >
      Consolidation-loop replan fork: extend the done EP-12 CognitiveAwareness
      pipeline in packages/learning vs a new WKG label with a coordinated second
      trigger. Verified: the pressure subscriber (learning.service.ts:263-276)
      fires the MAINTENANCE cycle, not synthesis (30-min timer, :230-238);
      cross-session-synthesis's confabulation guards are conversation-pair-
      specific (:124-127, :441-487); WORLD maintenance is keyed to :Insight
      (prune-protect confidence-decay.service.ts:242); the episodic store is
      deliberately local to DecisionMakingModule (episodic-memory.service.ts:4-7);
      an idle-injection precedent exists (decision-tick-engine.service.ts:312-336).
    decision: >
      One label, one shape, two producers. Reuse :Insight + InsightType; additive
      schema (insight_source discriminator, DERIVED_FROM->(:Theory) edges,
      source_episode_ids property) via item 015's migration framework; atlas owns a
      shared insight-writer contract used by both producers; cross-session-synthesis
      is NOT extended to episodic/theory candidates. The consolidation loop lives in
      decision-making and triggers as a synthetic executor action injected on idle
      self-ticks (executor IDLE + CognitiveAwareness over threshold), serialized by
      CycleGuard — replacing the staged "shared in-flight guard" AC. Confidence:
      INFERENCE base 0.30, capped at the existing 0.45 SYNTHESIS_CONFIDENCE_CAP.
      CognitiveAwareness relief rides a real action outcome (new ACTION_TYPE_DEFAULTS
      entry), only on cycles that wrote >=1 insight. "Re-weight confidence" is
      subsumed by MERGE-raises-only (up) + item 018's sanctioned verdict path (down);
      no dedicated re-weighting mechanism.
    rationale: >
      A second insight label silently escapes decay/prune/synthesis semantics (ELSE
      0.05 decay, unknown prune) — the exact drift item 015 exists to prevent; the
      action-injection trigger resolves the trigger race structurally (one cycle at
      a time) with zero new coordination machinery and stays push-only into drives.
    alternatives:
      - option: Extend cross-session-synthesis candidate sources (fork option a)
        rejected_because: Rewrites conversation-pair-specific confabulation guards; violates the item's own reuse-don't-rewrite non-goal.
      - option: New :ConsolidationInsight label + second coordinated driveState$ subscriber (fork option b)
        rejected_because: Schema bifurcation of insight-kind knowledge + a bespoke cross-package coordination mechanism where CycleGuard already serializes actions.
    consequences: >
      Tickets re-derived: -a = additive :Insight extension + shared writer; -b =
      tick-engine injection trigger; -c cap 0.45; -d demotion rides 018's verdict
      path; new small drive ticket for the relief entry. Chain 008->015->018->011
      unchanged; nothing queues before those land.
    canon: "none — drive isolation (push/action-mediated), 0.60 ceiling (0.45 cap), theater (relief only on real writes) all upheld"
    evidence:
      - packages/learning/src/learning.service.ts:263
      - packages/learning/src/learning.service.ts:230
      - packages/learning/src/pipeline/cross-session-synthesis.service.ts:83
      - packages/learning/src/pipeline/cross-session-synthesis.service.ts:441
      - packages/learning/src/pipeline/confidence-decay.service.ts:242
      - packages/decision-making/src/episodic-memory/episodic-memory.service.ts:4
      - packages/decision-making/src/tick-engine/decision-tick-engine.service.ts:312
