  - id: AD-A4
    date: 2026-07-06
    title: "Item 20260702-018 ruled: TESS_CONFIRMED stays within the 0.60 non-guardian ceiling (promotion min(0.60, 0.35+0.25*tess_conf), decay 0.03 in all three decay CASE sites); Tess transport = async file-drop outbox/inbox with versioned request/verdict payloads; above-ceiling Tess would be a CANON change reserved to Jim"
    status: accepted
    context: >
      Theory-loop replan, two forks. Verified: the only above-0.60 path is guardian
      confirmation at 0.90 under Std-5 (provenance.types.ts:184-194); non-guardian
      evidence tops out at exactly 0.60 (deriveOkgFactTier :220-244);
      confidence-decay has three CASE sites whose ELSE 0.05 would silently defeat
      'decays slowly' (confidence-decay.service.ts:140,197,294);
      detectHallucinatedKnowledge matches (n:Entity) only
      (attractor-monitor.service.ts:369-394) so quarantined :Theory writes cannot
      trip it by volume; Tess has zero repo prior art; verdicts are inherently
      asynchronous (10-stage Beta pipeline).
    decision: >
      (1) New extended provenance TESS_CONFIRMED, ceiling-compliant: promotion
      confidence = min(0.60, 0.35 + 0.25 x tess_verdict_confidence) (base derives
      from PROVENANCE_BASE_CONFIDENCE.LLM_GENERATED — no hardcoded literal), decay
      0.03 (guardian-slow) added to node, edge, and OKG decay CASE blocks.
      Refuted: status refuted, confidence 0.10, node retained as spawned_from
      anchor, Curiosity discharged via a pushed action outcome, spawn the
      why-was-I-wrong theory. Inconclusive: no change, no relief, cooldown.
      TESS_CONFIRMED does NOT join the hallucinated-knowledge trusted set; the
      never-verdicted precision ratio is additive (B4). Exceeding 0.60 is a CANON
      Std-3/Std-5 change available only via update-canon with Jim's explicit
      approval — recommended against and not needed. (2) Transport: asynchronous
      file-drop — tess/outbox/<theory_id>.request.json and
      tess/inbox/<theory_id>.verdict.json, idempotent poller, processed/ +
      deadletter/ dirs, schema_version on both payloads (shapes recorded in
      pipeline/replan/ARCH-RULINGS-A-learning-cluster.md §4). Not a sync CLI
      subprocess (blocking on hours-scale verdicts), not a queue (unjustified new
      infra, per the AD-0051 no-new-deployable reasoning). Verdict application is
      THE sanctioned theory promote/demote path (item 011's contradiction pruning
      rides it). Staleness threshold for pickResearchTarget delegated to
      briefing-builder with a logged governance assumption (~72h suggested) after
      confirming queryEntities returns a timestamp.
    rationale: >
      The 0.60 ceiling is the system's protection against exactly the
      confidently-held-but-unverified knowledge this item's own detector sharpening
      treats as pathology; an automated statistical pipeline must not share the
      guardian's exception. 0.60-with-slow-decay already dominates all non-guardian
      knowledge — the feature loses nothing. File-drop matches the source's own
      async contract, house precedent, durability, and restart-safety.
    alternatives:
      - option: "TESS_CONFIRMED exceeds 0.60 (guardian-equivalent tier)"
        rejected_because: CANON Std-3/Std-5 change — reserved to Jim via update-canon; splits guardian asymmetry and blurs the trusted-provenance line.
      - option: "Sync CLI subprocess / message queue transport"
        rejected_because: Blocking call on hours-scale verdicts is architecturally wrong; a queue is new infra for a single-consumer local integration.
    consequences: >
      Epic B (B1-B4) is now ticketable; Epic A minors folded (0.35 derives from the
      provenance table; staleness assumption logged). Confidence ordering fixed
      across the cluster: 0.45 consolidation-insight < 0.60 Tess-confirmed < 0.90
      guardian. Still sequenced after 008/015/016 per the plan.
    canon: "Std-3 ceiling + Std-5 guardian asymmetry UPHELD (no non-guardian path above 0.60); Std-2 provenance honest (new tier, never relabeled); theater — curiosity relief only at real resolution, never at proposal (CON-2)"
